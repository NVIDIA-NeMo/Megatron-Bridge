<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="520" viewBox="0 0 1780 520" role="img" aria-labelledby="title desc">
<title id="title">TrainingEngine: loose and strict data contracts</title>
<desc id="desc">User input and output sit outside the engine.forward_only or engine.forward_backward call. Inside the call are preprocess, MCore, and postprocess. Blue regions indicate loose, customizable data pipelines; the green region indicates the strict prepared-input and model-output contracts.</desc>
