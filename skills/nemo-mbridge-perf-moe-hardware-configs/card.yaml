optimization_patterns:
  - name: ep_comm_overlap
    impact: "+17.729% throughput on measured Qwen3 30B 16×H100 HybridEP shape"
    caveat: "regressed on the measured Qwen3.5 GDN-MoE shape; benchmark separately"
  - name: shared_expert_overlap
    impact: "+0.44% step-time gain on the final measured Qwen3.5 GDN-MoE shape"
    caveat: "only 30.8% of the measured shared side stream overlapped the primary stream; connections=2 and high priority both regressed"
  - name: hybridep_dispatcher
    impact: "about +20% over native all-to-all on measured Qwen3.5 16×H100 shape"
  - name: hybridep_fused_permutation
    impact: "-4.12% step time after validating live chunk-size compatibility on measured Qwen3.5 16×H100 shape"
  - name: force_balance_routing
    impact: "+5-10% MFU over dropless"
  - name: 1f1b_overlap
    impact: "+15% on H100, varies on GB200"
  - name: cuda_device_max_connections
    impact: "+48.99% throughput for 1 versus 32 on the measured Qwen3.5 owner-release overlap control"
    caveat: "still 1.89x slower than no overlap; the profile showed NCCL/rank drift collapsed but useful intersection also fell to 0.156 seconds"
  - name: cuda_graphs
    impact: "+10-15% with attn+moe_router+moe_preprocess scope"
  - name: cpu_binding
    impact: "+15% on GB200"
    caveat: "verified per-rank binding was throughput-neutral on the measured 16×H100 Qwen3.5 GPU-bound winner"
  - name: mbs_tuning
    impact: "up to +15% from MBS sweep"

evidence:
  - "examples/model_verification_cards/qwen3-30b-a3b/card.yaml"
  - "src/megatron/bridge/perf_recipes/qwen/h100/qwen3_moe.py"
  - "[MoE Perf] MCore Release Performance Tracker - DeepSeek-V3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3-Next"
  - "[MoE Perf] MCore Release Performance Tracker - DSV3 Long-Context"

known_limitations:
  - Container versions can cause significant performance regressions
  - Dispatcher recommendations are starting points; the validated Qwen3 30B H100 winner used HybridEP rather than DeepEP
  - VPP must divide transformer layers evenly across PP stages
  - FP8 MFU numbers use higher peak FLOPS denominator than BF16
  - Configs are point-in-time measurements; mcore/TE updates may change results
  - CUDA_DEVICE_MAX_CONNECTIONS is workload-specific; a large overlap-relative gain does not establish an end-to-end win
  - No-overlap does not make a maximal dispatcher SM cap safe; 108 regressed the measured Qwen3.5 H100 path by 19.97% step time versus 32
  - The measured Qwen3.5 H100 num_sms=20 winner improved only 0.78% versus 32; it is a shallow same-stack optimum, not a portable hardware constant
  - The measured Qwen3.5 H100 num_sms=16 point improved only another 0.46% versus 20 and by itself remained 11.73% below the gate; low-SM tuning had diminishing returns
  - The measured Qwen3.5 H100 num_sms=12 point regressed 9.28% versus 16; too few dispatcher SMs underprovision communication just as too many create contention
  - Verified H100 NUMA binding changed the Qwen3.5 winner from 22.340925 to 22.341025 seconds, a 0.000448% regression; keep host placement as launcher hygiene unless a matched workload proves a throughput gain
  - TP2/EP16/ETP1/MBS2/SP preserved the measured Qwen3.5 expert EDP, microsteps, and grouped-GEMM row shape but regressed steps 5-8 to 26.219175 seconds / 224.669 model TFLOP/s/GPU; dense shard and TP/SP communication costs still require end-to-end validation
  - A Qwen3.5 asymmetric split kept dispatch at 16 SMs and raised only combine to 20 because combine had the longer profiled active union, but regressed steps 5-8 from 22.340925 to 22.49995 seconds / about 263.67 to 261.81 model TFLOP/s/GPU; size phase budgets by end-to-end A/B rather than trace duration
  - HybridEP preprocessing, dispatch/combine, and fused permute/unpermute have independent block budgets; preprocessing-only 108-to-32 regressed 0.418%, while unpermute-only 108-to-32 regressed 4.742% to 23.400 seconds / 251.73 model TFLOP/s/GPU
  - The apparent static/shared combine-only 128-to-64 and 128-to-256 sweeps were not valid kernel A/Bs: fused-template normalization copied the unchanged 64-token dispatch chunk into preprocessing and combine, so the environment-only combine values were inert
  - A corrected exact-2-node full-field 128/128/128 A/B was audited as effective 128/128/128 with stages 10/4/2, blocks 108/108, and valid=True; it averaged 23.5981 seconds / 249.62 model TFLOP/s/GPU and regressed step time 5.627% versus the effective-64/64/64 winner
  - Reserving compiler SMs did not repair the uniform grouped-MM transfer gap; 16-SM carveout was neutral for shared concurrency and 24 regressed
