failure_modes:
  - name: fragmentation_oom
    symptom: "OOM on a single rank despite headroom on other ranks"
    likely_cause: memory fragmentation from default allocator
    fix: "set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
  - name: expandable_segments_nccl_ub_conflict
    symptom: "RuntimeError with --use-nccl-ub"
    likely_cause: expandable allocator incompatible with NCCL UB registration
    fix: "remove expandable_segments:True or disable --use-nccl-ub"
  - name: allocator_runtime_calls_during_overlap
    symptom: "many cuMem calls, long cudaEventSynchronize time, and idle/busy rank split"
    likely_cause: "allocator activity correlated with a cross-stream lifetime or scheduler critical path"
    fix: "run an exact allocator-only A/B; retain the better allocator and inspect schedule storage release if native is no better"
  - name: native_allocator_overlap_fragmentation
    symptom: "iteration 2 stalls while some ranks approach physical memory capacity"
    likely_cause: "native allocator fragmentation or delayed reuse amplifies rank skew"
    fix: "restore expandable_segments and profile the schedule rather than continuing with backend:native"
  - name: cuda_malloc_async_overlap_capacity
    symptom: "all ranks OOM in the first fine-grained backward"
    likely_cause: "stream-ordered pool cannot reuse enough memory under the combined activation lifetime"
    fix: "reject cudaMallocAsync for the shape; reduce activation lifetime or change parallelism before timing"
  - name: paged_stash_no_eligible_tensors
    symptom: "moe_paged_stash=true but max_tokens_dict is None and no stash buffer is allocated"
    likely_cause: "custom expert ops did not tag eligible token-major saved tensors"
    fix: "mark only eligible activation tensors, rerun capture, and require allocate_stash_buffers cuda before timing"
  - name: paged_stash_full_schedule_capacity
    symptom: "real stash buffers allocate after capture, then optimizer state OOMs before the next step"
    likely_cause: "PP1 full-schedule stash buffers and optimizer-state lifetime exceed device capacity"
    fix: "combine with a validated lifetime reduction, narrow eligible activation scope, or change parallelism before timing"
  - name: scheduler_input_retention_optimizer_oom
    symptom: "finite first step followed by all-rank 1.89 GiB optimizer-state OOM"
    likely_cause: "disabling immediate schedule-input release retains about 5.8 GiB of additional live allocation"
    fix: "restore early reclamation and test dependency-aware retirement instead of retaining inputs until backward"
  - name: pp_increase_loses_dp
    symptom: throughput drop despite lower memory
    likely_cause: increasing PP reduces DP, increasing gradient accumulation steps
    fix: try expandable_segments first before resizing parallelism
  - name: delayed_optimizer_state_oom
    symptom: "iteration 1 completes, then iteration 2 OOMs across ranks"
    likely_cause: Adam state is materialized after the first optimizer step
    fix: "validate precision-aware state dtypes, distributed optimizer/FSDP, or additional model parallelism"
  - name: mixed_fp8_cold_start_memory_spike
    symptom: "mixed FP8 first iteration is much slower than steady state and approaches physical GPU capacity even when grouped experts remain BF16"
    likely_cause: "FP8 compilation, scaling state, and non-expert precision boundaries add cold-start workspaces; the exact Qwen3.5 H100 run took 154.335 seconds and reached about 78.4 GiB/GPU"
    fix: "sample all-rank memory through the first optimizer step, then require a finite post-compile steady window to beat the exact BF16 control; blockwise reduced rank-0 max allocated/reserved memory to 63.369/67.228 GiB but did not improve steady throughput"
  - name: lora_sp_gathered_input_retention
    symptom: "LoRA + SP activation memory remains high"
    likely_cause: full gathered LoRA-A inputs are retained until backward
    fix: "set LoRA(sequence_parallel_input_regather=True) and verify the target is eligible"
known_constraints:
  - expandable_segments is incompatible with --use-nccl-ub
  - CPU offloading requires pipeline_model_parallel_size = 1
  - with CUDA graphs, set NCCL_GRAPH_REGISTER=0 alongside expandable_segments
  - sequence_parallel_input_regather has no effect when sequence parallelism is disabled
  - sequence_parallel_input_regather falls back for row-parallel, expert, TP1, CUDA graph, CPU-offload, and overlapping recompute paths
known_limitations:
  - expandable_segments fixes fragmentation but not genuine capacity limits
  - expandable_segments is not guaranteed to be throughput-neutral for every fine-grained multi-stream schedule
  - parallelism resizing (TP/PP) has significant throughput costs
  - no automatic memory profiling to recommend the optimal strategy
  - LoRA input re-gather adds a backward all-gather and may not improve throughput
  - LoRA input re-gather applies only to eligible non-expert column-parallel LoRA-A projections
  - reduced-precision optimizer states require convergence validation beyond a short capacity smoke test
evidence:
  - docs/parallelisms.md
  - docs/performance-guide.md
  - "PR #3107 (Llama3 70B SFT OOM fix experiment)"
  - "PR #4581 (LoRA sequence-parallel input re-gather experiments)"
  - "Qwen3.5 H100 exact 2-node allocator measurement"
  - "Qwen3.5 H100 MoE-combine input-retention measurement"
  - "Qwen3.5 H100 dependency-aware owner-stream release measurement"
  - "Qwen3.5 H100 cudaMallocAsync owner-release overlap measurement"
  - "Qwen3.5 H100 selective GDN recompute overlap measurement"
  - "Qwen3.5 H100 paged-stash eligibility gate"
  - "Qwen3.5 H100 paged-stash capacity gate"
  - "Qwen3.5 H100 selective-GDN plus paged-stash measurement"
  - tests/unit_tests/peft/test_lora_sp_input_regather_distributed.py
  - 3rdparty/Megatron-LM/megatron/core/transformer/moe/README.md
follow_up_validation:
  - Quantify expandable_segments memory savings across different model sizes.
  - Measure interaction between expandable_segments and CUDA graph memory overhead.
  - Repeat allocator-only profiles for fine-grained MoE overlap after scheduler storage-lifetime fixes.
  - Measure LoRA input re-gather across more sequence lengths, TP sizes, and target-module sets.
