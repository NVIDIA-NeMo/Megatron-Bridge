title: memory_tuning
validated_on: "2026-07-26"
summary: >
  Techniques for reducing peak GPU memory to fix OOM or increase headroom.
  Current coverage: expandable segments (fragmentation fix), delayed
  optimizer-state allocation and precision, parallelism resizing, activation
  recompute, LoRA sequence-parallel input re-gather, and CPU offloading
  constraints. A common OOM fix is setting
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,
  which can eliminate memory fragmentation without a measured throughput cost
  on conventional schedules. Fine-grained multi-stream schedules still require
  a matched allocator A/B: a 16x H100 Qwen3.5 HybridEP-overlap experiment showed
  that native allocation worsened rank skew and iteration time despite removing
  expandable-allocator VMM traffic. Measured on
  Llama3 70B SFT (32x H100, FP8 CS): expandable_segments eliminated the
  baseline OOM without any parallelism changes. By contrast, doubling PP
  (4→8) cost ~6% and halved DP, while doubling TP (4→8) caused -28%
  regression. CPU offloading is blocked when PP > 1.
validation_status:
  expandable_segments:
    - verified  # standard PyTorch allocator option
  cpu_offloading_pp_incompatibility:
    - code_verified  # MCore transformer_config.py
  llama3_70b_sft_fp8_cs_experiment:
    - measured  # PR #3107, 32x H100, TP4 PP4 DP2
  lora_sequence_parallel_input_regather:
    - measured  # PR #4581, real checkpoints and SQuAD on H100
    - parity_verified  # TP2 BF16/FP32 and fused two-microbatch main_grad
  qwen35_hybridep_allocator_ab:
    - measured  # exact 2-node/16-H100 allocator-only A/B
  qwen35_combine_input_retention_ab:
    - measured  # exact 2-node/16-H100 scheduler lifetime A/B
  qwen35_owner_stream_release_ab:
    - measured  # exact 2-node/16-H100 dependency-aware retirement A/B
  qwen35_cuda_malloc_async_overlap_ab:
    - measured  # exact 2-node/16-H100 first-backward OOM
  qwen35_gdn_recompute_overlap_ab:
    - measured  # exact 2-node/16-H100 lifetime reduction
  qwen35_paged_stash_activation_gate:
    - code_verified
    - measured_invalid_control  # captured no eligible tensors
    - measured_capacity_failure  # activated stash then OOMed
  qwen35_gdn_paged_stash_overlap_ab:
    - measured  # finite but throughput-rejected
training_dimensions:
  speed:
    effect: "often neutral for expandable_segments; validate fine-grained overlap schedules"
    confidence: medium
    rationale: >
      expandable_segments:True had no throughput impact in the measured Llama3
      workload. In a Qwen3.5 HybridEP-overlap run, switching to backend:native
      made iteration 1 take 151.9 seconds and iteration 2 stall for more than
      six minutes, versus about 82.7 seconds per step with expandable segments.
      Parallelism resizing (TP, PP) can cost 6-28% depending on the strategy.
      Measured LoRA input re-gather cost ranged from 0.34% to 6.74%.
  memory:
    effect: "eliminates fragmentation-induced OOM; can reduce optimizer-state and retained LoRA + SP memory"
    confidence: high
    rationale: >
      The baseline OOM at 58.8 GB was caused by memory fragmentation, not
      insufficient capacity. expandable_segments:True eliminated the OOM
      without any model or parallelism changes. VPP changes do not
      meaningfully affect peak memory. LoRA input re-gather saved 0.8-4.7 GB
      in measured TP+SP workloads. Precision-aware Adam state dtypes can
      reduce delayed optimizer-state pressure.
  scale:
    effect: "allocator is per-process, but rank skew can enter the distributed critical path"
    confidence: medium
    rationale: >
      The setting is per-process, but allocator-induced fragmentation or
      delayed reuse can make ranks reach collectives at different times in a
      fine-grained overlap schedule. LoRA input re-gather has no effect when
      sequence parallelism is disabled.
  convergence:
    effect: "no change for allocator/re-gather; validate reduced-precision optimizer states"
    confidence: medium
    rationale: >
      Allocator settings do not affect computation or numerics. LoRA input
      re-gather matched baseline outputs and gradients in TP2 parity tests.
      Reduced-precision optimizer states are a numerical choice and need
      workload-specific multi-step validation.
  stability:
    effect: "improved — reduces fragmentation-induced OOM"
    confidence: high
    rationale: >
      expandable_segments reduces the likelihood of OOM from memory
      fragmentation, which is the most common cause of borderline OOM.
enable_when:
  - training OOMs or is close to the GPU memory limit
  - OOM occurs on a single rank while others have headroom (fragmentation)
  - iteration 1 completes but iteration 2 OOMs when Adam state is materialized
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True is not yet set
  - LoRA or PEFT training uses sequence parallelism and needs lower activation memory
avoid_when:
  - using --use-nccl-ub (NCCL user-buffer registration is incompatible with expandable allocator)
interactions:
  required: []
  conditional:
    - "with CUDA graphs: set NCCL_GRAPH_REGISTER=0 when using expandable_segments (required on pre-Blackwell GPUs)"
    - "with NCCL UB: expandable_segments is incompatible with --use-nccl-ub"
    - "with fine-grained MoE overlap: compare allocator runtime APIs, iteration 2, and all-rank memory/utilization in a matched allocator A/B"
    - "cudaMallocAsync is not interchangeable with expandable segments; require a completed optimizer step before timing it"
    - "with MoE paged stash: require eligible saved-tensor markers and an actual allocate_stash_buffers cuda log after capture"
    - "with LoRA + SP: sequence_parallel_input_regather trades a backward all-gather for lower retained activation memory"
    - "with precision-aware Adam: reduced state dtypes require numerical validation"
  incompatible:
    - "--use-nccl-ub with expandable_segments:True"
feature_meaning:
  PYTORCH_CUDA_ALLOC_CONF: >
    PyTorch CUDA allocator configuration. expandable_segments:True uses
    expandable memory segments that reduce fragmentation by allowing the
    allocator to grow segments rather than allocating fixed-size blocks.
  sequence_parallel_input_regather: >
    LoRA option that retains the sequence-local LoRA-A input instead of the
    full gathered input, then re-gathers it during backward for the LoRA-A
    weight gradient. It has no effect when sequence parallelism is disabled.
  precision_aware_optimizer_state: >
    use_precision_aware_optimizer permits explicit main-gradient and Adam
    moment dtypes. BF16 states can reduce capacity pressure while FP32 main
    parameters and parameter remainders are retained.
  moe_paged_stash_activation_gate: >
    A paged-stash config is active only when eligible token-major saved tensors
    carry the grouped_tensor_scale_inv marker and capture produces concrete
    CUDA stash buffers. A max_tokens_dict-is-None skip is an unpaged control.
config_keys:
  - "env: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
  - "peft: LoRA.sequence_parallel_input_regather=True"
  - optimizer.use_precision_aware_optimizer
  - optimizer.main_grads_dtype
  - optimizer.exp_avg_dtype
  - optimizer.exp_avg_sq_dtype
recommended_path:
  first_try: "set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
  second: "if step 2 OOMs after a finite step 1, inspect and tune optimizer-state precision"
  third: "for LoRA + SP, enable sequence_parallel_input_regather"
  fourth: "add selective activation recompute (core_attn)"
  fifth: "increase PP or use distributed optimizer"
  last_resort: "increase TP (severe throughput cost)"
expected_metric_change:
  - metric: peak_memory
    direction: down
    magnitude: "eliminates fragmentation overhead (variable, often 2-10 GB effective)"
    conditions: any model, any GPU
    evidence: measured_pr_3107
  - metric: gpu_utilization
    direction: unchanged
    magnitude: "0%"
    conditions: conventional Llama3 schedule measured in PR #3107
    evidence: measured_pr_3107
  - metric: step_time
    direction: workload_dependent
    magnitude: "82.7 s expandable versus 151.9 s native first iteration and >6 min native second-iteration stall"
    conditions: Qwen3.5-35B-A3B, exact 2-node/16-H100 HybridEP fine-grained overlap
    evidence: mb_998_qwen35_allocator_ab
  - metric: peak_memory
    direction: down
    magnitude: "0.8-4.7 GB measured"
    conditions: LoRA with eligible column-parallel adapters and sequence parallelism
    evidence: measured_pr_4581
  - metric: throughput
    direction: down
    magnitude: "0.34-6.74% measured"
    conditions: LoRA sequence-parallel input re-gather
    evidence: measured_pr_4581
measured_results:
  - model: Llama3 70B
    task: sft
    precision: FP8_CS
    gpus: 32
    gpu: H100_80GB
    seq_length: 4096
    mbs: 1
    gbs: 32
    golden_tflops: 709.93
    regression_threshold_pct: 5
    experiments:
      - name: baseline_without_expandable_segments
        tp: 4
        pp: 4
        vpp: 5
        dp: 2
        tflops: 704
        vs_golden_pct: -0.8
        peak_mem_gb: 58.8
        status: OOM
        note: "OOM caused by memory fragmentation"
      - name: baseline_with_expandable_segments
        tp: 4
        pp: 4
        vpp: 5
        dp: 2
        tflops: 704
        vs_golden_pct: -0.8
        peak_mem_gb: ~59
        status: passed
        note: "expandable_segments eliminated fragmentation-induced OOM"
      - name: more_pp
        tp: 4
        pp: 8
        vpp: 5
        dp: 1
        tflops: 668.0
        vs_golden_pct: -5.9
        peak_mem_gb: 53.2
        status: passed_mem_borderline_perf
        note: "halved DP (2→1) means 32 gradient accumulation steps"
      - name: more_tp
        tp: 8
        pp: 4
        vpp: 5
        dp: 1
        tflops: 508.7
        vs_golden_pct: -28.4
        peak_mem_gb: 50.2
        status: severe_perf_regression
        note: "doubling TP increases all-reduce comm volume, DP=1 means no micro-batch overlap"
  - name: cpu_offloading_blocked
    note: >
      CPU activation offloading (cpu_offloading=True) was tested as an
      alternative but is incompatible with PP > 1. All experiments raised
      ValueError. This approach is blocked for any model using PP > 1.
  - name: lora_sequence_parallel_input_regather
    task: peft_sft
    gpu: H100
    dataset: SQuAD
    experiments:
      - model: Qwen3-8B
        parallelism: TP2
        seq_length: 8192
        baseline_peak_mem_gb: 47.545
        regather_peak_mem_gb: 42.814
        throughput_change_pct: -6.74
      - model: Qwen3-30B-A3B
        parallelism: TP4_EP4
        baseline_peak_mem_gb: 29.890
        regather_peak_mem_gb: 28.321
        throughput_change_pct: -2.89
      - model: GPT-OSS-120B
        parallelism: TP2_EP8
        baseline_peak_mem_gb: 52.185
        regather_peak_mem_gb: 51.371
        throughput_change_pct: -0.34
