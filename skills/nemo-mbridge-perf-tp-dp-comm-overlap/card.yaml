title: tp_dp_comm_overlap
validated_on: "2026-07-27"
summary: >
  Megatron-Bridge exposes communication overlap across tensor parallel, data
  parallel, and pipeline parallel paths through CommOverlapConfig, but the
  available behavior and defaults differ by mode.
validation_status:
  tp_overlap_gating:
    - code_verified
  dp_overlap_defaults:
    - code_verified
  optimizer_step_param_gather_overlap:
    - code_verified
    - runtime_rejected_on_qwen35_single_model_chunk
  pp_overlap_auto_selection:
    - code_verified
  launch_env_wiring:
    - code_verified
  overlap_perf_claims:
    - doc_only
feature_meaning:
  tp_overlap: >
    Overlap of tensor-parallel communication with GEMM work, typically tied to
    sequence parallelism.
  dp_overlap: >
    Overlap of gradient reduce-scatter and parameter all-gather on the
    distributed-optimizer path.
  optimizer_step_param_gather_overlap: >
    Overlap distributed-optimizer parameter all-gather with optimizer work;
    this is separate from ordinary DDP overlap_param_gather.
  pp_overlap: >
    Overlap of pipeline send and receive behavior, especially relevant for
    interleaved pipeline schedules.
recommended_path:
  comm_overlap.tp_comm_overlap: true_when_tp_and_sp_are_enabled
  ddp.use_distributed_optimizer: true_for_dp_overlap
  optimizer.overlap_param_gather_with_optimizer_step: benchmark_with_matching_comm_overlap_field
known_constraints:
  - TP overlap requires tensor_model_parallel_size > 1.
  - TP overlap requires sequence_parallel=True.
  - TP overlap requires Transformer Engine to be available.
  - DP overlap is tied to the distributed-optimizer path.
  - Optimizer-step parameter-gather overlap must be set consistently on optimizer and CommOverlapConfig and disables ordinary DDP bucketing.
  - MCore splits the first model chunk from the remaining chunks for optimizer-step parameter-gather overlap; the measured Qwen3.5-35B-A3B TP1/PP1/EP16 path had one chunk and rejected the resulting empty remainder group before iteration 1.
  - Checkpoint behavior needs separate validation because some recipes disable optimizer-step parameter-gather overlap for async-checkpoint compatibility.
  - PP overlap behavior depends on the pipeline schedule and is not identical for every PP setup.
  - Launch-time environment tuning is part of practical overlap behavior.
known_limitations:
  - Not every public recipe enables overlap even when the feature exists.
  - Repo docs do not provide benchmark-backed proof for optimal overlap settings.
evidence:
  - docs/training/communication-overlap.md
  - docs/performance-guide.md
  - src/megatron/bridge/training/comm_overlap.py
  - src/megatron/bridge/training/config.py
  - src/megatron/bridge/training/mixed_precision.py
  - src/megatron/bridge/perf_recipes/_common.py
  - src/megatron/bridge/perf_recipes/qwen/h100/qwen3_moe.py
  - src/megatron/bridge/recipes/run_plugins.py
  - 3rdparty/Megatron-LM/megatron/training/models/dist_utils.py
  - tests/unit_tests/models/test_model_instantiation.py
  - tests/unit_tests/training/test_comm_overlap.py
follow_up_validation:
  - Fix or explicitly gate the single-model-chunk case before benchmarking optimizer-step parameter-gather overlap without virtual pipeline chunks.
  - Add a functional PP smoke for interleaved pipeline overlap.
