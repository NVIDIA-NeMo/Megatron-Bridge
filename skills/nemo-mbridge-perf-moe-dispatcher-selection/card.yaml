evidence:
  - "[MoE Perf] MCore Release Performance Tracker - DeepSeek-V3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3-Next"

known_limitations:
  - HybridEP is topology-sensitive; it also worked on the measured two-node EOS H100 topology
  - On the measured 8-GPU-node runtime, HybridEP requires the EP group size to be divisible by 8; CP4/EP4 failed at first dispatch
  - DeepEP SM count tuning is hardware-specific
  - A successful DeepEP import does not rule out a first-dispatch CPU timeout
  - HybridEP static rank capacity plus TE op fuser produced a padded-shape mismatch on the measured H100 stack
  - Per-expert capacity factor 1.0 reached 224.9 TFLOPS/GPU but can drop random routes; it is only a host-sync upper bound, not a valid dropless result
  - Container version can cause performance regression
  - 1F1B overlap + DeepEP may regress on some configurations
