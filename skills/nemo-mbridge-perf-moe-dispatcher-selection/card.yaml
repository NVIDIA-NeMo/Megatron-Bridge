title: moe_dispatcher_selection
validated_on: "2026-07-26"
summary: >
  Empirical guide for selecting MoE token dispatchers (AlltoAll, DeepEP,
  HybridEP, and experimental NCCL EP) based on hardware platform, model scale,
  and EP degree.
  Backed by measured benchmarks from DSV3, Qwen3, and Qwen3-Next experiments
  across H100, B200, GB200, and GB300 systems.

validation_status:
  dsv3_h100_benchmarks:
    - measured
  dsv3_gb200_benchmarks:
    - measured
  dsv3_gb300_benchmarks:
    - measured
  dsv3_b200_benchmarks:
    - measured
  qwen3_h100_benchmarks:
    - measured
  qwen35_text_h100_benchmarks:
    - measured
  qwen3_gb200_benchmarks:
    - measured
  qwen3_next_gb200_benchmarks:
    - measured
  qwen35_hybridep_fused_permutation:
    - measured
    - profile_validated
  qwen35_h100_grouped_mm_static_dispatch:
    - measured
    - profile_validated
  ncclep_hardware_and_build_gates:
    - static_analysis
    - container_inventory

training_dimensions:
  speed:
    effect: "HybridEP ~10-20% faster than DeepEP/AlltoAll on NVL72 systems"
    confidence: high
    rationale: >
      Measured across DSV3 and Qwen3 on GB200/GB300. HybridEP exploits NVLink
      domain for fused intra/inter-node dispatch.
  memory:
    effect: "HybridEP uses ~15% less GPU memory than AlltoAll"
    confidence: high
    rationale: >
      Measured on Qwen3 GB200: HybridEP ~75% vs AlltoAll ~90% memory utilization.
  scale:
    effect: "HybridEP advantage grows with EP degree"
    confidence: medium
    rationale: >
      Higher EP means more communication; HybridEP's NVLink optimization
      benefits more at EP=32+ vs EP=8.

dispatcher_recommendations:
  h100:
    recommended: "A/B DeepEP and HybridEP after both complete a real dispatch"
    rationale: >
      Runtime compatibility and workload shape can outweigh the platform
      default; the measured Qwen3.5 text shape favored HybridEP.
  b200:
    recommended: DeepEP
    rationale: "Best measured perf for cross-node EP"
  gb200_nvl72:
    recommended: HybridEP
    rationale: "Exploits NVLink domain; ~8% MFU jump over optimized DeepEP"
  gb300_nvl72:
    recommended: HybridEP
    rationale: "Same NVLink advantage as GB200"

key_tuning_parameters:
  - name: moe-deepep-num-sms
    default: 20
    recommended: "tune per workload"
    rationale: "Controls SM count for DeepEP communication kernels; default 20 is a starting point"
  - name: moe-hybridep-num-sms
    default: 16
    recommended: "16-32 starting range, tune per workload; 16 narrowly won the measured Qwen3.5 H100 sweep so far"
    rationale: "Controls SM count for HybridEP communication; 20 improved 0.78% versus 32, 16 improved another 0.46%, 12 regressed 9.28% versus 16, and 108 regressed 19.97% versus 32 on the measured Qwen3.5 shape"
  - name: HybridEP fused-permutation chunk sizes
    recommended: "log and validate the post-normalization dispatch/combine/preprocessing template"
    rationale: "Joint runtime normalization enabled fused permutation and reduced exact GBS1024 step time by 4.12%; coupled 64-token chunks beat coupled 32 and 128 by 1.46% and 1.86%. A later apparent combine-only 128-to-64 A/B was invalid because the shim copied the unchanged 64-token dispatch chunk into all three fields. A true final-schedule 128/128/128 A/B was then audited as stages 10/4/2, blocks 108/108, valid=True and regressed step time 5.627% versus effective 64/64/64."
  - name: moe-hybridep-num-sms-preprocessing
    default: 108
    recommended: "inspect the instantiated fused template and A/B independently from dispatch/combine and permute/unpermute"
    rationale: "On Qwen3.5 16xH100, changing only preprocessing from 108 to 32 left fused permute/unpermute at 108 and dispatch/combine at 16, then regressed step time 0.418%"
  - name: moe-hybridep-num-blocks-unpermute
    default: runtime-specific
    recommended: "inspect the live template and tune independently from preprocessing and permute"
    rationale: "On Qwen3.5 16xH100, changing only fused unpermute from 108 to 32 blocks regressed step time 4.742% to 23.400 seconds / 251.73 model TFLOP/s/GPU"
  - name: NUM_OF_HYBRID_EP_RANKS_PER_NVLINK_DOMAIN
    default: varies
    recommended: "match NVLink domain size (e.g., 16 for GB200)"
  - name: moe-router-force-load-balancing
    recommended: always
    rationale: "Force balance consistently outperforms dropless by 5–10%"
  - name: CUDA_DEVICE_MAX_CONNECTIONS
    default: 1
    note: "Set to 32 when using EP overlap + CUDA graphs"
  - name: moe-ncclep-static-shape
    default: false
    recommended: "false on H100; true only on SM100+ with the TE op fuser and NVTE_CUTEDSL_FUSED_GROUPED_MLP=1"
    rationale: "Dynamic mode works with the supported TE build but narrows through a D2H count sync; static mode removes that boundary and requires the Blackwell CuTe DSL fused grouped MLP"
  - name: moe-ncclep-use-symm-mem
    default: false
    recommended: false
    rationale: "The current NCCL EP manager rejects the symmetric-memory zero-copy path as not implemented"
  - name: moe-expert-rank-capacity-factor
    default: null
    recommended: "set explicitly and validate routed-count headroom for NCCL EP"
    rationale: "NCCL EP uses it to size the receive buffer and hard-traps on overflow"

best_measured_configs:
  - model: "DSV3 685B w/ MTP"
    hardware: "1024×H100"
    dispatcher: DeepEP
    precision: FP8-Block
    mfu: "~19%"
    tflops: ~370
    parallelism: "TP2 EP64 PP8 VPP4"
  - model: "DSV3 671B no MTP"
    hardware: "256×GB200"
    dispatcher: HybridEP
    precision: FP8-MX
    mfu: "~19%"
    tflops: ~1000
    parallelism: "TP1 EP32 PP8 VPP4"
  - model: "DSV3 685B w/ MTP"
    hardware: "256×GB200"
    dispatcher: HybridEP
    precision: FP8-MX
    mfu: "~22%"
    tflops: ~1100
    parallelism: "TP1 EP64 PP4 VPP4"
  - model: "DSV3 685B w/ MTP"
    hardware: "256×GB300"
    dispatcher: HybridEP
    precision: FP8-MX
    mfu: "~25%"
    tflops: ~1200
    parallelism: "TP1 EP64 PP4 VPP4"
  - model: "Qwen3 235B-A22B"
    hardware: "128×GB200"
    dispatcher: HybridEP
    precision: BF16
    mfu: "~28%"
    tflops: ~700
    parallelism: "TP1 EP32 PP4 VPP12"
  - model: "Qwen3 235B-A22B"
    hardware: "256×H100"
    dispatcher: DeepEP
    precision: BF16
    mfu: "~30%"
    tflops: ~300
    parallelism: "TP2 EP32 PP8 VPP4"
  - model: "Qwen3.5 35B-A3B"
    hardware: "16×H100"
