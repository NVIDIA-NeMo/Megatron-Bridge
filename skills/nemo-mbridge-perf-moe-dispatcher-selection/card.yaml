    note: "Development stack with static dispatch, experimental SM90 BF16 grouped-MM, and normal-priority shared-expert overlap; not yet the public recipe or a qualifying 50-step result"

evidence:
  - "[MoE Perf] MCore Release Performance Tracker - DeepSeek-V3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3"
  - "[MoE Perf] MCore Release Performance Tracker - Qwen3-Next"

known_limitations:
  - The accepted Qwen3.5 H100 training image contains TE 2.15 and has no transformer_engine.pytorch.ep module; a separate torch-2.13/TE-2.17 build exposed NCCL EP but its first real 2-node dispatch timed out, so no NCCL EP throughput result exists
  - NCCL EP requires the exact Transformer Engine container build to expose transformer_engine.pytorch.ep with EpBuffer, ep_bootstrap, ep_dispatch, ep_combine, and ep_finalize; MCore source support alone is insufficient
  - The pinned TE 2.17 source uses NVTE_WITH_NCCL_EP, enables the extension by default for SM90+ targets, and requires the recursive NCCL submodule plus NCCL 2.30.4 or newer; NVTE_WITH_NCCL_EP=0 disables it
  - NCCL EP dynamic shape is the only H100-compatible mode and performs a tokens_per_expert.sum().item() D2H synchronization that serializes the 1F1B overlap boundary
  - NCCL EP static shape requires SM100+, the Transformer Engine operation fuser, and NVTE_CUTEDSL_FUSED_GROUPED_MLP=1
  - NCCL EP symmetric-memory/zero-copy payload buffers are not implemented in the current manager
  - NCCL EP receive-capacity overflow hard-traps; the rank-capacity factor is a correctness boundary, not a token-dropping tuning knob
  - HybridEP is topology-sensitive and can work outside NVL72 only when the installed runtime supports the target topology
  - DeepEP SM count tuning is hardware-specific
  - A successful backend import does not prove dispatch/combine runtime compatibility
  - A TE NCCL-EP symbol probe does not validate the model's other native/JIT kernels; the measured torch-2.13 container required an exact causal-conv1d source rebuild after its preinstalled extension referenced a missing torch COW ABI symbol
  - Warm JIT caches can mask source/dependency incompatibility; the accepted torch-2.12 Qwen3.5 run reused FlashQLA artifacts even though TileLang 0.1.8 lacked T.async_copy, while a fresh cache required FlashQLA 0.1.2's pinned TileLang 0.1.9 and apache-tvm-ffi 0.1.9
  - Container migrations need a real model import plus fresh-cache model-shape forward/backward CUDA smoke before multi-rank dispatcher timing
  - The exact-2-node torch-2.13/TE-2.17 HybridEP control averaged 24.236950 seconds / 243.043440 model TFLOP/s/GPU, 8.486779% slower than the accepted torch-2.12 short-run control
  - The matched NCCL-EP candidate completed bootstrap and reached iteration 0, but all GPUs stayed idle until the 101010 ms backend timeout and all 16 ranks emitted NCCL error 2 at nccl_ep.cc:886; the error did not propagate to Python and no performance sample completed
  - A 16xH100 Qwen3.5 DeepEP candidate passed import, construction, and config validation but timed out in the first inter-node dispatch; verify the implementation's adaptive-routing requirement before treating the backend as benchmarkable
  - Clear HybridEP-only rank capacity with a true YAML null when switching backends; a CLI literal None may remain a non-null string and fail MCore validation
  - Static capacity must preserve GroupedLinear shapes and all routed work
  - Hopper static rank capacity is blocked when the selected Transformer Engine operation-fuser GroupedMLP path is sm100-only
  - Fused HybridEP permutation requires compatible live dispatch, combine, and preprocessing chunk sizes
  - A config input is not an A/B unless the post-normalization JIT template differs; the measured static/shared path silently reduced both intended combine-128 and combine-64 runs to effective 64/64/64 chunks
  - Record effective chunk, stage, and block fields together; the measured true 128/128/128 final-schedule template was valid at stages 10/4/2 and blocks 108/108 but regressed 5.627% versus 64/64/64
  - A requested 12/12-stage and 10/10-inflight dispatch-pipeline candidate averaged 23.463650 seconds / about 251.05 model TFLOP/s/GPU and was rejected, but its post-normalization marker was absent; do not treat the 5.025% step-time regression as a clean field-level ranking
  - Deterministic exact-balanced routing is not a safe substitute for native nonblocking metadata; the measured cross-rank route-only control segfaulted in its first backward
  - The GPU tokens_per_expert tensor is produced on the communication stream and must remain alive for the asynchronous path
  - Static nonblocking dispatch requires an overflow assertion and lifetime-safe GPU counts and communication handles
  - Scoped graphs were not additive after static dispatch removed the same CPU synchronization wall
  - No-overlap does not make maximal dispatcher occupancy safe; HybridEP num_sms=108 regressed the measured Qwen3.5 H100 path by 19.97% step time versus 32
  - On the same Qwen3.5 path, num_sms=20 improved step time only 0.78% versus 32; treat low-SM tuning as a shallow local optimum rather than a portable constant
  - Reducing the same Qwen3.5 cap from 20 to 16 improved only another 0.46%; low-SM gains were diminishing and by themselves left throughput 11.73% below the acceptance gate
  - Reducing the Qwen3.5 cap from 16 to 12 regressed step time 9.28%; the coarse sweep brackets an underprovisioned lower boundary rather than supporting ever-lower SMS values
  - A profile-motivated asymmetric split kept Qwen3.5 dispatch at 16 SMs and raised only combine to 20, but regressed steps 5-8 from 22.340925 to 22.49995 seconds / about 263.67 to 261.81 model TFLOP/s/GPU; active-union duration is a candidate signal, not a phase-SM sizing formula
  - HybridEP preprocessing, dispatch/combine, and fused permute/unpermute are independent resource budgets; the measured preprocessing-only 108-to-32 Qwen3.5 A/B regressed step time 0.418%, while the unpermute-only 108-to-32 A/B regressed 4.742%
  - On the no-overlap num_sms=16 path, changing only CUDA_DEVICE_MAX_CONNECTIONS from 32 to 1 improved step time 3.46% and reached 262.38 model TFLOP/s/GPU; this is a workload-specific launch-order A/B, not a portable dispatcher default
  - With num_sms=16, connections=1, and rank capacity 1.05 fixed, eager averaged 22.439 seconds versus 22.451 with TE-scoped graphs; the 0.053% difference is noise-level, so graphs provide no measurable benefit on the current static path
  - The matched no-overlap profile kept 401,840 kernels and zero HybridEP/expert intersection; connections=1 reduced HybridEP active union 8.77% versus 32 but increased idle gaps 15.02% from 4.204 to 4.836 seconds
  - The adjacent no-overlap connections=2 run averaged 22.502 seconds / about 261.78 model TFLOP/s/GPU, 0.28% slower than connections=1; added concurrency did not recover the idle tradeoff
  - Reducing the current Qwen3.5 winner's static rank capacity factor from 1.05 to 1.02 triggered the device-side route-overflow assertion in iteration 1 and yielded no valid throughput sample; keep 1.05 as the measured safe value for that route distribution
  - Scaled grouped-MM API presence did not imply a usable expert backend: tensorwise had no registered GEMM, and rowwise cached-scale FC1/FC2 forward was 7.39x/3.52x slower than BF16 on the real Qwen3.5 shapes
  - Adding scoped graphs to the shared-overlap winner averaged 22.365 seconds / 263.39 model TFLOP/s/GPU, 0.106% slower than eager; keep the simpler eager schedule
  - Fixed-capacity padded batched GEMM was 2.06x slower in forward and 2.56x slower through backward than variable grouped MM after the complete layout contract was included
  - The validation allocation is exactly 2 nodes with 8 H100 workers per node; an interactive GrpNodes=8 rejection describes partition-wide QoS consumption, not an eight-node benchmark request
  - Reducing EP16 to EP8 introduced expert-DP2 and OOMed at iteration 2 during optimizer-state materialization despite initialization and iteration 1 fitting
  - The profiled grouped/static winner still serialized 8.115 seconds of expert/linear work with 7.376 seconds of HybridEP work
  - Container version can cause performance regression
  - 1F1B overlap + DeepEP may regress on some configurations
