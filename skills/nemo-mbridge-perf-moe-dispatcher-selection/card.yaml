    precision: BF16
    tflops: 263.67
    step_time_ms: 22340.925
    num_sms: 16
    cuda_device_max_connections: 1
    static_rank_capacity_factor: 1.05
    shared_expert_overlap: true
    cuda_graph_impl: none
    scoped_graph_control_tflops: 262.38
    scoped_graph_control_step_time_ms: 22450.75
    scaled_grouped_mm_tensorwise_dispatch_available: false
    scaled_grouped_mm_rowwise_cached_fc1_slowdown: 7.39
    scaled_grouped_mm_rowwise_cached_fc2_slowdown: 3.52
    shared_overlap_scoped_graph_step_time_ms: 22364.525
    shared_overlap_scoped_graph_tflops: 263.39
    padded_bmm_forward_slowdown: 2.0625
    padded_bmm_forward_backward_slowdown: 2.5573
