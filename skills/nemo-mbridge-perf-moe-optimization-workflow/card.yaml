key_lessons:
  - "Platform characteristics drive strategy, not just model architecture"
  - "Parallel Folding unlocks independent attention/MoE optimization"
  - "FP8 shifts bottleneck from memory/compute to CPU overhead"
  - "Optimization is iterative: solving one wall exposes another"
  - "Use unprofiled steady timing for acceptance and matched profiles for causality"
  - "Use interval unions and communication/compute intersection; summed concurrent kernel durations are not wall time"
  - "Hybrid GDN MoE bring-up requires multiple optimizer steps; step 2 can be the first full-state memory point"
  - "Balance hybrid-model PP stages by parameter/block cost, not equal layer count"
  - "Persist TileLang/Inductor caches and separate kernel JIT from graph capture and steady replay"
  - "A faster GDN kernel is additive, but dispatcher/overlap can remain the dominant end-to-end lever"
  - "Benchmark HybridEP and EP overlap separately; overlap can regress a GDN-heavy MoE even after HybridEP wins"
  - "Current-scaling FP8 is not automatically faster for GDN-heavy Hopper workloads"
  - "Revalidate the winner at the acceptance global batch; do not extrapolate from the short A/B batch"
  - "Never accept a throughput gain caused by MoE capacity dropping routes when the target recipe is dropless"
  - "Treat shared-expert overlap as its own concurrency A/B; dispatcher or EP-overlap results do not predict it"
  - "Fused HybridEP permutation requires validating live dispatch/combine/preprocessing chunk-size compatibility"
  - "Rebaseline isolated micro-fusions after material stack changes: an early fused GDN norm regressed 0.61%, while the later reviewable final-stack gated-RMSNorm fusion improved same-allocation step time 1.365% and throughput 1.373%"
  - "For the measured Qwen3.5 H100 shape, BF16 and FlashQLA auto-partitioning remained locally optimal; coupled chunk conclusions require a logged post-normalization template, and the later apparent combine-only 64/128/256 ranking was invalid because every run instantiated effective 64/64/64 fused chunks"
  - "The corrected final-schedule fused-chunk A/B audited effective 128/128/128, stages 10/4/2, blocks 108/108, and valid=True; it regressed exact-2-node step time 5.627% versus effective 64/64/64"
  - "Profile the full stack before writing another GDN kernel; the measured winner spent far more active time in HybridEP and expert GEMMs than in FlashQLA"
  - "Trace tuning knobs to their consumers: high_priority_a2a_comm_stream affects combined 1F1B stream creation and is a no-op for standalone HybridEP"
  - "Require completed iteration progress after an OOM workaround; 1% optimizer offload crossed the MBS2 allocation failure but stalled before iteration 1"
  - "BF16 precision-aware optimizer stores FP32 master-weight remainders by default, so lowering main_params_dtype is not a free full-copy memory saving"
  - "Do not rewrite force-balance routing semantics to bypass dynamic metadata; a cross-rank exact-balanced route-only control segfaulted in the first backward"
  - "Device-resident static dispatch plus SM90 grouped-MM cut expert/linear active union 6.25%, HybridEP active union 4.49%, and summed host stream-sync wait 77.4%; GDN changed only 1.5%"
  - "Partial CUDA graphs replay tensor work but not Python shape state; preserve static dispatcher integers and handle lifetimes across eager graph boundaries"
  - "Rebaseline graphs after removing their synchronization target; scoped graphs were not additive to static dispatch in the matched run"
  - "Topology memory validation must cross optimizer-state materialization; EP8/expert-DP2 fit initialization and iteration 1 but OOMed at iteration 2"
  - "Profile attribution is a hypothesis: replacing native fused cross-entropy with TE changed steps 5-8 by only 0.0085%, proving the summed host wait was overlapping rather than recoverable wall time"
  - "Slurm container environment forwarding does not assign cache values; explicitly export mounted HF_HOME, TileLang, and TorchInductor paths, then local-only preflight config/tokenizer before a multi-rank launch"
  - "High-priority A2A was neutral on the Qwen3.5 overlap regression (82,700.3 versus 82,668.3 ms), ruling out simple normal-priority communication-stream starvation"
  - "TORCHINDUCTOR_COMPILE_THREADS is per rank; budget it from node CPU concurrency divided by local ranks to avoid 8× oversubscription during first cache population"
  - "Unchanged kernel count plus inflated dispatch/NCCL unions, idle gaps, and cudaEventSynchronize time identifies rank-skew/rendezvous inflation rather than duplicated model work"
  - "Large cuMem VMM totals require an allocator-only A/B; backend:native was materially worse on the Qwen3.5 overlap shape, so allocator traffic was correlated rather than proven causal"
  - "Retaining MoE-combine inputs until backward added about 5.8 GiB and caused a 16-rank optimizer-state OOM; preserve early reclamation and fix retirement dependencies instead"
  - "Dependency-aware owner-stream release preserved memory and improved the Qwen3.5 overlap stall from 82.70 to 67.98 seconds, but remained nearly 3x slower than no overlap and therefore requires a matched profile"
  - "The owner-release profile reduced capture span by 14.5%, event-sync time by 65.3%, major VMM call counts by about 25%, and dispatch by 22.4%; this confirms a retirement/allocator interaction but not an adoptable overlap schedule"
  - "CUDA_DEVICE_MAX_CONNECTIONS=1 improved the owner-release overlap mean from 66.322 to 44.465 seconds with unchanged peak allocation; verify the live PID, but keep no-overlap as the decision control because it remained 1.89x faster"
  - "The connections=1 profile cut NCCL by 95.3% and event-sync calls by 90.6%, but useful intersection also fell by 93.2% to 0.156 seconds; the gain was ordering through near-serialization, not effective overlap"
  - "The nearest upward point, connections=2, regressed the steady mean to 50.356 seconds / about 117.0 model TFLOP/s/GPU with 64 allocator retries; stop the sweep and return to the faster no-overlap dispatcher wall"
  - "On the no-overlap control, HybridEP num_sms=108 regressed the steps 5-8 mean by 19.97% versus 32; internal persistent-kernel and stream contention remains possible even when the combined EP-overlap schedule is disabled"
  - "On the same control, HybridEP num_sms=20 improved the steps 5-8 mean only 0.78% versus 32, from 23.516 to 23.335 seconds; treat the low-SM winner as a shallow local optimum"
  - "Reducing HybridEP num_sms from 20 to 16 improved the mean only another 0.46%, to 23.228 seconds / 253.60 model TFLOP/s/GPU; the low-SM tuning region had diminishing returns"
  - "Reducing HybridEP num_sms from 16 to 12 regressed the mean 9.28%, to 25.385 seconds / 232.06 model TFLOP/s/GPU; bracket both high-SM contention and low-SM communication underprovisioning"
  - "A profile-motivated asymmetric HybridEP split kept dispatch at 16 SMs and raised only combine to 20, but regressed steps 5-8 from 22.340925 to 22.49995 seconds / about 263.67 to 261.81 model TFLOP/s/GPU; active-union duration nominates an A/B but does not size the persistent-kernel budget"
  - "HybridEP preprocessing, dispatch/combine, and fused permute/unpermute use independent block budgets; changing only preprocessing from 108 to 32 regressed the current winner 0.418%, while changing only fused unpermute from 108 to 32 regressed it 4.742% to 23.400 seconds / 251.73 model TFLOP/s/GPU"
  - "Do not infer SM saturation from a compiler microbenchmark transfer gap: reserving 16 SMs did not improve compiled/shared concurrent makespan, 24 SMs regressed it from 0.7599x to 0.8021x eager, and static buffer rows must be separated from active offset rows"
  - "On the fastest no-overlap path with HybridEP num_sms=16, changing only CUDA_DEVICE_MAX_CONNECTIONS from 32 to 1 improved the steps 5-8 mean 3.46%, from 23.228 seconds / 253.60 model TFLOP/s/GPU to 22.451 seconds / 262.38; treat it as launch-order evidence until a matched profile attributes the gain"
  - "With num_sms=16, connections=1, and rank capacity 1.05 fixed, eager averaged 22.439 seconds / about 262.52 model TFLOP/s/GPU versus 22.451 / 262.38 with TE-scoped graphs; the 0.053% difference is noise-level, so graphs provide no measurable benefit on the current static path"
  - "The current-winner profile kept 401,840 kernels and zero HybridEP/expert intersection; connections=1 reduced HybridEP active union 8.77% and expert/linear union 1.58% versus 32, but increased idle gaps 15.02% from 4.204 to 4.836 seconds"
  - "The adjacent no-overlap connections=2 point averaged 22.502 seconds / about 261.78 model TFLOP/s/GPU, 0.28% slower than connections=1; added concurrency did not recover the profiled idle tradeoff"
  - "Reducing the current winner's static rank-capacity factor from 1.05 to 1.02 triggered the device-side route-overflow assertion in iteration 1 and produced no valid throughput sample; fail closed and keep 1.05 as the measured safe value for that exact route distribution"
