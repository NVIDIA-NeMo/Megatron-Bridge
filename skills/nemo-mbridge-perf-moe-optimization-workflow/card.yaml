title: moe_optimization_workflow
validated_on: "2026-07-26"
summary: >
  Systematic 3-phase workflow for optimizing MoE training performance,
  distilled from the Megatron-Core MoE paper (arXiv:2603.07685). Covers
  the Three Walls framework, parallel folding, memory optimization stack,
  FP8 recipe selection, CUDA graphs, and flexible VPP.

source: "https://arxiv.org/abs/2603.07685"
source_title: "Scalable Training of Mixture-of-Experts Models with Megatron Core"

validation_status:
  three_walls_framework:
    - documented
  optimization_workflow:
    - documented
  parallel_folding:
    - documented
  memory_optimization_stack:
    - documented
  fp8_recipes:
    - documented
  cuda_graphs_moe:
    - documented
  dsv3_case_study:
    - measured
  qwen3_30b_h100_case_study:
    - measured
  qwen35_35b_h100_bringup_case_study:
    - measured
    - profile_validated
  overlap_profile_method:
    - measured

core_concepts:
  three_walls:
    memory:
      description: "All E experts stored but only K activate per token"
      key_metric: "GB per GPU"
      dsv3_example: "199.5 GB per GPU without optimization (PP4×VPP4×EP64, 256 GPUs)"
    communication:
      description: "EP all-to-all dispatches tokens across GPUs"
      key_metric: "% of step time"
      dsv3_example: "20-60% of step time depending on hardware topology"
    compute_efficiency:
      description: "Small expert GEMMs + host overhead"
      key_metric: "GPU SM utilization"
      dsv3_example: "GEMMs <50% of execution time vs ~70% in dense models"

  parameter_compute_mismatch:
    description: >
      MoE total params scale with E (expert count) while per-token compute
      scales only with K (top-k). DSV3: 685B total, 37B active = 18× gap.
    implication: >
      More GPUs needed for memory, but per-token compute doesn't grow to
      match, leaving communication overhead exposed.

  parallel_folding:
    description: >
      Decouples attention and MoE parallelism. Attention uses TP×CP×DP×PP;
      MoE uses ETP×EP×EDP×PP. PP must match. Breaks EP≤DP constraint.
    key_benefit: "EP can exceed DP by folding across TP×CP groups"

optimization_phases:
  phase_1_memory:
    goal: "Fit training in GPU memory"
    key_action: "Choose parallelism that keeps memory within GPU capacity"
    quick_test: "--fake-init-process-group for single-GPU emulation"
  phase_2_parallelism:
    goal: "Minimize communication overhead"
    guidelines:
      - "Minimize model parallelism, maximize DP"
      - "Keep EP×TP within NVLink domain"
      - "Use PP for multi-node scaling"
      - "Prefer EP over TP for experts (Parallel Folding)"
      - "Enable CP for sequences ≥ 8K"
  phase_3_bottleneck:
    goal: "Profile and apply targeted optimizations"
    approach: "Identify which wall dominates, apply targeted fix, re-profile"

memory_techniques:
  - name: memory_efficient_permutation
    overhead: zero
    savings: "26 GB/GPU on DSV3"
    mechanism: "Absorbs routing weights into activations before FC2"
  - name: fp8_activations
    overhead: low
    savings: "16 GB/GPU on DSV3 (12% of activation budget)"
    mechanism: "Store linear layer inputs in FP8"
  - name: fine_grained_recompute
    overhead: "<5% compute"
    savings: "42 GB/GPU on DSV3"
    targets: "MLA up-proj (30.4 GB), LayerNorm (8.2 GB), SwiGLU (3.8 GB)"
  - name: fine_grained_offloading
    overhead: "1.6-2% throughput"
    savings: "10-18% memory"
    mechanism: "Module-level D2H/H2D with stream overlap"
  - name: optimizer_offloading
    overhead: "0.1-0.2s per iteration"
    savings: "15-20 GB/GPU on DSV3"
    best_on: "GB200 with NVLink-C2C"
  - name: fsdp_for_moe
    overhead: "communication"
    mechanism: "Dual DeviceMesh with zero-copy comms"

fp8_recipes:
  - name: per_tensor_fp8
    platform: "Hopper, Blackwell"
    granularity: "1 scale per tensor"
    use_for: "Starting point, migration to FP8"
  - name: blockwise_fp8
    platform: "Hopper"
    granularity: "128×128 blocks"
    use_for: "Production on Hopper"
  - name: mxfp8
    platform: "Blackwell"
    granularity: "1×32 elements"
    use_for: "Default on Blackwell"
  - name: nvfp4
    platform: "Blackwell"
    granularity: "16 elements, 2-level microscaling"
    use_for: "Maximum throughput on Blackwell"
    requires: "RHT, 2D scaling, stochastic rounding"

dsv3_case_study:
  gb200_config:
    gpus: 256
    parallelism: "TP1/PP4/EP64, VPP4"
    precision: MXFP8
    dispatcher: HybridEP
    cuda_graphs: enabled
    ep_overlap: disabled
    tflops: 1048
    dominant_bottleneck: "CPU overhead (after FP8 speeds up GEMMs)"
  h100_config:
    gpus: 1024
    parallelism: "TP2/PP8/EP64, VPP4"
    precision: FP8-Blockwise
    dispatcher: DeepEP
    cuda_graphs: disabled
    ep_overlap: enabled
    tflops: 368
    dominant_bottleneck: "Communication (cross-node EP all-to-all)"

qwen3_30b_h100_case_study:
  hardware: "16×H100"
  precision: BF16
  parallelism: "TP1/PP1/CP1/EP16"
  sequence_length: 4096
  batch: "MBS1/GBS1024"
  routing: force_balance
  dispatcher: HybridEP
  cuda_graph_scopes: "moe_router, moe_preprocess"
  delayed_wgrad_compute: false
  baseline_step_time_ms: 24713.800
  overlap_step_time_ms: 20992.030
  baseline_tflops: 244.039
  overlap_tflops: 287.305
  throughput_gain_percent: 17.729
  profile_comm_hidden_off_percent: 0.11
  profile_comm_hidden_on_percent: 36.55
  dominant_bottleneck: "Exposed HybridEP dispatch/combine communication"

qwen35_35b_h100_bringup_case_study:
  hardware: "16×H100"
  model: Qwen3.5-35B-A3B
  model_type: "30 Gated DeltaNet layers + 10 full-attention layers, MoE + MTP"
  precision: BF16
  sequence_length: 4096
  screening_batch: "MBS1/GBS128"
  acceptance_batch: "MBS1/GBS1024"
  routing: force_balance
  best_development_layout: "TP1/PP1/CP1/EP16, HybridEP, BF16, scoped TE graphs"
  best_development_tflops: 235.55
  best_development_step_time_ms: 25007.25
  best_development_peak_allocated_gib: 69.942
  key_wins: "PP balancing, FlashQLA/pre-GDR kernels, HybridEP, scoped TE graphs, fused HybridEP permutation"
  rejected_dimensions: "plain EP overlap, shared-expert overlap, tested FP8 modes, Q/K norm folding, standalone fused GDN norm, HybridEP 24/48-SM and 32/128-token chunk variants, non-default FlashQLA chunking, deterministic exact-balanced routing, MBS2 selective recompute and optimizer-offload attempts, work-dropping capacity"
  dominant_bottleneck: "dispatcher and host/kernel overhead after the layout fit"
  profile_capture_span_ms: 26230.551
  profile_kernel_active_union_ms: 22447.745
  profile_hybridep_active_union_ms: 7722.504
  profile_expert_linear_gemm_active_union_ms: 8446.067
  profile_gdn_flashqla_active_union_ms: 1406.683
  profile_hybridep_expert_gemm_overlap_ms: 0
  profile_cuda_stream_synchronize_calls: 2775
  profile_cuda_stream_synchronize_summed_cpu_wait_ms: 7422.4

key_lessons:
  - "Platform characteristics drive strategy, not just model architecture"
  - "Parallel Folding unlocks independent attention/MoE optimization"
  - "FP8 shifts bottleneck from memory/compute to CPU overhead"
  - "Optimization is iterative: solving one wall exposes another"
  - "Use unprofiled steady timing for acceptance and matched profiles for causality"
  - "Use interval unions and communication/compute intersection; summed concurrent kernel durations are not wall time"
  - "Hybrid GDN MoE bring-up requires multiple optimizer steps; step 2 can be the first full-state memory point"
  - "Balance hybrid-model PP stages by parameter/block cost, not equal layer count"
  - "Persist TileLang/Inductor caches and separate kernel JIT from graph capture and steady replay"
  - "A faster GDN kernel is additive, but dispatcher/overlap can remain the dominant end-to-end lever"
  - "Benchmark HybridEP and EP overlap separately; overlap can regress a GDN-heavy MoE even after HybridEP wins"
  - "Current-scaling FP8 is not automatically faster for GDN-heavy Hopper workloads"
  - "Revalidate the winner at the acceptance global batch; do not extrapolate from the short A/B batch"
  - "Never accept a throughput gain caused by MoE capacity dropping routes when the target recipe is dropless"
  - "Treat shared-expert overlap as its own concurrency A/B; dispatcher or EP-overlap results do not predict it"
  - "Fused HybridEP permutation requires validating live dispatch/combine/preprocessing chunk-size compatibility"
  - "Decompose combined kernel patches; the isolated fused GDN norm did not reproduce its apparent combined gain"
  - "For the measured Qwen3.5 H100 shape, BF16, FlashQLA auto-partitioning, 32 HybridEP SMs, and 64-token chunks remained locally optimal"
  - "Profile the full stack before writing another GDN kernel; the measured winner spent far more active time in HybridEP and expert GEMMs than in FlashQLA"
  - "Trace tuning knobs to their consumers: high_priority_a2a_comm_stream affects combined 1F1B stream creation and is a no-op for standalone HybridEP"
  - "Require completed iteration progress after an OOM workaround; 1% optimizer offload crossed the MBS2 allocation failure but stalled before iteration 1"
  - "BF16 precision-aware optimizer stores FP32 master-weight remainders by default, so lowering main_params_dtype is not a free full-copy memory saving"
  - "Do not rewrite force-balance routing semantics to bypass dynamic metadata; a cross-rank exact-balanced route-only control segfaulted in the first backward"

evidence:
  - "arXiv:2603.07685 — Scalable Training of MoE with Megatron Core"
  - "Megatron-Core v0.16 benchmarks"
  - "DSV3 and Qwen3-235B empirical results"
  - "examples/model_verification_cards/qwen3-30b-a3b/card.yaml"
  - "src/megatron/bridge/perf_recipes/qwen/h100/qwen3_moe.py"
