minimal_example:
  config: |
    cfg.comm_overlap.overlap_moe_expert_parallel_comm = True
    cfg.comm_overlap.delay_wgrad_compute = False
    cfg.model.moe_shared_expert_overlap = False
  command: |
    python scripts/performance/setup_experiment.py \
      --model qwen3-30b-a3b --moe_a2a_overlap

failure_modes:
  - name: ep_too_small
    symptom: "AssertionError about expert_model_parallel_size"
    likely_cause: "EP not configured or set to 1"
    fix: "Set expert_model_parallel_size > 1"
  - name: wrong_dispatcher
    symptom: "AssertionError about moe_token_dispatcher_type"
    likely_cause: "Dispatcher is not alltoall or flex"
    fix: "Set moe_token_dispatcher_type to alltoall or flex"
  - name: wrong_precision
    symptom: "AssertionError about bf16 or fp16"
    likely_cause: "Neither BF16 nor FP16 enabled"
    fix: "Set bf16 = True or fp16 = True"
  - name: pytorch_hang
    symptom: "Training hangs"
    likely_cause: "PyTorch < 2.6.0"
    fix: "Upgrade to PyTorch >= 2.6.0"
  - name: missing_vpp
    symptom: "AssertionError about virtual_pipeline_model_parallel_size"
    likely_cause: "PP > 1 without VPP"
    fix: "Set virtual_pipeline_model_parallel_size when PP > 1"
  - name: full_recompute
    symptom: "AssertionError about recompute_granularity"
    likely_cause: "Full recompute enabled"
    fix: "Disable full recompute (set recompute_granularity to null)"
  - name: delay_wgrad_without_overlap
    symptom: "AssertionError overlap_moe_expert_parallel_comm is required"
    likely_cause: "delay_wgrad_compute without EP overlap"
    fix: "Enable overlap_moe_expert_parallel_comm first"
  - name: flex_not_activated
    symptom: "No throughput gain from flex dispatcher"
    likely_cause: "apply_flex_dispatcher_backend() not called"
    fix: "Call apply_flex_dispatcher_backend(cfg.model, ...)"
  - name: combined_schedule_regression
    symptom: "Step time and live memory both jump after enabling overlap"
    likely_cause: "The combined 1F1B schedule lengthens the critical path or retains more activations for this model"
    fix: "Reject the path using the first exact steady A/B before layering delayed wgrad or CUDA graphs"
  - name: high_priority_stream_is_neutral
    symptom: "Normal- and high-priority overlap runs both take about 82.7 seconds"
    likely_cause: "The regression is not simple normal-priority A2A stream starvation"
    fix: "Profile the combined schedule before tuning stream priority or dispatcher SM reservations"
  - name: overlap_forward_outpaces_backward_release
    symptom: "Peak memory and allocator/rank-skew stalls contract under attention or GDN recompute"
    likely_cause: "The normal overlap order delays pre-dispatch attention/GDN backward until after combine forward"
    fix: "A/B ep_overlap_early_attn_memory_release and reject it if newly exposed dispatch/combine outweighs memory relief"

known_constraints:
  - expert_model_parallel_size must be greater than 1.
  - num_moe_experts must be greater than 1.
  - moe_token_dispatcher_type must be alltoall or flex.
  - Precision must be BF16 or FP16.
  - moe_shared_expert_overlap must be false when overlap is enabled.
  - PyTorch must be at least 2.6.0.
  - If pipeline parallelism is used, virtual pipeline parallelism is required.
  - recompute_granularity must not be full.
  - recompute_method must be None.
  - recompute_num_layers must be None.
  - mtp_num_layers must be None or 1.
  - delay_wgrad_compute requires overlap_moe_expert_parallel_comm.
  - ep_overlap_early_attn_memory_release requires overlap_moe_expert_parallel_comm.
  - delay_wgrad_compute with overlap_grad_reduce requires TE >= 2.7.0.
  - CUDA graph attn scope + delay_wgrad requires TE >= 2.12.0 and no attention bias.

known_limitations:
  - Setting moe_flex_dispatcher_backend alone does not activate flex dispatch.
  - Public recipes are often conservative and leave MoE overlap disabled by default.
  - The measured gain is specific to one Qwen3 30B-A3B HybridEP H100 shape.
  - A matched Qwen3.5-35B-A3B H100 run regressed to 71.2 model TFLOP/s/GPU and raised peak allocation to about 72.0 GiB; sibling-model results do not predict the sign.
  - Giving the Qwen3.5 overlap communication stream high priority measured 71.3 model TFLOP/s/GPU, effectively identical to its 71.2 normal-priority control.
  - The matched Qwen3.5 profile kept kernel count effectively unchanged but inflated dispatch, NCCL, idle gaps, and cudaEventSynchronize time, identifying rank-skew/rendezvous inflation rather than duplicated work.
  - Switching only to backend:native worsened progress and pushed ranks near physical memory capacity; large expandable-allocator cuMem totals were a symptom, not sufficient root-cause evidence.
  - Retaining MoE-combine inputs until backward added about 5.8 GiB first-step peak allocation and caused a 16-rank optimizer-state OOM; early reclamation is required even if its retirement ordering still needs work.
  - Waiting on the combine completion event and retiring storage on the compute/owner stream preserved control memory while improving steps 2-3 to 67.98 and 64.67 seconds; this isolates retirement cost but is still a large no-overlap regression.
  - The matched owner-release profile reduced capture span by 14.5%, event-sync time by 65.3%, major VMM call counts by about 25%, and dispatch by 22.4%; the mechanism is confirmed, but dispatch and NCCL remained about 10.8x and 35.4x above no overlap.
  - Changing only CUDA_DEVICE_MAX_CONNECTIONS from 32 to 1 raised the owner-release overlap mean from about 88.9 to 132.45 model TFLOP/s/GPU with unchanged peak allocation, but remained 1.89x slower than no overlap.
  - Its matched profile cut NCCL by 95.3%, dispatch by 63.0%, and event-sync calls by 90.6%, but useful HybridEP/expert intersection also fell by 93.2% to 0.156 seconds; ordering improved mainly through serialization.
  - The nearest upward point, connections=2, regressed the two-step mean from 44.465 to 50.356 seconds and recorded 64 allocator retries at iteration 2; stop the sweep instead of assuming 4/8 will restore useful overlap.
  - On the faster no-overlap Qwen3.5 control with HybridEP num_sms=16, changing only CUDA_DEVICE_MAX_CONNECTIONS from 32 to 1 improved the steps 5-8 mean from 23.228 to 22.451 seconds and throughput from 253.60 to 262.38 model TFLOP/s/GPU; launch-order pressure is not limited to the combined-overlap failure.
  - Its matched no-overlap profile kept 401,840 kernels and zero HybridEP/expert intersection; connections=1 cut HybridEP active union 8.77% but increased idle gaps 15.02% from 4.204 to 4.836 seconds, establishing cheaper but more idle serial execution.
  - The adjacent no-overlap connections=2 point averaged 22.502 seconds / about 261.78 model TFLOP/s/GPU, 0.28% slower than connections=1; added launch concurrency did not recover the profiled idle tradeoff.
  - Shared-expert overlap is a separate alternative to plain EP overlap. It improved the final Qwen3.5 steps 5-8 mean by 0.44% to 22.341 seconds / about 263.67 model TFLOP/s/GPU.
  - The matched Qwen3.5 early-attention-release A/B averaged 44.20885 seconds / about 133.25 model TFLOP/s/GPU, only 0.575% shorter than the broken overlap control and 49.47% below the accepted winner.
  - Early release did not preserve a steady memory benefit on that shape: peak allocated memory rose from 63.152 GiB on the cold first iteration to the same 72.028 GiB control peak after optimizer warmup. Compare post-warmup memory, not only iteration 1.
  - The shared-expert side stream summed 0.690 seconds but overlapped the primary stream for only 0.213 seconds and HybridEP for 0.163 seconds; most work remained dependency-serialized.
  - Changing shared-overlap connections from 1 to 2 regressed 2.67%, and changing only the shared stream to high priority regressed 0.18%; priority cannot enlarge explicit dependency windows.
  - An exact real-shape delayed grouped-wgrad split matched native gradients bitwise and shortened dgrad-only by 21.1%, but the full connections=1 schedule averaged 22.489 seconds / about 261.93 model TFLOP/s/GPU, 0.664% slower than immediate wgrad.
  - Primitive dgrad headroom is not sufficient evidence for delayed wgrad; verify that the runtime connection count and dependency graph expose a useful concurrent window.
  - The focused MCore alltoall test compares four-microbatch reference and early-release outputs plus parameter gradients, but its containing suite is marked flaky_in_dev for a Transformer Engine 2.17 pybind11 GIL failure; retain target-environment finite-loss/gradient validation.
  - Summed per-stream kernel duration is not exposed wall time when kernels overlap.

