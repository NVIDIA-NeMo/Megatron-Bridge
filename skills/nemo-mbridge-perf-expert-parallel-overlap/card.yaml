title: expert_parallel_overlap
validated_on: "2026-07-27"
summary: >
  Megatron-Bridge supports MoE expert-parallel communication overlap through
  overlap_moe_expert_parallel_comm, with optional delayed expert wgrad
  scheduling. The path depends on dispatcher choice (alltoall or flex),
  expert parallelism degree, precision (BF16/FP16), and runtime support. A
  controlled Qwen3 30B-A3B HybridEP run on 16 H100 GPUs measured a 15.059%
  step-time reduction from plain EP overlap, while a matched Qwen3.5-35B-A3B
  run regressed to 71.2 model TFLOP/s/GPU. Always repeat the model-specific
  A/B.

validation_status:
  moe_overlap_validation:
    - code_verified
  flex_dispatcher_activation:
    - code_verified
  deepep_hybridep_helper_behavior:
    - code_verified
  delayed_wgrad_validation:
    - code_verified
  cuda_graph_wgrad_interaction:
    - code_verified
  end_to_end_recipe_smoke:
    - measured
  qwen3_30b_hybridep_h100:
    - measured
  matched_nsys_ab:
    - measured
  qwen35_35b_hybridep_h100_counterexample:
    - measured
  qwen35_high_priority_a2a_control:
    - measured
  qwen35_overlap_profile_and_allocator_ab:
    - measured
  early_attn_memory_release_schedule:
    - code_verified
  early_attn_memory_release_output_gradient_equivalence:
    - code_verified
  qwen35_early_attn_memory_release_ab:
    - measured

training_dimensions:
  speed:
    effect: "model-dependent: +17.729% throughput on Qwen3 30B-A3B, but a multi-fold regression on the matched Qwen3.5-35B-A3B shape"
    confidence: high_for_measured_shape
    rationale: >
      Hides expert dispatch/combine all-to-all under expert FFN compute.
      Benefit depends on EP degree and collective-to-compute ratio.
  memory:
    effect: "62.166 GiB rank-0 peak allocated on the measured winner; baseline delta not isolated"
    confidence: medium
    rationale: The winner stayed below the 65 GiB allocated-memory gate, but the profile A/B did not isolate a peak-memory delta.
  scale:
    effect: "positive at higher EP degrees (not yet measured)"
    confidence: medium
    rationale: Communication fraction grows with more EP ranks.
  convergence:
    effect: "no change expected"
    confidence: high
    rationale: Overlap reorders execution but does not change mathematical result.
  stability:
    effect: "adds operational constraints"
    confidence: medium
    rationale: >
      Requires specific dispatcher, precision, recompute, and VPP settings.
      CUDA graph + delayed wgrad path has additional TE version constraints.

enable_when:
  - Model is MoE with expert_model_parallel_size > 1
  - Expert dispatch communication is a meaningful part of step time
  - Throughput tuning phase (correctness already established)

avoid_when:
  - Full activation recompute is enabled
  - moe_shared_expert_overlap is enabled
  - PyTorch < 2.6.0
  - Still bringing up training for correctness
  - A matched model-specific A/B shows longer step time or higher live memory

interactions:
  - name: recompute
    constraint: "recompute_granularity must not be full; recompute_method and recompute_num_layers must be None"
  - name: shared_expert_overlap
    constraint: "moe_shared_expert_overlap must be False when EP overlap is enabled"
  - name: pipeline_parallelism
    constraint: "PP > 1 requires virtual_pipeline_model_parallel_size to be set"
  - name: cuda_graphs_delayed_wgrad
    constraint: >
      CUDA graph attn or moe_router scope with delay_wgrad_compute requires
      TE >= 2.12.0, gradient_accumulation_fusion = True, and no attention bias
  - name: mtp
    constraint: "mtp_num_layers must be None or 1"

feature_meaning:
  overlap_moe_expert_parallel_comm: >
    Overlap expert-parallel token dispatch/combine all-to-all with expert compute.
  delay_wgrad_compute: >
    Delay expert weight-gradient computation to overlap with the next layer's
    forward pass. Requires EP overlap as a prerequisite.
  moe_flex_dispatcher_backend: >
    Backend selection for DeepEP or HybridEP once the dispatcher is explicitly
    switched to flex via apply_flex_dispatcher_backend().
  ep_overlap_early_attn_memory_release: >
    Move pre-dispatch attention/GDN backward before the next MLP forward so
    attention activations are released earlier. Requires EP overlap and can
    expose dispatch/combine that the normal order hides.

config_keys:
  - comm_overlap.overlap_moe_expert_parallel_comm
  - comm_overlap.delay_wgrad_compute
  - model.moe_token_dispatcher_type
  - model.moe_flex_dispatcher_backend
  - model.moe_shared_expert_overlap
  - model.ep_overlap_early_attn_memory_release
  - model.expert_model_parallel_size
  - model.num_moe_experts

recommended_path:
  comm_overlap.overlap_moe_expert_parallel_comm: true_for_moe_tuning
  comm_overlap.delay_wgrad_compute: false_for_first_isolation
  model.moe_shared_expert_overlap: false_when_overlap_is_enabled

expected_metric_change:
  - metric: step_time
    direction: down
    magnitude: "15.059% on measured Qwen3 30B-A3B shape"
    conditions: "16×H100 BF16 seq4096 TP1 PP1 CP1 EP16 MBS1 GBS1024 force balance HybridEP"
    evidence: measured
  - metric: model_tflops_per_gpu
    direction: up
    magnitude: "17.729% (244.039 to 287.305)"
    conditions: "same controlled Qwen3 30B-A3B shape"
    evidence: measured
  - metric: peak_memory
    direction: up
    magnitude: "slight (not yet measured)"
    conditions: "EP overlap buffers"
    evidence: not_yet_measured
  - metric: model_tflops_per_gpu
    direction: down
    magnitude: "250.5 to 71.2 on the first Qwen3.5 steady sample"
    conditions: "16×H100 BF16 seq4096 TP1 PP1 CP1 EP16 MBS1 GBS1024 static HybridEP grouped-MM path"
    evidence: measured
  - metric: shared_expert_overlap_step_time
    direction: down
    magnitude: "0.44% (22.439 to 22.341 seconds)"
    conditions: "final measured Qwen3.5 BF16 path, connections=1, normal-priority shared stream"
    evidence: measured

