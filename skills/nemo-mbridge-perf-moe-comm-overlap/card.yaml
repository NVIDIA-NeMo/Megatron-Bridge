known_constraints:
  - expert_model_parallel_size must be greater than 1.
  - num_moe_experts must be greater than 1.
  - moe_token_dispatcher_type must be alltoall or flex.
  - Precision must be BF16 or FP16.
  - If pipeline parallelism is used, virtual pipeline parallelism is required for the overlap path.
  - Full-layer recompute and full-MoE selective recompute are incompatible with the overlap path; selective non-MoE scopes remain available.
  - ep_overlap_early_attn_memory_release requires overlap_moe_expert_parallel_comm.
known_limitations:
  - Setting moe_flex_dispatcher_backend alone does not activate flex dispatch.
  - Public recipes are often conservative and leave MoE overlap disabled by default.
  - The measured gain is workload-specific and should not be generalized across model, dispatcher, topology, or batch changes.
  - The matched Qwen3.5 GDN-heavy shape reversed the Qwen3 result and increased both step time and live memory.
  - High-priority A2A communication was neutral on the Qwen3.5 regression, ruling out simple normal-priority stream starvation.
  - The Qwen3.5 profile kept kernel count unchanged while dispatch, NCCL, idle gaps, and event-sync time inflated; this is rank skew rather than duplicated work.
  - A native-allocator control was materially worse, so large cuMem VMM totals alone did not establish allocator causality.
  - The focused MCore alltoall test compares four-microbatch reference and early-release outputs plus parameter gradients, but its containing suite is marked flaky_in_dev for a Transformer Engine 2.17 pybind11 GIL failure; target-environment finite-loss/gradient validation remains required.
  - Retaining combine inputs until backward added about 5.8 GiB and caused an all-rank optimizer-state OOM; early reclamation is required even if release ordering needs work.
  - Dependency-aware owner-stream release preserved control memory and improved steps 2-3 to 67.98 and 64.67 seconds, but the overlap schedule remained far slower than no overlap.
  - Its matched profile reduced event-sync time by 65.3%, major VMM call counts by about 25%, dispatch by 22.4%, and capture span by 14.5%; this confirms a retirement/allocator interaction without making overlap recipe-ready.
  - On that same path, CUDA_DEVICE_MAX_CONNECTIONS=1 improved the two-step mean to 44.465 seconds / 132.45 model TFLOP/s/GPU versus 66.322 seconds / 88.9 at 32, but no-overlap remained 1.89x faster.
  - The connections=1 profile nearly normalized NCCL but reduced useful HybridEP/expert intersection to 0.156 seconds, showing that the gain came mainly from serialization rather than successful communication hiding.
  - Connections=2 regressed the two-step mean to 50.356 seconds / about 117.0 model TFLOP/s/GPU with 64 allocator retries at iteration 2, so increasing launch concurrency did not restore useful overlap.
  - On the faster no-overlap Qwen3.5 control with HybridEP num_sms=16, connections=1 improved the steps 5-8 mean from 23.228 to 22.451 seconds / 253.60 to 262.38 model TFLOP/s/GPU; profile it as a launch-order gain rather than calling it communication hiding.
  - Its matched no-overlap profile kept 401,840 kernels and zero useful HybridEP/expert intersection; HybridEP active union fell 8.77% but idle gaps rose 15.02% from 4.204 to 4.836 seconds, so the gain was cheaper serial execution with an idle tradeoff.
  - The adjacent no-overlap connections=2 point averaged 22.502 seconds / about 261.78 model TFLOP/s/GPU, 0.28% slower than connections=1; stop the upward sweep.
  - A Qwen3.5 exact delayed grouped-wgrad split matched native gradients bitwise and made dgrad-only 21.1% shorter, but the full connections=1 schedule regressed 0.664% to 22.489 seconds / about 261.93 model TFLOP/s/GPU.
  - Delayed wgrad requires both numerical validation and an unprofiled end-to-end A/B; a deferrable primitive does not prove useful communication overlap.
  - cudaMallocAsync OOMed before the first optimizer step on the Qwen3.5 owner-release/connections=1 overlap shape; allocator backends need an explicit capacity gate before timing.
  - Built-in log_moe_overload_factor observes actual post-dispatch tokens on each rank/layer, but it does not expose complete per-expert grouped-GEMM offsets.
  - Late dispatcher/expert class monkeypatches can be bypassed when fine-grained schedule plans retain already-bound callables.
  - Summed per-stream kernel time is not a wall-time metric when kernels overlap.
  - The matched Qwen3.5 early-attention-release A/B averaged 44.20885 seconds / about 133.25 model TFLOP/s/GPU, only 0.575% shorter than the broken overlap control and 49.47% below the accepted winner.
  - Its peak allocation rose from 63.152 GiB on cold iteration 1 to the same 72.028 GiB control peak after optimizer warmup; do not accept a memory-lifetime optimization from iteration-1 telemetry alone.
