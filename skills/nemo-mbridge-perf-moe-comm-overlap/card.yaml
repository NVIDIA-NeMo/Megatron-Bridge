    - measured
  builtin_moe_overload_observability:
    - code_verified
  early_attn_memory_release_schedule:
    - code_verified
  early_attn_memory_release_output_gradient_equivalence:
    - code_verified
  qwen35_early_attn_memory_release_ab:
    - measured
feature_meaning:
  moe_overlap: >
    Overlap of expert-parallel token dispatch communication with expert compute.
  delay_wgrad_compute: >
    Delayed expert weight-gradient scheduling layered on top of MoE overlap.
  flex_dispatcher: >
    Dispatcher mode used for DeepEP or HybridEP style backends.
  ep_overlap_early_attn_memory_release: >
    Reorder pre-dispatch attention/GDN backward before the next MLP forward to
    release activations earlier; requires EP overlap and may expose
    dispatch/combine.
recommended_path:
  comm_overlap.overlap_moe_expert_parallel_comm: true_for_moe_tuning
  comm_overlap.delay_wgrad_compute: false_for_first_isolation
  model.moe_shared_expert_overlap: false_when_overlap_is_enabled
