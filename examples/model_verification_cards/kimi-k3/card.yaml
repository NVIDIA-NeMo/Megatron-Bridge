# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: kimi_k3
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. This card covers the Kimi K3 language backbone in the published
  multimodal checkpoint. It does not claim support for the vision tower or
  multimodal inputs. A diagnostic full-model direct Hugging
  Face-to-Megatron import completed deterministic Megatron greedy text
  generation, but its clean-commit provenance rerun is still pending.
  Persisted CPU and GPU checkpoint conversion, full-model Hugging
  Face/Megatron forward correlation, inference, and every training workflow
  remain unverified.
verification_index:
  model_level:
    unverified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    GB300:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
model:
  hf_id: moonshotai/Kimi-K3
  hf_revision: 9f62e4e9fffbd0a83ddd60e1c209d828994b3569  # pragma: allowlist secret
  architecture: KimiK3ForConditionalGeneration
  min_transformers_version: "4.56.2"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.06
  bridge_commit: eb91f8be86e5f88771bfa020b33cd74dd3de80ad  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      No CPU Hugging Face-to-Megatron conversion result is claimed. Future
      verification must import the complete pinned language backbone with the
      public conversion launcher, persist iter_0000000, reload it, and audit all
      mapped keys, shapes, dtypes, and values.

  hf_to_megatron_gpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Direct in-memory import of the pinned full language backbone completed at
      TP1/PP3/EP8/ETP1 and supported the diagnostic inference run, including
      dequantization of published MXFP4 routed-expert weights to BF16. No
      persisted Megatron checkpoint was produced or reloaded, and no exact
      full-state audit completed, so GPU conversion is not yet verified.

  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      No CPU Megatron-to-Hugging-Face conversion result is claimed. Future
      verification depends on a complete persisted Megatron import and must
      write, strictly reload, and exactly audit the exported Hugging Face
      language-backbone weights against the pinned source revision.

  megatron_to_hf_gpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      No GPU Megatron-to-Hugging-Face conversion result is claimed. Export still
      needs to restore 32 inactive entries for every KDA A_log tensor because
      Megatron retains the 96 active heads while the published checkpoint
      stores 128 entries. A complete export, strict Transformers reload, and
      exact key, shape, dtype, and value audit remain required.

  manual_forward_pass:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      A four-layer diagnostic proxy matched the next token and measured logit
      cosine similarity 0.9998329878 and Pearson correlation 0.9998273849.
      This is not a full-model comparison. Verification still requires the
      pinned complete language backbone on both implementations, the same
      prompt, a matching next token, cosine similarity of at least 0.99, and
      reported maximum and mean absolute logit differences.

  inference:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >-
      No clean-commit inference result is claimed yet. A diagnostic run of the
      pinned full language backbone imported directly into Megatron at
      TP1/PP3/EP8/ETP1 and exited after 32 new greedy tokens with this
      completion, represented with JSON Unicode escapes for the model
      control-token brackets:
      "15% of 240 = 0.15 × 240 = 36.\u003c|close|\u003ethink\u003c|sep|\u003e\u003c|open|\u003eresponse\u003c|sep|\u003e15% of 240 is 36.".
      Verification requires the same exact 32-token result from the pinned clean
      Bridge commit.

