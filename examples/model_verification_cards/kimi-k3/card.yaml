# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: Kimi K3
summary: >
  Import/export verification for the Kimi K3 language backbone using
  HybridModel and the config + builder API. Full-checkpoint CPU and GPU
  conversion must be verified for this implementation. The published
  multimodal checkpoint's vision tower and multimodal inputs are outside
  this card's scope.
verification_index:
  model_level:
    unverified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
verification_scope: import_export
model:
  hf_id: moonshotai/Kimi-K3
  hf_revision: 9f62e4e9fffbd0a83ddd60e1c209d828994b3569  # pragma: allowlist secret
  architecture: KimiK3ForConditionalGeneration
  min_transformers_version: "4.56.2"
# Target environment for pending full-checkpoint conversion.
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.10
  bridge_commit: 328b4b02f11de4c28f992bd14e86b5509414ab1b  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Import the complete pinned language backbone on CPU, persist and reload
      the Megatron checkpoint, and check every mapped key, shape, dtype and
      value. No complete CPU import result is recorded for this implementation.

  hf_to_megatron_gpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Import the complete pinned language backbone on GPU into HybridModel,
      dequantize MXFP4 routed-expert weights to BF16, and persist and reload
      the split-layer checkpoint. Check every mapped key, shape, dtype and
      value. Full-checkpoint import remains unverified for this implementation.

  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Export the complete persisted Megatron checkpoint on CPU and strictly
      reload the Hugging Face files. Check keys, shapes, dtypes and lossless
      values exactly, including restored zero padding in KDA A_log tensors.
      Declare a numerical tolerance for lossy MXFP4 reconstruction before
      comparing it. No complete CPU export result is recorded.

  megatron_to_hf_gpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Export the complete persisted Megatron checkpoint on GPU and strictly
      reload the Hugging Face files. Check keys, shapes, dtypes and lossless
      values exactly, including restored zero padding in KDA A_log tensors.
      Declare a numerical tolerance for lossy MXFP4 reconstruction before
      comparing it. Small-model round trips do not establish full-checkpoint
      export verification.
