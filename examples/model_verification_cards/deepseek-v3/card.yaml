  pretrain_performance:
    GB300:
      status: verified
      precision: fp8_mx
      command: >
        ./scripts/training/train.sh --wait --nodes 64 --gpus-per-node 4
        --recipe deepseek_v3_pretrain_256gpu_gb300_fp8mx_agentic_pp2_config
        --mode pretrain --max_steps 50 --seq_length 4096
        logger.save_config_filepath=work/model-verification/deepseek-v3/gb300-performance/ConfigContainer.yaml
      last_verified: 2026-08-14
      metrics:
        initial_loss: 11.89514
        final_loss: 6.827579
        last_10_steps_step_time_ms_avg: 20857.82
        last_10_steps_model_tflops_per_gpu_avg: 1634.30
      expected_result: >
        On exactly 256 GB300 GPUs, the canonical 50-step mock-data MXFP8
        performance recipe must finish at TP1/PP2/VP8/CP1/EP32/ETP1 and
        GBS/MBS 8192/1 with finite keyed loss and throughput rows, zero skipped
        or NaN iterations, and a saved post-setup configuration. The final ten
        steps must reach at least 1,571 model-TFLOP/s/GPU; the verified run
        averaged 1,634.30 model-TFLOP/s/GPU and 20,857.82 ms. Mock data, forced
        expert balancing, and reduced-precision optimizer moments make this
        benchmark-only evidence, not convergence evidence.
