summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. On the recorded Bridge commit, 144 focused tests passed, including
  canonical collator-owned packing, image/video/audio insertion, and a real
  tiny-model forward, backward, and optimizer update. Two-rank
  context-parallel sharding passed on both ranks. The official ten-frame
  Valor32K audio/video sample produced 1,280 video and 126 audio placeholders
  with finite loss 11.72488499; a three-step legacy/canonical comparison had
  maximum loss delta 0.0. These are focused implementation checks rather than
  completed end-to-end model verification items, so the required inventory
  remains unverified.
