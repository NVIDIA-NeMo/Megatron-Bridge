        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        On exactly 64 H100s, the BF16 audio-free image/video SFT run must
        complete 100 optimizer steps at TP1/PP2/CP1/EP32/ETP1, GBS/MBS
        1280/1, with the checkpoint-native one-layer MTP, separate temporal
        embedder, natural routing, HybridEP flex dispatch, fixed expert
        capacity, selective recompute, and precision-aware optimizer. Loss must
        remain finite with zero skipped or NaN iterations. Complete step-50 and
        step-100 checkpoints and the resolved ConfigContainer must persist.

  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      commands:
        - >
          ./scripts/conversion/convert.sh export --executor slurm --device gpu
