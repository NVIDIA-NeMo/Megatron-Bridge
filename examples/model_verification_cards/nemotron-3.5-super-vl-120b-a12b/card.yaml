# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_5_super_vl_120b_a12b
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. Real-data BF16 pretraining verification on 64 H100s and 64 GB200s
  uses DataComp image-caption samples, natural dropless expert routing, and a
  learned vision-pretrained checkpoint; both 120-step runs and their final
  checkpoints are verified. The H100 and GB200 workloads use different
  sequence and global batch sizes, so their losses and throughput are not
  convergence-comparable. The
  pinned eight-GPU BF16 import and distributed export are verified:
  the saved Megatron checkpoint reloaded for export, all 43,078 tensors matched
  the immutable HF source bitwise, and the exported package reloaded natively
  through Transformers on eight H100s. CPU conversion, deterministic
  generation and post-SFT export remain pending. SFT, PEFT, and checkpoint
  resume are verified on both H100 and GB200. The training recipes reuse the
  Nemotron Omni image/video stack without audio and retain the checkpoint's
  separate temporal embedder and one-layer MTP configuration.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified: [pretrain, sft, peft, checkpoint_resume]
      unverified: [sft_export_inference]
      unsupported: [sft_long_context]
    GB200:
      verified: [pretrain, sft, peft, checkpoint_resume]
      unverified: [sft_export_inference]
      unsupported: [sft_long_context]
