      --tp 1 --pp 1 --ep 4 --etp 1 --trust-remote-code
    last_verified: 2026-09-23
    expected_result: >
      The maintained comparison passed for this rectangular-image prompt on
      four GB200 GPUs using a separately saved native HF reference from the
      same checkpoint and inputs. The next token matches: 1784 (The).
      Cosine similarity is 0.999980. Maximum and mean absolute logit
      differences are 1.250000 and 0.216821. The input had 314 text tokens
      and 1160 vision patches. This establishes single-prompt functional
      correlation, not strict probability equality or comprehensive visual
      parity. Stronger image/video diagnostics are not all passing. The
      reference must be regenerated for any changed checkpoint; the blank
      public revision does not bind these results to a public release commit.

