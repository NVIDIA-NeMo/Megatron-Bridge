          --hf-model nvidia/NVIDIA-Nemotron-3.5-Super-120B-A12B-SourceOfTruth
          --hf-revision e86197a3bad449de618a5835f26835ce770c6f10
          --megatron-path
          work/model-verification/nemotron-3.5-super-vl-120b-a12b/h100-sft/iter_0000100
          --hf-path work/model-verification/nemotron-3.5-super-vl-120b-a12b/h100-sft-hf-export
          --torch-dtype bfloat16 --tp 1 --pp 1 --ep 8 --etp 1
          --trust-remote-code --distributed-save --save-every-n-ranks 1
        - >
          ./scripts/inference/infer.sh --nodes 1 --gpus-per-node 8
          --task hf-inference
          --hf-model work/model-verification/nemotron-3.5-super-vl-120b-a12b/h100-sft-hf-export
          --prompt "Describe the image." --image docs/images/tp1.png
          --max-new-tokens 32 --chat-template --trust-remote-code
          --device cuda --dtype bfloat16
      last_verified: null
      expected_result: >
        Strict export must reproduce a natively reloadable Transformers
