# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_5_super_vl_120b_a12b
summary: >
  Performance disclaimer: this card does not record a canonical pretrain
  performance result; reported timing and throughput metrics are functional
  verification observations, not standalone optimized performance results.
  Refreshed verification uses the release-facing model name and the official
  container below. The public revision is intentionally blank; these results
  do not establish correspondence to an immutable public release revision.
  The model reuses the Omni image/video stack without audio and retains a
  separate temporal embedder. Training uses fixed-resolution images;
  inference exercises dynamic-resolution processing. This is bounded support
  verification, not a cross-model convergence comparison. Stronger visual
  parity diagnostics and the GB200 resume comparison are not all passing.
  CPU conversion and long-context training are deferred. The companion card
  separately covers text-only workflows.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
  training:
    H100:
      verified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unverified: [sft_long_context]
    GB200:
      verified: [sft, sft_export_inference, peft]
      unverified: [pretrain, sft_long_context, checkpoint_resume]
model:
  hf_id: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
  hf_revision:
  architecture: NemotronH_Omni_Reasoning_V3
  min_transformers_version: "5.12.1"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08.01
  bridge_commit: 2449c2fcd49741cfe5c112542b901d0c46a90d34  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      CPU-only import is not claimed in this card; the distributed GPU import
      below is the verified conversion path for this checkpoint.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    bridge_commit: 3a5b4f610a5b3608b1bded146418459672492cd9  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
      --megatron-path work/model-verification/nemotron-3.5-super-vl-120b-a12b/gpu-megatron
      --torch-dtype bfloat16 --tp 1 --pp 2 --ep 2 --etp 1
      --trust-remote-code
    last_verified: 2026-09-23
    expected_result: >
      Distributed BF16 GPU import and paired export passed with all 43,079
      source tensors exact in keys, shapes, dtypes and values. Compared
      248,906,833,960 source bytes, including language, MTP, image encoder,
      projector, temporal embedder and the vision summary-index buffer.
      This establishes conversion, not training or numerical forward parity.

