# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_5_super_vl_120b_a12b
summary: >
  Performance disclaimer: this card does not record a canonical pretrain
  performance result; reported timing and throughput metrics are functional
  verification observations, not standalone optimized performance results.
  Historical training commands, metrics, checkpoint and reload observations
  are retained below, but pretrain, SFT, PEFT and checkpoint-resume correctness
  are unverified on both H100 and GB200. The historical shared-provider config
  copy could omit training finalization callbacks, so finite losses and
  matching resume losses do not establish synchronized, token-normalized
  updates. Recipe-specific reverification after the callback fix is pending.
  Those runs also used one MTP prediction depth and predate the current
  two-depth shared-block objective, FP32 optimizer-state and weight-decay
  defaults, and language-only PEFT adapter targets. Their metrics are not
  corrected-training convergence or throughput baselines. The H100 and GB200
  workloads also used different sequence and global batch sizes.
  The pinned eight-GPU BF16 import and distributed export remain verified:
  all 43,078 tensors matched the immutable HF source bitwise, and the exported
  package reloaded natively through Transformers on eight H100s. This
  conversion evidence is independent of training finalization. Model-level
  deterministic generation remains pending. Historical post-SFT export and
  dynamic-image inference demonstrate artifact execution only; their
  dependent verification awaits a corrected SFT checkpoint. The recipes
  reuse the Nemotron Omni image/video stack without audio and retain the
  checkpoint's separate temporal embedder.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
      - manual_forward_pass
      - inference
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
