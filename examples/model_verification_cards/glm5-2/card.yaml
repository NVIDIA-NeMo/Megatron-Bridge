        including the first resumed step's 377.730 s of execution and kernel warmup.
      metrics:
        initial_loss: 0.9160116
        final_loss: 0.8747938
        last_10_steps_step_time_ms_avg: 62885.97
        last_10_steps_model_tflops_per_gpu_avg: 216.07
        last_10_steps_tokens_per_second_per_gpu_avg: 347.380081
      resume_comparison:
        reference_item: pretrain
        sentinel_steps:
        - 11
        - 20
        loss_relative_tolerance: 0.01
        loss_absolute_tolerance: 1.0e-06
        sentinels_match: true
      bridge_commit: d592bef3fdebd387b699a4c15bce561f32ac78ba  # pragma: allowlist secret
