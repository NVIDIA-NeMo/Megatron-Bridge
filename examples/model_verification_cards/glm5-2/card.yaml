      --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --megatron-path work/model-verification/glm5-2/hybrid/cpu-megatron
      --torch-dtype bfloat16

      '
    last_verified: null
    expected_result: CPU HF-to-Hybrid import must cover every enabled parameter and save a strictly reloadable checkpoint.
      Hybrid execution has not yet been verified.
  hf_to_megatron_gpu:
