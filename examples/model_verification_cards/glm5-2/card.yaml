# Agent-readable model verification card. Hybrid GPU import, GPU/CPU export and inference are verified; training items are pending.
title: glm5_2
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  The GLM family now uses HybridModel with separate DSA and dense/MoE layers. Distributed GPU import, GPU and CPU
  export, and deterministic legacy full-prefix inference of the Hybrid implementation are verified on GB200; the
  remaining items are pending.
  Historical GPT results remain in Git history. Import directly from the pinned HF revision into a fresh Hybrid
  checkpoint root.
  Old GPT checkpoints and optimizer states are not migration inputs. Training must retain MTP1 and the original
  DSA top-k sharing schedule; non-VPP recipes require fresh evidence.'
verification_index:
  model_level:
    verified:
    - hf_to_megatron_gpu
    - megatron_to_hf_cpu
    - megatron_to_hf_gpu
    - inference
    unverified:
    - hf_to_megatron_cpu
    - manual_forward_pass
  training:
    GB200:
      unverified:
      - pretrain
      - sft
      - sft_export_inference
      - sft_long_context
      - peft
      - checkpoint_resume
model:
  hf_id: zai-org/GLM-5.2
  hf_revision: 4d67f66cc64d3219133b767c253b2ad1425c6c88
  architecture: GlmMoeDsaForCausalLM
  min_transformers_version: 5.12.1
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08.rc3
  bridge_commit: fc668edc894255bc1d20043af179a09646046289
items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: './scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1 --hf-model zai-org/GLM-5.2
      --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --megatron-path work/model-verification/glm5-2/hybrid/cpu-megatron
      --torch-dtype bfloat16

      '
    last_verified: null
    expected_result: CPU HF-to-Hybrid import must cover every enabled parameter and save a strictly reloadable checkpoint.
      Hybrid execution has not yet been verified.
  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh import --executor slurm --device gpu --nodes 4 --gpus-per-node 4
      --hf-model zai-org/GLM-5.2 --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --megatron-path work/model-verification/glm5-2/hybrid/gpu-megatron
      --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp 1 --distributed-timeout-minutes 60 --low-memory-save

      '
    last_verified: 2026-09-19
    expected_result: Distributed HF-to-Hybrid import on 16 GB200 GPUs maps all 5916 pinned source tensors through
      GLM5Bridge (shared-indexer layers carry no indexer tensors) and saves a 1.4 TB distributed checkpoint
      (iter_0000000 with run_config.yaml) in about 12 minutes. The checkpoint is strictly reloadable, as exercised
      by the GPU export. The appended MTP layer stays disabled by default.
  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 4 --cpu-processes-per-node
      8 --cpus-per-task 16 --mem 0 --exclusive --hf-model zai-org/GLM-5.2 --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88
      --megatron-path work/model-verification/glm5-2/hybrid/gpu-megatron/iter_0000000 --hf-path work/model-verification/glm5-2/hybrid/cpu-hf-export
      --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp 2 --distributed-timeout-minutes 240 --distributed-save --save-every-n-ranks
      1 --no-progress

      '
    last_verified: 2026-09-19
    expected_result: Distributed CPU Hybrid-to-HF export with 32 Gloo processes on the host memory of 4 GB200 nodes
      strictly reloads the imported checkpoint and writes 279 safetensors shards plus model.safetensors.index.json in
      about 30 minutes. All 58794 exported tensors match the pinned source keys, shapes, dtypes and values exactly;
      the 791 tensors of the appended MTP layer (model.layers.78.*) are excluded because MTP is disabled by default,
      and shared-indexer layers carry no indexer tensors on either side. Weights stay on CPU, but Megatron-Core's
      CUDA RNG tracker still requires a visible CUDA device on each node during model-parallel initialization, so
      the run cannot execute on GPU-less nodes. generation_config.json is preserved from the source because
      Transformers strict validation rejects re-saving it.
  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh export --executor slurm --device gpu --nodes 4 --gpus-per-node 4
      --hf-model zai-org/GLM-5.2 --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --megatron-path work/model-verification/glm5-2/hybrid/gpu-megatron/iter_0000000
      --hf-path work/model-verification/glm5-2/hybrid/gpu-hf-export --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp
      1 --distributed-timeout-minutes 60 --distributed-save --save-every-n-ranks 1

      '
    last_verified: 2026-09-19
    expected_result: Distributed Hybrid-to-HF export on 16 GB200 GPUs strictly reloads the imported checkpoint and
      writes 279 safetensors shards plus model.safetensors.index.json in about 13 minutes. All 58794 exported tensors
      match the pinned source keys, shapes, dtypes and values exactly; the 791 tensors of the appended MTP layer
      (model.layers.78.*) are excluded because MTP is disabled by default, and shared-indexer layers carry no indexer
      tensors on either side. generation_config.json is preserved from the source because Transformers strict
      validation rejects re-saving it.
  manual_forward_pass:
    status: unverified
    precision: bf16
    command: ./scripts/inference/infer.sh --nodes 13 --gpus-per-node 4 --task model-comparison --hf_model_path zai-org/GLM-5.2
      --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --hf-logits-input work/model-verification/glm5-2/hybrid/hf-forward-reference.safetensors
      --megatron-forward-mode standard --megatron_model_path work/model-verification/glm5-2/hybrid/gpu-megatron
      --prompt "The capital of France is" --tp 1 --pp 13 --ep 4 --etp 1
    last_verified: null
    expected_result: Pinned HF and Hybrid logits must have cosine similarity at least 0.99 and matching next-token
      predictions. Record max and mean absolute differences. Also compare the corresponding GPT graph on fixed weights
      and inputs. Hybrid execution has not yet been verified.
  inference:
    status: verified
    precision: bf16
    command: ./scripts/inference/infer.sh --nodes 4 --gpus-per-node 4 --task legacy-full-prefix-generation --hf_model_path
      zai-org/GLM-5.2 --hf-revision 4d67f66cc64d3219133b767c253b2ad1425c6c88 --prompt "Write one concise sentence
      explaining why deterministic tests matter:" --apply-chat-template --thinking-mode disabled --max_new_tokens
      16 --legacy-full-prefix --tp 1 --pp 2 --ep 8 --etp 1
    last_verified: 2026-09-19
    expected_result: 'Hybrid deterministic greedy inference on 16 GB200 GPUs generates exactly 16 tokens (the
      max_new_tokens bound; no eos_token_id is emitted). The decoded completion is two lines: "1.  **Analyze the
      Request:**" (two spaces after the period) followed by a newline and "    *   **Topic:**" (four leading
      spaces). DSA full-prefix compatibility inference is not an optimized decode benchmark.'
  pretrain:
    GB200:
      status: unverified
      precision: bf16
      command: './scripts/training/train.sh --nodes 48 --gpus-per-node 4 --recipe glm52_pretrain_192gpu_gb200_bf16_config
        --mode pretrain --dataset megatron-indexed --deterministic --seq_length 4096 --max_steps 100 --lr 3e-4 --min_lr
        3e-5 --warmup_iters 40 ''dataset.blend=[["work/data/rp2/head_01_text_document"],null]'' dataset.path_to_cache=work/cache/glm5-2/rp2-head-01-gb200
        dataset.random_seed=1234 dataset.num_workers=8 tokenizer.tokenizer_type=SentencePieceTokenizer tokenizer.tokenizer_model=work/data/rp2/tokenizer/tokenizer.model
        tokenizer.use_tokenizer_vocab_size=false rng.seed=1234 scheduler.lr_decay_iters=100 model.moe_router_force_load_balancing=false
        checkpoint.load=null checkpoint.pretrained_checkpoint=null checkpoint.save_optim=true checkpoint.save_rng=true
        checkpoint.load_optim=true checkpoint.load_rng=true checkpoint.finetune=false --save_dir work/model-verification/glm5-2/hybrid/pretrain-rp2-gb200/checkpoints
        --save_interval 50 logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null

        '
      last_verified: null
      expected_result: Complete 100 real-data Hybrid pretraining steps with finite losses and zero skipped or NaN
        iterations, preserving the existing convergence contract. Save a full step-50 checkpoint and the post-setup
        config. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  sft:
    GB200:
      status: unverified
      precision: bf16
      command: './scripts/training/train.sh --nodes 48 --gpus-per-node 4 --recipe glm52_sft_192gpu_gb200_bf16_config
        --mode sft --pretrained_checkpoint work/model-verification/glm5-2/hybrid/hf-4d67f66cc64d3219133b767c253b2ad1425c6c88
        --max_steps 100 tokenizer.chat_template_path=work/templates/glm52_chat_template_generation.jinja --save_dir
        work/model-verification/glm5-2/hybrid/sft-gb200-cudnn/checkpoints --save_interval 100 logger.log_interval=1
        logger.log_throughput=true logger.tensorboard_dir=null

        '
      last_verified: null
      expected_result: Complete 100 real-data Hybrid full-SFT steps with finite losses, unchanged data/masking/packing
        semantics, and a full reloadable checkpoint. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  sft_export_inference:
    GB200:
      status: unverified
      precision: bf16
      depends_on: sft
      last_verified: null
      expected_result: Export the verified Hybrid SFT checkpoint, strictly reload it in Transformers, and record
        deterministic greedy completion and actual token count. Hybrid execution has not yet been verified.
      commands: null
  sft_long_context:
    GB200:
      status: unverified
      precision: bf16
      command: './scripts/training/train.sh --nodes 48 --gpus-per-node 4 --recipe glm52_sft_192gpu_gb200_bf16_128k_config
        --mode sft --pretrained_checkpoint work/model-verification/glm5-2/hybrid/hf-4d67f66cc64d3219133b767c253b2ad1425c6c88
        --max_steps 20 tokenizer.chat_template_path=work/templates/glm52_chat_template_generation.jinja dataset.dataset_root=work/data/glm5-2/synthetic-long-sft-128k
        dataset.max_train_samples=1120 logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null

        '
      last_verified: null
      expected_result: Complete the hardware recipe long-context Hybrid workload with packed CP, finite losses and
        zero skipped or NaN iterations. Verify causal positions and top-k sharing before scaling up. Hybrid execution
        has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  peft:
    GB200:
      status: unverified
      precision: bf16
      command: './scripts/training/train.sh --nodes 48 --gpus-per-node 4 --recipe glm52_peft_192gpu_gb200_bf16_config
        --mode lora --pretrained_checkpoint work/model-verification/glm5-2/hybrid/gpu-megatron/iter_0000000 --max_steps
        100 tokenizer.chat_template_path=work/templates/glm52_chat_template_generation.jinja --save_dir work/model-verification/glm5-2/hybrid/peft-gb200-cudnn/checkpoints
        --save_interval 100 logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null

        '
      last_verified: null
      expected_result: Complete 100 Hybrid LoRA steps with the original targets and hyperparameters; reload the
        adapter checkpoint and verify the trainable parameter set. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  checkpoint_resume:
    GB200:
      status: unverified
      precision: bf16
      depends_on: pretrain
      command: './scripts/training/train.sh --nodes 48 --gpus-per-node 4 --recipe glm52_pretrain_192gpu_gb200_bf16_config
        --mode pretrain --dataset megatron-indexed --deterministic --seq_length 4096 --max_steps 100 --lr 3e-4 --min_lr
        3e-5 --warmup_iters 40 ''dataset.blend=[["work/data/rp2/head_01_text_document"],null]'' dataset.path_to_cache=work/cache/glm5-2/rp2-head-01-gb200
        dataset.random_seed=1234 dataset.num_workers=8 tokenizer.tokenizer_type=SentencePieceTokenizer tokenizer.tokenizer_model=work/data/rp2/tokenizer/tokenizer.model
        tokenizer.use_tokenizer_vocab_size=false rng.seed=1234 scheduler.lr_decay_iters=100 model.moe_router_force_load_balancing=false
        checkpoint.ckpt_step=50 checkpoint.save_optim=true checkpoint.save_rng=true checkpoint.load_optim=true checkpoint.load_rng=true
        checkpoint.finetune=false --load_dir work/model-verification/glm5-2/hybrid/pretrain-rp2-gb200/checkpoints
        --save_dir work/model-verification/glm5-2/hybrid/pretrain-rp2-resume-gb200/checkpoints --save_interval 0
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null

        '
      last_verified: null
      expected_result: Resume the matching Hybrid pretrain step-50 checkpoint through step 100, restoring optimizer,
        scheduler, RNG and data order. Compare steps 51 and 100 with the uninterrupted reference within 1e-6 absolute
        plus 1% relative tolerance. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      resume_comparison:
        reference_item: pretrain
        sentinel_steps:
        - 51
        - 100
        loss_relative_tolerance: 0.01
        loss_absolute_tolerance: 1.0e-06
        sentinels_match: null
