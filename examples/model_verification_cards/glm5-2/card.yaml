        --save_dir work/model-verification/glm5-2/hybrid/pretrain-wikitext-resume-gb200-20261007-135936/checkpoints
        --save_interval 20 logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null logger.save_config_filepath=work/model-verification/glm5-2/hybrid/pretrain-wikitext-resume-gb200-20261007-135936/resolved-config.yaml
        dist.distributed_timeout_minutes=60
      last_verified: 2026-10-07
      expected_result: Reloaded the Hybrid WikiText-103 step-10 checkpoint with optimizer, scheduler, RNG and data
        order, then completed steps 11-20 on 192 GB200 GPUs and saved the resumed step-20 checkpoint. Every resumed
