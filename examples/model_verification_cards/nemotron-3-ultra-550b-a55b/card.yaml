# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_ultra_550b_a55b
summary: >
  Nemotron 3 Ultra 550B-A55B has public packed full-SFT and packed PEFT recipes.
  Its large-scale BF16 library pretraining workflows remain unverified because
  the previously recorded 256-GPU recipe names are not exported on current
  main. The separately scoped
  pretrain_performance.GB200 and pretrain_performance.GB300 are verified with
  their canonical 256-GPU MXFP8 recipes.
  Its pinned 24-GPU BF16 Hugging Face-to-Megatron-to-Hugging Face round trip,
  single-process CPU export, and checkpoint-backed deterministic inference are
  verified. CPU import, portable manual-forward, remaining functional
  training, and checkpoint resume still require completed verification runs
  before those support claims are promoted.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - inference
    unverified:
      - hf_to_megatron_cpu
      - manual_forward_pass
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unsupported: [sft_long_context]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unsupported: [sft_long_context]
  performance:
    GB200: verified
    GB300: verified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
  hf_revision: 624ba927cfbef0427354998700de3d51173c8c04  # pragma: allowlist secret
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08
  bridge_commit: d352aceda8ed4136f1db787bcf449c1b210a2438  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-megatron
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      A machine with enough host memory must import the complete pinned BF16
      checkpoint, persist iter_0000000, and reload it without missing,
      unexpected, shape-mismatched, dtype-mismatched, or value-mismatched
      tensors.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    bridge_commit: 782c48c3bf3aa1066a1564f1206b3866495e9439  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 3 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron
      --torch-dtype bfloat16 --tp 1 --pp 3 --ep 8 --etp 1
    last_verified: 2026-07-25
    expected_result: >
      The command exited successfully and persisted a reloadable iter_0000000
      at TP1/PP3/EP8/ETP1. Exact distributed export back to the immutable source
      revision accounted for all 51,023 Nemotron-H, LatentMoE, Mamba, attention,
      and MTP tensors and 560,524,603,904 parameters with matching names,
      shapes, dtypes, and values.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    bridge_commit: 60442bb9adb5435b47db22c6c20aacdf772fbddc  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path
      work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: 2026-08-26
    expected_result: >
      The single-process CPU export exits successfully and writes all 51,023
      tensors, 560,524,603,904 values, and 1,121,049,257,984 tensor-payload
      bytes. Keys, shapes, dtypes, and values are bitwise identical to the
      pinned source with no dtype conversions, preserving its BF16 model
      weights and FP32 expert-score correction biases. Transformers strictly
      reloads the output natively as NemotronHForCausalLM with all 927 state
      tensors and no loading discrepancies.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    bridge_commit: 782c48c3bf3aa1066a1564f1206b3866495e9439  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 3 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3-ultra-550b-a55b/hf-export
      --torch-dtype bfloat16
      --distributed-save --tp 1 --pp 3 --ep 8 --etp 1
    last_verified: 2026-07-25
    expected_result: >
      The command exited successfully and wrote 225 source-native Hugging Face
      shards. All 51,023 tensors and 560,524,603,904 parameters matched the
      pinned source exactly in name, shape, dtype, and value, preserving BF16
      model weights and FP32 expert-score correction biases. Semantic
      configuration, generation configuration, the 131,072-token vocabulary,
      special tokens, chat template, and representative encodings also
      matched, and the export reloaded natively with NemotronHConfig and
      architecture NemotronHForCausalLM.

  manual_forward_pass:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Historical evidence selected token ID 1256 in both models, decoded as
      two spaces, with cosine similarity 0.999861, maximum absolute logit
      difference 0.265625, and mean absolute difference 0.062669. Ultra cannot
      co-reside as one rank-local Hugging Face model and a distributed Megatron
      model, and compare.py is intentionally unchanged. A future portable
      orchestration path must produce equivalent evidence before promotion.

