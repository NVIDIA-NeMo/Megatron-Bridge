# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_ultra_550b_a55b
summary: >
  Nemotron 3 Ultra 550B-A55B has public large-scale BF16 library pretraining
  recipes for H100 and GB200. They adopt memory-feasible large-scale execution
  settings while retaining natural routing, numerical checks, and the library
  training objective. The exact 256-H100 real-data support run is verified;
  GB200 remains pending its exact real-data run. The model also has public
  packed full-SFT and packed PEFT recipes. The separately scoped
  pretrain_performance.GB200 and pretrain_performance.GB300 are verified with
  their canonical 256-GPU MXFP8 recipes.
  Its pinned 24-GPU BF16 Hugging Face-to-Megatron-to-Hugging Face round trip is
  verified. CPU conversion, portable manual-forward and deterministic-inference
  reruns, remaining functional training, checkpoint resume, and the separately
  scoped GB200 and H100 FSDP workloads still require completed verification
  runs before those support claims are promoted.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified: [pretrain]
      unverified: [sft, sft_export_inference, peft, checkpoint_resume]
      unsupported: [sft_long_context]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unsupported: [sft_long_context]
  performance:
    GB200: verified
    GB300: verified
  fsdp:
    GB200: unverified
    H100: unverified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
  hf_revision: 624ba927cfbef0427354998700de3d51173c8c04  # pragma: allowlist secret
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.06
  bridge_commit: 69bd20947c629aff4aaafebfcdce4062666cffbc  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-megatron
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      A machine with enough host memory must import the complete pinned BF16
      checkpoint, persist iter_0000000, and reload it without missing,
      unexpected, shape-mismatched, dtype-mismatched, or value-mismatched
      tensors.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    bridge_commit: 782c48c3bf3aa1066a1564f1206b3866495e9439  # pragma: allowlist secret
    command: >
