# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_ultra_550b_a55b
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. Standalone pretrain_fsdp.GB200 and pretrain_fsdp.H100 recipes use
  the same sequence-length-8192, GBS/MBS 512/1, TP4/PP1/EP64 benchmark
  workload where the hardware permits; both remain unverified. Nemotron 3
  Ultra 550B-A55B has public BF16 H100 pretraining, packed full-SFT, and packed
  PEFT recipes. Its pinned 24-GPU BF16
  Hugging Face-to-Megatron-to-Hugging Face round trip and deterministic
  Megatron inference are verified. CPU conversion, manual forward parity,
  functional training, checkpoint resume, and the GB200 and H100 FSDP
  workloads still require completed verification runs before those support
  claims are promoted.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
      - inference
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
      - manual_forward_pass
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unsupported: [sft_long_context]
  fsdp:
    GB200: unverified
    H100: unverified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
  hf_revision: 624ba927cfbef0427354998700de3d51173c8c04  # pragma: allowlist secret
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.06
  bridge_commit: 782c48c3bf3aa1066a1564f1206b3866495e9439  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-megatron
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      A machine with enough host memory must import the complete pinned BF16
      checkpoint, persist iter_0000000, and reload it without missing,
      unexpected, shape-mismatched, dtype-mismatched, or value-mismatched
      tensors.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 3 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron
      --torch-dtype bfloat16 --tp 1 --pp 3 --ep 8 --etp 1
    last_verified: 2026-07-25
    expected_result: >
      The command exited successfully and persisted a reloadable iter_0000000
      at TP1/PP3/EP8/ETP1. Exact distributed export back to the immutable source
      revision accounted for all 51,023 Nemotron-H, LatentMoE, Mamba, attention,
      and MTP tensors and 560,524,603,904 parameters with matching names,
      shapes, dtypes, and values.

  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3-ultra-550b-a55b/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      The CPU export must write a complete source-native Hugging Face
      checkpoint: BF16 model weights plus the source FP32 expert-score
      correction biases. Configuration, generation configuration, tokenizer
      assets, tensor names, shapes, dtypes, and values must match the pinned
      source and reload natively as NemotronHForCausalLM.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 3 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron-path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3-ultra-550b-a55b/hf-export
      --torch-dtype bfloat16
      --distributed-save --tp 1 --pp 3 --ep 8 --etp 1
    last_verified: 2026-07-25
    expected_result: >
      The command exited successfully and wrote 225 source-native Hugging Face
      shards. All 51,023 tensors and 560,524,603,904 parameters matched the
      pinned source exactly in name, shape, dtype, and value, preserving BF16
      model weights and FP32 expert-score correction biases. Semantic
      configuration, generation configuration, the 131,072-token vocabulary,
      special tokens, chat template, and representative encodings also
      matched, and the export reloaded natively with NemotronHConfig and
      architecture NemotronHForCausalLM.

  manual_forward_pass:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      Verification requires the pinned Hugging Face and imported Megatron
      models to agree on the prompt's next token with cosine similarity of at
      least 0.99; maximum and mean absolute logit differences must also be
      reported. The comparison helper must first support distributing both
      approximately 550-billion-parameter paths across enough accelerators.

  inference:
    status: verified
    precision: bf16
    command: >
      uv run python examples/conversion/hf_to_megatron_generate_text.py
      --hf_model_path nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron_model_path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
      --tp 1 --pp 3 --ep 8 --etp 1
      --prompt "Explain why the sky appears blue in one sentence."
      --max_new_tokens 32 --apply-chat-template --thinking-mode disabled
    last_verified: 2026-07-25
    expected_result: >
      The distributed Megatron execution reloaded the pinned BF16 checkpoint
      and completed the exact 32-token deterministic greedy decode without an
      earlier EOS. The JSON-escaped literal completion was "The user wants a
      one-sentence explanation for why the sky appears
      blue.\u003c/think\u003eThe sky appears blue because Earth's atmosphere
      scatters shorter (blue)".

  pretrain:
    H100:
      status: unverified
      precision: bf16
      enabled_features:
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 3 --gpus-per-node 8
        --recipe nemotron_3_ultra_pretrain_24gpu_h100_bf16_config
        --mode pretrain --dataset megatron-indexed --max_steps 100 --wait
        'dataset.blend=[["work/data/rp2/head_01_text_document"],null]'
        dataset.path_to_cache=work/cache/nemotron-3-ultra-550b-a55b/rp2
        tokenizer.tokenizer_type=SentencePieceTokenizer
        tokenizer.tokenizer_model=work/data/rp2/tokenizer.model
        dataset.random_seed=1234 dataset.num_workers=8 rng.seed=1234
        --save_dir work/model-verification/nemotron-3-ultra-550b-a55b/pretrain-reference-checkpoints
        --save_interval 50
        checkpoint.load=null
        validation.eval_iters=0 validation.eval_interval=0
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/nemotron-3-ultra-550b-a55b/pretrain-reference-resolved.yaml
        logger.tensorboard_dir=null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        The public 24-H100 BF16 recipe must complete all 100 bounded public
        RedPajama2 head_01 optimizer steps at TP1/PP3/CP1/EP8/ETP1, GBS/MBS
        3072/1, and sequence length 8192 with the recorded SentencePiece
        tokenizer and HybridEP active. This preserves the Ultra recipe's
        model-native batch, optimizer, and constant-LR contract and is support
        verification rather than qwen3_30b_a3b_convergence_v2 cohort evidence.
        Loss must remain finite with no skipped or NaN iterations, all four
        metrics, a persisted post-setup configuration, and complete reloadable
        checkpoints at steps 50 and 100.

  sft:
    H100:
      status: unverified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 24 --gpus-per-node 8
        --recipe nemotron_3_ultra_sft_192gpu_h100_bf16_openmathinstruct2_packed_config
        --mode sft --wait
        --pretrained_checkpoint work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
        --max_steps 100
        --warmup_iters 10 scheduler.lr_decay_iters=100
        'dataset.hf_dataset.split="train_1M[:10%]"'
        'dataset.hf_dataset.load_kwargs={revision:"469216e3f46f4dacf476b382e192485ea51a143e"}'
        dataset.hf_output_root=work/data/openmathinstruct2-ultra-4096-v1
        dataset.seed=1234
        dataset.offline_packing_specs.pad_seq_to_mult=2
        validation.eval_iters=0 validation.eval_interval=0
        --save_dir work/model-verification/nemotron-3-ultra-550b-a55b/sft-checkpoints
        --save_interval 100
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/nemotron-3-ultra-550b-a55b/sft-resolved.yaml
        logger.tensorboard_dir=null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        The public 192-H100 packed OpenMathInstruct-2 full-SFT recipe must use
        the pinned dataset revision and bounded train_1M first-ten-percent
        selection, complete 100 optimizer steps at sequence length 4096 and
        GBS/MBS 128/1, and preserve pad_seq_to_mult 2. This published Ultra
        contract is support verification rather than the 8K/GBS8
        qwen3_30b_a3b_convergence_v2 cohort. Loss must remain finite with no
        skipped or NaN iterations, all four metrics, a persisted post-setup
        configuration, audited supervised-token counts, and a complete
        reloadable final checkpoint.

  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      commands: null
      last_verified: null
      expected_result: >
        After full SFT is verified, its final checkpoint must export to a
        complete BF16 Hugging Face directory, reload natively as
        NemotronHForCausalLM across enough accelerators, and complete one
        deterministic greedy generation whose literal output is recorded.

  sft_long_context:
    H100:
      status: unsupported
      precision: null
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Megatron Bridge does not publish a dedicated Ultra packed long-context
        recipe. The only published Ultra full-SFT recipe fixes sequence length
        4096 and context parallelism one, so it cannot provide the required
        joint sequence-packing and CP-greater-than-one evidence and is not
        relabeled as long-context support.

  peft:
    H100:
      status: unverified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 4 --gpus-per-node 8
        --recipe nemotron_3_ultra_peft_32gpu_h100_bf16_openmathinstruct2_packed_config
        --mode lora --wait
        --pretrained_checkpoint work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
        --max_steps 100
        --warmup_iters 10 scheduler.lr_decay_iters=100
        'dataset.hf_dataset.split="train_1M[:10%]"'
        'dataset.hf_dataset.load_kwargs={revision:"469216e3f46f4dacf476b382e192485ea51a143e"}'
        dataset.hf_output_root=work/data/openmathinstruct2-ultra-4096-v1
        dataset.seed=1234
        dataset.offline_packing_specs.pad_seq_to_mult=2
        validation.eval_iters=0 validation.eval_interval=0
        --save_dir work/model-verification/nemotron-3-ultra-550b-a55b/peft-checkpoints
        --save_interval 100
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/nemotron-3-ultra-550b-a55b/peft-resolved.yaml
        logger.tensorboard_dir=null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        The public 32-H100 packed OpenMathInstruct-2 LoRA recipe must use the
        same pinned bounded dataset and pad_seq_to_mult 2 as full SFT, match all
        declared attention, MLP, and Mamba adapter targets, and complete 100
        optimizer steps at sequence length 4096 and GBS/MBS 128/1. This
        published Ultra contract is support verification rather than the
        8K/GBS8 qwen3_30b_a3b_convergence_v2 cohort. Loss must remain finite
        with no skipped or NaN iterations, all four metrics, audited
        supervised-token counts, a persisted post-setup configuration, and a
        reloadable adapter checkpoint.

  checkpoint_resume:
    H100:
      status: unverified
      precision: bf16
      depends_on: pretrain
      command: >
        ./scripts/training/train.sh --nodes 3 --gpus-per-node 8
        --recipe nemotron_3_ultra_pretrain_24gpu_h100_bf16_config
        --mode pretrain --dataset megatron-indexed --max_steps 100 --wait
        'dataset.blend=[["work/data/rp2/head_01_text_document"],null]'
        dataset.path_to_cache=work/cache/nemotron-3-ultra-550b-a55b/rp2
        tokenizer.tokenizer_type=SentencePieceTokenizer
        tokenizer.tokenizer_model=work/data/rp2/tokenizer.model
        dataset.random_seed=1234 dataset.num_workers=8 rng.seed=1234
        --load_dir work/model-verification/nemotron-3-ultra-550b-a55b/pretrain-reference-checkpoints
        --save_dir work/model-verification/nemotron-3-ultra-550b-a55b/pretrain-resumed-checkpoints
        --save_interval 100
        checkpoint.ckpt_step=50
        validation.eval_iters=0 validation.eval_interval=0
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/nemotron-3-ultra-550b-a55b/pretrain-reference-resolved.yaml
        logger.tensorboard_dir=null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      resume_comparison:
        reference_item: pretrain
        sentinel_steps: [51, 100]
        loss_relative_tolerance: 1.0e-2
        loss_absolute_tolerance: 1.0e-6
        sentinels_match: null
      expected_result: >
        The run must restore full optimizer, scheduler, data-order, and RNG
        state from iter_0000050, continue directly at step 51 in a distinct
        output root, complete step 100, and keep the first-resumed and final
        losses within the declared one-percent plus absolute tolerance of the
        uninterrupted reference. It must record all four metrics and persist a
        complete reloadable final checkpoint.

  pretrain_fsdp:
    GB200:
      status: unverified
      precision: fp8_mx
      enabled_features:
        moe_dispatcher: hybridep
        megatron_fsdp: optim_grads_params
      command: >
        ./scripts/training/train.sh --nodes 64 --gpus-per-node 4
        --recipe nemotron_3_ultra_pretrain_256gpu_gb200_fp8mx_tp4_config
        --max_steps 50 --wait
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        peak_allocated_memory_gib: null
        peak_reserved_memory_gib: null
      expected_result: >
        On 256 GB200 GPUs, the exact canonical mock-data FSDP recipe must
        complete all 50 optimizer steps at TP4/PP1/CP1/EP64/ETP1,
        GBS/MBS 512/1, and sequence length 8192 with finite loss, no skipped or
        NaN iterations, all four training metrics, and peak allocated and
        reserved memory. MXFP8, HybridEP, the fused grouped MLP path, selective
        MoE-activation recompute, fine-grained parameter gather, and
        Megatron-FSDP must remain active without CPU activation offload.

    H100:
      status: unverified
      precision: bf16
      enabled_features:
        megatron_fsdp: optim_grads_params
      command: >
        ./scripts/training/train.sh --nodes 32 --gpus-per-node 8
        --recipe nemotron_3_ultra_pretrain_256gpu_h100_bf16_fsdp_config
        --max_steps 50 --wait
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        peak_allocated_memory_gib: null
        peak_reserved_memory_gib: null
      expected_result: >
        On 256 H100 GPUs, the exact canonical mock-data FSDP recipe must
        complete all 50 optimizer steps at TP4/PP1/CP1/EP64/ETP1,
        GBS/MBS 512/1, and sequence length 8192 with finite loss, no skipped or
        NaN iterations, all four training metrics, and peak allocated and
        reserved memory. BF16, standard all-to-all MoE dispatch, fine-grained
        parameter gather, FP32 fused weight-gradient accumulation and FP32
        gradient communication, and Megatron-FSDP must remain active with
        full-layer block recompute for the first 32 main HybridStack layers
        (16 Mamba/expert pairs) while leaving MTP on its normal backward
        path, a one-element FSDP
        communication unit that disables
        next-bucket parameter prefetch, and the native expandable-segment
        allocator. The training MLP path must use sixty-four sequence chunks to
        bound the grouped-MoE working set, and the Mamba SSD path must use
        256-token chunks to bound its chunk-state working set. The generic
        hybrid-stack checkpoint must preserve every MTP latent-projection fused
        gradient; the unsupported specialized whole-MoE replay path must not be
        used. TE grouped linears and fused weighted squared-ReLU must remain active
        through the non-op-fuser path. Eight CUDA device connections must retain
        Megatron-FSDP stream independence while bounding Hopper driver resources.
        256-KiB NCCL pair buffers must bound communication workspace, with no CPU
        activation offload.
        Gradient and loss NaN checks must remain enabled.
        Standard all-to-all avoids replaying stateful HybridEP communication;
        disabling the operation fuser retains the H100-supported TE grouped
        linears and fused activation outside the SM100-only fused
        implementation. The H100 result is standalone and is not numerically
        comparable with the GB200 MXFP8 result.
