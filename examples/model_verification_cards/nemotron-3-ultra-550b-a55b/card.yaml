        --max_steps 100
        --warmup_iters 10 scheduler.lr_decay_iters=100
        'dataset.hf_dataset.split="train_1M[:10%]"'
        'dataset.hf_dataset.load_kwargs={revision:"469216e3f46f4dacf476b382e192485ea51a143e"}'
        dataset.hf_output_root=work/data/openmathinstruct2-ultra-4096-v1
