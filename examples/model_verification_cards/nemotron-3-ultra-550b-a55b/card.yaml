      --hf-revision 624ba927cfbef0427354998700de3d51173c8c04
      --megatron_model_path work/model-verification/nemotron-3-ultra-550b-a55b/imported-megatron/iter_0000000
      --tp 1 --pp 3 --ep 8 --etp 1
      --prompt "Explain why the sky appears blue in one sentence."
      --max_new_tokens 32 --apply-chat-template --thinking-mode disabled
      --legacy-full-prefix
    last_verified: 2026-08-25
    expected_result: >
      The public launcher exited successfully after reloading the pinned BF16
      checkpoint at TP1/PP3/EP8/ETP1. Against the 32-token maximum, greedy
      decoding produced exactly 32 tokens over generation steps 0-31 without
      an earlier EOS and emitted the exact JSON-escaped literal completion "The
      user wants a one-sentence explanation for why the sky appears
      blue.\u003c/think\u003eThe sky appears blue because Earth's atmosphere
      scatters shorter (blue)".

