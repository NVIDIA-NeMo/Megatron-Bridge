    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1 --hf-model meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron-path work/model-verification/muse-glimmer-30b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/muse-glimmer-30b/cpu-hf-export
      --torch-dtype bfloat16 --overwrite
    last_verified: 2026-08-14
    expected_result: >
      Strict export exits successfully. All 1,436 BF16 tensors and
      29,776,626,688 elements match the pinned source exactly in keys, shapes,
      dtypes, and values (maximum absolute difference 0). Transformers 5.15.0
      reloads the result as MuseGlimmerForConditionalGeneration with no missing,
      unexpected, mismatched, or error keys and the same parameter count.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: >
