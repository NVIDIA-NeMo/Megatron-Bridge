# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: muse_glimmer_30b
summary: >
  Performance scope: pretrain_performance.H100 uses the tuned 32-H100
  fixed-shape mock-token dense-decoder recipe; functional training timing and
  throughput remain sanity checks. This card covers the complete Muse Glimmer
  30B vision-language checkpoint through the builder-backed model-config,
  model-builder, and model bridge path. The modeled architecture includes the
  vision tower, adapter, projection, and a native Megatron-Core HybridModel text
  decoder; it does not use a legacy model provider or GPTModel wrapper.
  CPU and TP8 GPU conversion, exact round-trip tensor equality, numerical
  forward parity, and deterministic image-conditioned inference are verified.
  TP8 LoRA PEFT is also verified; the remaining training modes are unverified.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified: [peft]
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, checkpoint_resume]
  performance:
    H100: verified
model:
  hf_id: meta-models/Muse-Glimmer-30B
  hf_revision: f84ecc3a0ea984a4c04542a84269e3d065350a6e  # pragma: allowlist secret
  architecture: MuseGlimmerForConditionalGeneration
  min_transformers_version: "5.15.0"
verification_environment:
  base_container: nvcr.io/nvidia/pytorch:26.07-py3
  bridge_commit: 1fbf9630639f83f0fbfbc840a2f77878bc9a6a97  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1 --hf-model meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron-path work/model-verification/muse-glimmer-30b/cpu-megatron
      --torch-dtype bfloat16 --overwrite
    last_verified: 2026-08-11
    expected_result: >
      On a CPU-only node with no CUDA runtime, the command builds a native
      52-layer HybridModel, completes all 1,228 mappings for 29,776,626,688
      parameters, and persists iter_0000000. The checkpoint reloads for CPU
      export, whose exact audit covers all 1,436 source tensors and
      29,776,626,688 elements with zero missing, unexpected, shape, dtype, or
      value mismatches.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    bridge_commit: 37df4b0bec9f5fff6240818baa55c5a7c0aab1e9  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8 --hf-model meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron-path work/model-verification/muse-glimmer-30b/gpu-megatron
      --torch-dtype bfloat16 --tp 8 --overwrite
    last_verified: 2026-08-11
    expected_result: >
      The eight-GPU command builds the complete native HybridModel, completes
      all 1,228 mappings, validates the TP8 distributed state, and persists
      iter_0000000. The checkpoint reloads at TP8 for strict GPU export; its
      complete round-trip audit is bitwise exact across all 1,436 tensors and
      29,776,626,688 elements.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1 --hf-model meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron-path work/model-verification/muse-glimmer-30b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/muse-glimmer-30b/cpu-hf-export
      --torch-dtype bfloat16 --overwrite
    last_verified: 2026-08-11
    expected_result: >
      Strict export exits successfully. All 1,436 BF16 tensors and
      29,776,626,688 elements match the pinned source exactly in keys, shapes,
      dtypes, and values (maximum absolute difference 0). Transformers 5.15.0
      reloads the result as MuseGlimmerForConditionalGeneration with no missing,
      unexpected, mismatched, or error keys and the same parameter count.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    bridge_commit: 0bbd420fada019562647a17fa420ec981c6f81e3  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8 --hf-model meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron-path work/model-verification/muse-glimmer-30b/gpu-megatron/iter_0000000
      --hf-path work/model-verification/muse-glimmer-30b/gpu-hf-export
      --torch-dtype bfloat16 --export-weight-dtype bfloat16
      --distributed-save --tp 8 --overwrite
    last_verified: 2026-08-11
    expected_result: >
      Strict distributed export exits successfully. Every language, vision,
      adapter, and projection tensor matches the pinned source bitwise: 1,436
      tensors and 29,776,626,688 elements with zero missing, unexpected,
      shape, dtype, or value mismatches. Transformers 5.15.0 strictly reloads
      the result with the same class and parameter count.

  manual_forward_pass:
    status: verified
    precision: bf16
    command: >
      ./scripts/inference/infer.sh --nodes 1 --gpus-per-node 8
      --task model-comparison --hf_model_path meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --model_class MuseGlimmerForConditionalGeneration
      --megatron_model_path
      work/model-verification/muse-glimmer-30b/gpu-megatron/iter_0000000
      --image_path docs/images/tp1.png
      --prompt "What type of neural network block is shown in this image?"
      --tp 8 --pp 1 --ep 1 --etp 1
    last_verified: 2026-08-11
    expected_result: >
      The repository image is 850 by 477 pixels with SHA-256
      a7a35c8abae1e6e88d4f38bd593a56e5c1f4694da9bec5cfeb0cf29cd49256b2.
      Both implementations consume 584 padded input positions and a
      2040-by-1176 processed pixel tensor. The Hugging Face and Megatron
      next-token predictions match at token 328 (' to').
      Logit cosine similarity is 0.999929, above the 0.99 gate; maximum and
      mean absolute logit differences are 0.687500 and 0.080432, respectively.

  inference:
    status: verified
    precision: bf16
    command: >
      ./scripts/inference/infer.sh --nodes 1 --gpus-per-node 8
      --task vlm-generation --hf_model_path meta-models/Muse-Glimmer-30B
      --hf-revision f84ecc3a0ea984a4c04542a84269e3d065350a6e
      --megatron_model_path
      work/model-verification/muse-glimmer-30b/gpu-megatron/iter_0000000
      --image_path docs/images/tp1.png
      --prompt "What type of neural network block is shown in this image?"
      --max_new_tokens 64 --tp 8 --pp 1 --ep 1 --etp 1
    last_verified: 2026-08-11
    expected_result: |-
      Two independent greedy runs reload the complete TP8 HybridModel
      checkpoint and use the same repository image (SHA-256
      a7a35c8abae1e6e88d4f38bd593a56e5c1f4694da9bec5cfeb0cf29cd49256b2).
      Both produce finite logits and the same exact 64-token completion without
      EOS. The response identifies the image as a "Pre-LayerNorm Transformer
      block" and accurately describes its attention, feed-forward, and residual
      paths. The literal completion, represented with JSON newline and quote
      escapes, is " to=self\u003c|message|\u003eWhat type of neural network block
      is shown in this image?\n\nThe image shows \u0022Pre-Layernorm Transformer
      Block\u0022. Transformers. Shows Layer Norm before Self-Attention, then
      Multi-Headed Attention, Linear, Dropout, residual add, then Layer Norm,
      Linear, Activation, Linear, Dropout,"

  pretrain:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Complete a bounded 100-step multimodal pretraining run with finite loss,
        no skipped or NaN iterations, all four metrics, and a reloadable final
        checkpoint.

  sft:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Complete a pinned-data 100-step multimodal SFT run with finite loss, no
        skipped or NaN iterations, all four metrics, and a reloadable final
        checkpoint.

  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      commands: null
      last_verified: null
      expected_result: >
        Export the completed SFT checkpoint to a complete Hugging Face VLM,
        strictly reload it, and complete deterministic image-conditioned
        generation with the pinned prompt.

  sft_long_context:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Complete a 100-step long-context multimodal SFT run with declared
        packing and context-parallel settings, finite loss, no skipped or NaN
        iterations, all four metrics, and a reloadable checkpoint.

  peft:
    H100:
      status: verified
      precision: bf16
      enabled_features: {}
      bridge_commit: e773fd0bfa2ba8a5c295f11f50e7758fa09dab6c  # pragma: allowlist secret
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 8
        --recipe muse_glimmer_30b_peft_8gpu_h100_bf16_config --mode lora
        --pretrained_checkpoint
        work/model-verification/muse-glimmer-30b/gpu-megatron/iter_0000000
        --max_steps 100
        --save_dir work/model-verification/muse-glimmer-30b/peft-checkpoints
        --save_interval 100 checkpoint.load=null
        logger.log_interval=1 logger.log_throughput=true
        logger.tensorboard_dir=null
      last_verified: 2026-08-12
      metrics:
        initial_loss: 0.7247973
        final_loss: 0.04332113
        last_10_steps_step_time_ms_avg: 5291.7
        last_10_steps_model_tflops_per_gpu_avg: 258.34
      expected_result: >
        The command loads the complete imported native HybridModel checkpoint,
        freezes the base model, and inserts LoRA dim 8 / alpha 16 adapters only
        into the native linear_qkv and linear_proj attention projections. All
        100 optimizer-step rows are present exactly once with finite loss, zero
        skipped iterations, and zero NaN iterations. Loss decreases from
        0.7247973 to 0.04332113, all four metrics are recorded, and the complete
        eight-shard iter_0000100 adapter checkpoint is saved with its run config,
        metadata, and train state.

  checkpoint_resume:
    H100:
      status: unverified
      precision: bf16
      depends_on: pretrain
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      resume_comparison:
        reference_item: pretrain
        sentinel_steps: [51, 100]
        loss_relative_tolerance: 1.0e-2
        loss_absolute_tolerance: 1.0e-6
        sentinels_match: null
      expected_result: >
        Resume the bounded pretraining run from an intermediate checkpoint,
        restore model, optimizer, scheduler, data-order, and RNG state, match
        declared sentinel losses within tolerance, and save a distinct
        reloadable final checkpoint.

  pretrain_performance:
    H100:
      status: verified
      precision: bf16
      command: >
        ./scripts/training/train.sh --nodes 4 --gpus-per-node 8
        --recipe muse_glimmer_30b_pretrain_32gpu_h100_fp8cs_config
        --mode pretrain --max_steps 50
      last_verified: 2026-08-12
      metrics:
        initial_loss: 12.26874
        final_loss: 0.5229914
        last_10_steps_step_time_ms_avg: 9353.63
        last_10_steps_model_tflops_per_gpu_avg: 429.18
      expected_result: >
        The exact 32-H100 command completes all 50 fixed-shape mock-token dense
        decoder steps at TP4/PP4/CP2, a 9|15|15|13 split of all 52 language
        layers, sequence length 4096, MBS6/GBS192, BF16 model and gradient state,
        and FP8 current-scaling Transformer GEMMs. The vision and projection
        towers are frozen and excluded from the fixed-shape decoder workload.
        Loss remains finite from 12.26874 to 0.5229914 with zero skipped or NaN
        iterations. Steps 41-50 average 9,353.63 ms and 429.18 model
        TFLOP/s/GPU, and the process exits successfully without checkpoint
        output.
