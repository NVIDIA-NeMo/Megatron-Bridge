      checkpoint and use the same repository image (SHA-256
      a7a35c8abae1e6e88d4f38bd593a56e5c1f4694da9bec5cfeb0cf29cd49256b2).
      Both produce finite logits and the same exact 64-token completion without
      EOS. The response identifies the image as a "Pre-LayerNorm Transformer
      block" and accurately describes its attention, feed-forward, and residual
      paths. The literal completion, represented with JSON newline and quote
      escapes, is " to=self\u003c|message|\u003eWhat type of neural network block
      is shown in this image?\n\nThe image shows \u0022Pre-Layernorm Transformer
      Block\u0022. Transformers. Shows Layer Norm before Self-Attention, then
      Multi-Headed Attention, Linear, Dropout, residual add, then Layer Norm,
      Linear, Activation, Linear, Dropout,"

  pretrain:
    H100:
      status: verified
      precision: bf16
      bridge_commit: 8be93c49130954e3257158db774d59075d2beaa6  # pragma: allowlist secret
