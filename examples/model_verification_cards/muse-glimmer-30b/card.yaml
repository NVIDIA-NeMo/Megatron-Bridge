# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: muse_glimmer_30b
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. This card covers the complete Muse Glimmer 30B vision-language
  checkpoint through the builder-backed model-config, model-builder, and model
  bridge path. The modeled architecture includes the vision tower, adapter,
  projection, and dense text decoder; it does not use a legacy model provider.
  Conversion, numerical parity, inference, and training remain unverified until
  the corresponding pinned public commands complete their declared gates.
verification_index:
  model_level:
    unverified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
model:
  hf_id: meta-models/Muse-Glimmer-30B
  hf_revision: f84ecc3a0ea984a4c04542a84269e3d065350a6e  # pragma: allowlist secret
  architecture: MuseGlimmerForConditionalGeneration
  min_transformers_version: "5.15.0"
verification_environment:
  base_container: nvcr.io/nvidia/pytorch:26.07-py3
  bridge_commit: 2e5efbab0e2039446693f61e2fc99d0233832775  # pragma: allowlist secret

