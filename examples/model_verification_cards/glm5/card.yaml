# Agent-readable model verification card. Hybrid commands are pending verification.
title: glm5
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  The GLM family now uses HybridModel with separate DSA and dense/MoE layers. All Hybrid verification is pending.
  The environment below identifies the historical GPT baseline, not verification of the Hybrid implementation; its
  results remain in Git history. Import directly from the pinned HF revision into a fresh Hybrid checkpoint root.
  Old GPT checkpoints and optimizer states are not migration inputs. Base conversion and inference exclude the appended
  MTP layer unless explicitly enabled.'
verification_index:
  model_level:
    unverified:
    - hf_to_megatron_cpu
    - hf_to_megatron_gpu
    - megatron_to_hf_cpu
    - megatron_to_hf_gpu
    - manual_forward_pass
    - inference
  training:
    H100:
      unverified:
      - pretrain
      - sft
      - sft_export_inference
      - sft_long_context
      - peft
      - checkpoint_resume
model:
  hf_id: zai-org/GLM-5
  hf_revision: 4e6698ba8e85059d749020e3c4d2123719f23926
  architecture: GlmMoeDsaForCausalLM
  min_transformers_version: 5.12.1
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08.rc3
  bridge_commit: 5db9c262411cf4561d44cdf76a134b423fdaacc2
