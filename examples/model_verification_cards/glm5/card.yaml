# Agent-readable model verification card. Hybrid GPU import, GPU/CPU export and inference are verified; training items are pending.
title: glm5
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  The GLM family now uses HybridModel with separate DSA and dense/MoE layers. Distributed GPU import, GPU and CPU
  export, and deterministic legacy full-prefix inference of the Hybrid implementation are verified on GB200; the
  remaining items are pending. Historical GPT results remain in Git history. Import directly from the pinned HF revision into a fresh Hybrid checkpoint root. Old GPT checkpoints
  and optimizer states are not migration inputs. Base conversion and inference exclude the appended MTP layer unless
  explicitly enabled.'
verification_index:
  model_level:
    verified:
    - hf_to_megatron_gpu
    - megatron_to_hf_cpu
    - megatron_to_hf_gpu
    - inference
    unverified:
    - hf_to_megatron_cpu
    - manual_forward_pass
  training:
    H100:
      unverified:
      - pretrain
      - sft
      - sft_export_inference
      - sft_long_context
      - peft
      - checkpoint_resume
model:
  hf_id: zai-org/GLM-5
  hf_revision: 4e6698ba8e85059d749020e3c4d2123719f23926
  architecture: GlmMoeDsaForCausalLM
  min_transformers_version: 5.12.1
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08.rc3
  bridge_commit: fc668edc894255bc1d20043af179a09646046289
items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: CPU HF-to-Hybrid import must cover every enabled parameter and save a strictly reloadable checkpoint.
      Hybrid execution has not yet been verified.
  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh import --executor slurm --device gpu --nodes 4 --gpus-per-node 4 --hf-model
      zai-org/GLM-5 --hf-revision 4e6698ba8e85059d749020e3c4d2123719f23926 --megatron-path work/model-verification/glm5/hybrid/gpu-megatron
      --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp 1 --distributed-timeout-minutes 60 --low-memory-save

      '
    last_verified: 2026-09-19
    expected_result: Distributed HF-to-Hybrid import on 16 GB200 GPUs maps all 6201 pinned source tensors through
      GLM5Bridge and saves a 1.4 TB distributed checkpoint (iter_0000000 with run_config.yaml) in about 10 minutes.
      The checkpoint is strictly reloadable, as exercised by the verified GPU export. The appended MTP layer stays
      disabled by default.
  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 4 --cpu-processes-per-node
      8 --cpus-per-task 16 --mem 0 --exclusive --hf-model zai-org/GLM-5 --hf-revision 4e6698ba8e85059d749020e3c4d2123719f23926
      --megatron-path work/model-verification/glm5/hybrid/gpu-megatron/iter_0000000 --hf-path work/model-verification/glm5/hybrid/cpu-hf-export
      --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp 2 --distributed-timeout-minutes 240 --distributed-save --save-every-n-ranks
      1 --no-progress

      '
    last_verified: 2026-09-19
    expected_result: Distributed CPU Hybrid-to-HF export with 32 Gloo processes on the host memory of 4 GB200 nodes
      strictly reloads the imported checkpoint and writes 280 safetensors shards plus model.safetensors.index.json in
      about 28 minutes. All 59079 exported tensors match the pinned source keys, shapes, dtypes and values exactly;
      the 791 tensors of the appended MTP layer (model.layers.78.*) are excluded because MTP is disabled by default.
      Weights stay on CPU, but Megatron-Core's CUDA RNG tracker still requires a visible CUDA device on each node
      during model-parallel initialization, so the run cannot execute on GPU-less nodes. generation_config.json is
      preserved from the source because Transformers strict validation rejects re-saving it.
  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: './scripts/conversion/convert.sh export --executor slurm --device gpu --nodes 4 --gpus-per-node 4 --hf-model
      zai-org/GLM-5 --hf-revision 4e6698ba8e85059d749020e3c4d2123719f23926 --megatron-path work/model-verification/glm5/hybrid/gpu-megatron/iter_0000000
      --hf-path work/model-verification/glm5/hybrid/gpu-hf-export --torch-dtype bfloat16 --tp 1 --pp 2 --ep 8 --etp
      1 --distributed-timeout-minutes 60 --distributed-save --save-every-n-ranks 1

      '
    last_verified: 2026-09-19
    expected_result: Distributed Hybrid-to-HF export on 16 GB200 GPUs strictly reloads the imported checkpoint and
      writes 280 safetensors shards plus model.safetensors.index.json in about 10 minutes. All 59079 exported tensors
      match the pinned source keys, shapes, dtypes and values exactly; the 791 tensors of the appended MTP layer
      (model.layers.78.*) are excluded because MTP is disabled by default. generation_config.json is preserved from
      the source because Transformers strict validation rejects re-saving it.
  manual_forward_pass:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: Pinned HF and Hybrid logits must have cosine similarity at least 0.99 and matching next-token
      predictions. Record max and mean absolute differences. Also compare the corresponding GPT graph on fixed weights
      and inputs. Hybrid execution has not yet been verified.
  inference:
    status: verified
    precision: bf16
    command: './scripts/inference/infer.sh --nodes 4 --gpus-per-node 4 --task legacy-full-prefix-generation --hf_model_path
      zai-org/GLM-5 --hf-revision 4e6698ba8e85059d749020e3c4d2123719f23926 --prompt "What is artificial intelligence?"
      --max_new_tokens 20 --legacy-full-prefix --tp 1 --pp 2 --ep 8 --etp 1

      '
    last_verified: 2026-09-19
    expected_result: 'Hybrid deterministic greedy inference on 16 GB200 GPUs generates exactly 20 tokens (the
      max_new_tokens bound; no eos_token_id is emitted). The decoded completion is " How is artificial intelligence
      going to change our lives?" including the leading space; it spans 10 visible tokens, and the remaining 10
      generated tokens are special tokens removed by skip_special_tokens decoding. DSA full-prefix compatibility
      inference is not an optimized decode benchmark.'
  pretrain:
    H100:
      status: unverified
      precision: bf16
      command: null
      last_verified: null
      expected_result: Complete 100 real-data Hybrid pretraining steps with finite losses and zero skipped or NaN
        iterations, preserving the existing convergence contract. Save a full step-50 checkpoint and the post-setup
        config. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  sft:
    H100:
      status: unverified
      precision: bf16
      command: null
      last_verified: null
      expected_result: Complete 100 real-data Hybrid full-SFT steps with finite losses, unchanged data/masking/packing
        semantics, and a full reloadable checkpoint. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      last_verified: null
      expected_result: Export the verified Hybrid SFT checkpoint, strictly reload it in Transformers, and record
        deterministic greedy completion and actual token count. Hybrid execution has not yet been verified.
      commands: null
  sft_long_context:
    H100:
      status: unverified
      precision: bf16
      command: null
      last_verified: null
      expected_result: Complete the hardware recipe long-context Hybrid workload with packed CP, finite losses and
        zero skipped or NaN iterations. Verify causal positions and top-k sharing before scaling up. Hybrid execution
        has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  peft:
    H100:
      status: unverified
      precision: bf16
      command: null
      last_verified: null
      expected_result: Complete 100 Hybrid LoRA steps with the original targets and hyperparameters; reload the
        adapter checkpoint and verify the trainable parameter set. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      enabled_features: {}
  checkpoint_resume:
    H100:
      status: unverified
      precision: bf16
      depends_on: pretrain
      command: null
      last_verified: null
      expected_result: Resume the matching Hybrid pretrain step-50 checkpoint through step 100, restoring optimizer,
        scheduler, RNG and data order. Compare steps 51 and 100 with the uninterrupted reference within 1e-6 absolute
        plus 1% relative tolerance. Hybrid execution has not yet been verified.
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      resume_comparison:
        reference_item: pretrain
        sentinel_steps:
        - 51
        - 100
        loss_relative_tolerance: 0.01
        loss_absolute_tolerance: 1.0e-06
        sentinels_match: null
