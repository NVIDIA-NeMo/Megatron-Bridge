# Draft agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable
# last_verified: YYYY-MM-DD or null
# verified requires an immutable hf_revision, successful command(s), a concrete
# expected_result, and non-null last_verified.
# unverified may retain an older last_verified date when validation is stale.
# Every training result is nested under its public hardware target.

title: qwen3_8b
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. Qwen3-8B HybridModel bidirectional CPU and TP4 conversion, manual
  forward correlation, deterministic Megatron inference, bounded pretraining,
  full SFT with exported-HF inference, PEFT, and direct checkpoint resume are
  verified on H100; long-context SFT verification remains pending.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified: [pretrain, sft, sft_export_inference, peft, checkpoint_resume]
      unverified: [sft_long_context]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
model:
  hf_id: Qwen/Qwen3-8B
  hf_revision: b968826d9c46dd6066d109eabc6255188de91218  # pragma: allowlist secret
  architecture: Qwen3ForCausalLM
  min_transformers_version: "5.8.1"
verification_environment:
  base_container: nvcr.io/nvidia/pytorch:26.06-py3
  bridge_commit: b9216b0b06192aa1bb45869c4bb695bdca807dad  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1
      --hf-model Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron-path work/model-verification/qwen3-8b/cpu-megatron
      --torch-dtype bfloat16
    last_verified: 2026-07-25
    expected_result: >
      The pinned CPU import exits successfully and creates a complete
      iter_0000000 checkpoint. Its paired CPU export reloads that checkpoint
      and exactly matches all 399 source BF16 tensors in keys, shapes, dtypes,
      and values across 16381470720 tensor payload bytes.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4
      --hf-model Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron-path work/model-verification/qwen3-8b/imported-megatron
      --torch-dtype bfloat16 --tp 4
    last_verified: 2026-07-25
    expected_result: >
      The pinned four-rank GPU import exits successfully, creates a complete
      four-shard iter_0000000 checkpoint, reloads at TP=4, and round-trips
      through distributed GPU export with all 399 source BF16 tensors and
      16381470720 tensor payload bytes matching exactly.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 1
      --hf-model Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron-path work/model-verification/qwen3-8b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/qwen3-8b/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: 2026-07-25
    expected_result: >
      The pinned CPU export exits successfully and all 399 BF16 tensors and
      16381470720 payload bytes match the source checkpoint exactly.
      Transformers reloads it strictly as Qwen3ForCausalLM with 399 tensors and
      [151936, 4096] embedding and output-head shapes.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4
      --hf-model Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron-path work/model-verification/qwen3-8b/imported-megatron/iter_0000000
      --hf-path work/model-verification/qwen3-8b/hf-export --torch-dtype bfloat16
      --export-weight-dtype bfloat16 --distributed-save --tp 4
    last_verified: 2026-07-25
    expected_result: >
      The pinned distributed export exits successfully and all 399 BF16 tensors
      and 16381470720 payload bytes match the source checkpoint exactly.
      Transformers reloads it strictly as Qwen3ForCausalLM with 399 tensors and
      [151936, 4096] embedding and output-head shapes.

  manual_forward_pass:
    status: verified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=4
      examples/conversion/compare_hf_and_megatron/compare.py
      --hf_model_path Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron_model_path work/model-verification/qwen3-8b/imported-megatron/iter_0000000
      --tp 4 --prompt "The capital of France is the city of"
    last_verified: 2026-07-25
    expected_result: >
      The pinned one-step comparison exits successfully and the next token
      matches: Hugging Face and Megatron both predict token 12095 (' Paris').
      Cosine similarity is 0.999969, maximum absolute logit difference is
      0.250000, and mean absolute logit difference is 0.031181.

  inference:
    status: verified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=4
      examples/conversion/hf_to_megatron_generate_text.py
      --hf_model_path Qwen/Qwen3-8B
      --hf-revision b968826d9c46dd6066d109eabc6255188de91218
      --megatron_model_path work/model-verification/qwen3-8b/imported-megatron/iter_0000000 --tp 4
      --prompt "The capital of France is" --max_new_tokens 32
    last_verified: 2026-07-25
    expected_result: >
      One deterministic greedy generation reloads the imported checkpoint and
      exits successfully after exactly 32 generated tokens. Literal completion
      including its leading space: " Paris. The capital of France is Paris. The
      capital of France is Paris. The capital of France is Paris. The capital
      of France is Paris. The capital"

  pretrain:
    H100:
      status: verified
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 8
        --recipe qwen3_8b_pretrain_16gpu_h100_bf16_config --mode pretrain
        --dataset megatron-indexed --seq_length 4096
        --max_steps 100
        --lr 3e-4 --min_lr 3e-5 --warmup_iters 40
        'dataset.blend=[["work/data/rp2/head_01"],null]'
        dataset.path_to_cache=work/cache/qwen3-8b/rp2
        tokenizer.tokenizer_type=SentencePieceTokenizer
        tokenizer.tokenizer_model=work/data/rp2/tokenizer.model
        rng.seed=1234 dataset.random_seed=1234
        scheduler.lr_decay_iters=100 validation.eval_iters=0 validation.eval_interval=0
        dist.distributed_timeout_minutes=30
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true checkpoint.load=null
        --save_dir work/model-verification/qwen3-8b/pretrain-reference-checkpoints --save_interval 50
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null
      last_verified: 2026-07-25
      metrics:
        initial_loss: 12.731420
        final_loss: 6.140030
        last_10_steps_step_time_ms_avg: 24361.810
        last_10_steps_model_tflops_per_gpu_avg: 527.620
      expected_result: >
        The uninterrupted bounded RP2 run completes exactly 100 steps on 16
        H100s at TP1/PP1/CP1, DP16, GBS/MBS 1024/1, and 64-way gradient
        accumulation. It reaches peak learning rate at step 40 and completes
        cosine decay at step 100. LM loss is finite from 12.731420 to 6.140030
        with no skipped or NaN iterations, all four metrics are recorded, the
        post-setup configuration persists, and complete 16-shard iter_0000050
        and iter_0000100 checkpoints are saved.

  sft:
    H100:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 4
        --recipe qwen3_8b_sft_4gpu_h100_bf16_config --mode sft
        --dataset tulu3
        --pretrained_checkpoint work/model-verification/qwen3-8b/imported-megatron/iter_0000000
        --max_steps 100 --seq_length 8192
        --lr 5e-6 --min_lr 0 --warmup_iters 10
        'dataset.hf_dataset.split="train[:10000]"'
        'dataset.hf_dataset.load_kwargs={revision:"b14afda60f1bbebe55d5d2fa1e4df5042f97f8be"}'
        '++tokenizer.hf_tokenizer_kwargs.revision="b968826d9c46dd6066d109eabc6255188de91218"'
        dataset.hf_output_root=work/data/tulu3/qwen3-8b-sft-v2-8k-b14afda60f1b
        dataset.hf_rewrite=true dataset.seed=1234 rng.seed=5678
        dataset.do_validation=false dataset.hf_validation_proportion=null
        dataset.enable_offline_packing=true
        +dataset.offline_packing_specs.pad_seq_to_mult=1 scheduler.lr_decay_iters=100
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        --save_dir work/model-verification/qwen3-8b/sft-convergence-v2-checkpoints
        --save_interval 100
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null
      last_verified: 2026-07-25
      metrics:
        initial_loss: 1.530258
        final_loss: 0.899704
        last_10_steps_step_time_ms_avg: 2026.780
        last_10_steps_model_tflops_per_gpu_avg: 373.640
      expected_result: >
        The pinned Tulu3 pad-1 offline-packed run completes exactly 100 full-SFT
        steps at sequence length 8192 with TP4/PP1/CP1, DP1, GBS/MBS 8/1, and
        eight-way gradient accumulation. LM loss is finite from 1.530258 to
        0.899704 with no skipped or NaN iterations. Packing is 99.87% efficient
        and the 6553600 token slots contain 4342763 actual supervised tokens.
        All four metrics and the post-setup configuration persist, and the
        complete four-shard iter_0000100 checkpoint reloads for export.

  sft_export_inference:
    H100:
      status: verified
      precision: bf16
      depends_on: sft
      commands:
        - >
          ./scripts/conversion/convert.sh export --executor slurm --device gpu
          --nodes 1 --gpus-per-node 4 --hf-model Qwen/Qwen3-8B
          --hf-revision b968826d9c46dd6066d109eabc6255188de91218
          --megatron-path work/model-verification/qwen3-8b/sft-convergence-v2-checkpoints/iter_0000100
          --hf-path work/model-verification/qwen3-8b/sft-convergence-v2-hf-export
          --torch-dtype bfloat16 --export-weight-dtype bfloat16
          --distributed-save --tp 4
        - >
          uv run python
          skills/create-model-verification-card/scripts/verify_hf_inference.py
          --hf-model work/model-verification/qwen3-8b/sft-convergence-v2-hf-export
          --prompt "Name the capital of France and explain its role in one sentence."
          --max-new-tokens 45 --chat-template --disable-thinking
      last_verified: 2026-07-25
      expected_result: >
        The final v2 full-SFT checkpoint exports as five indexed BF16 shards
        with 399 weights, vocabulary size 151936, and embedding and output-head
        shapes [151936, 4096]. Transformers reloads all 399 weights without
        missing, unexpected, or mismatched tensors. One deterministic greedy
        run produces exactly 45 new tokens with this literal completion, where
        \n\n denotes two newline bytes: "The capital of France is Paris. It is
        the political, economic, and cultural center of France and a major
        global city. ✅\n\nParis is the capital of France and the center of the
        country's political, economic,"

  sft_long_context:
    H100:
      status: unverified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        context_parallel_size: 2
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 8
        --recipe qwen3_8b_sft_32k_config --mode sft
        --dataset tulu3
        --pretrained_checkpoint work/model-verification/qwen3-8b/imported-megatron/iter_0000000
        --max_steps 20 --seq_length 32768 --context_parallel_size 2
        --lr 1e-6 --min_lr 0 --warmup_iters 2
        'dataset.hf_dataset.split="train[:10000]"'
        'dataset.hf_dataset.load_kwargs={revision:"b14afda60f1bbebe55d5d2fa1e4df5042f97f8be"}'
        '++tokenizer.hf_tokenizer_kwargs.revision="b968826d9c46dd6066d109eabc6255188de91218"'
        dataset.hf_output_root=work/data/tulu3/qwen3-8b-long-context-b14afda60f1b
        dataset.hf_rewrite=true dataset.seed=1234 rng.seed=5678
        dataset.do_validation=false dataset.hf_validation_proportion=null
        dataset.enable_offline_packing=true
        +dataset.offline_packing_specs.pad_seq_to_mult=8
        model.sequence_parallel=true
        model.cp_comm_type=a2a model.cross_entropy_loss_fusion=false
        scheduler.lr_decay_iters=20 validation.eval_iters=0 validation.eval_interval=0
        checkpoint.load=null checkpoint.save=null
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null
      last_verified: null
      metrics:
        initial_loss: 1.611647
        final_loss: 1.490598
        last_10_steps_step_time_ms_avg: 55077.330
        last_10_steps_model_tflops_per_gpu_avg: 44.360
      expected_result: >
        The pinned Tulu3 run completed exactly 20 SFT steps at sequence length
        32768 with TP4/PP1/CP2/SP-on, DP1, GBS/MBS 8/1, and explicit pad-8
        offline packing. LM loss was finite from 1.611647 to 1.490598 with no
        skipped or NaN iterations. Packing was 99.97% efficient and the 5242880
        token slots contained 3463090 actual supervised tokens. The workload
        remains unverified because it did not persist the required post-setup
        configuration; rerun with an explicit logger.save_config_filepath.

  peft:
    H100:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 1
        --recipe qwen3_8b_peft_1gpu_h100_bf16_config --mode lora
        --dataset tulu3
        --pretrained_checkpoint work/model-verification/qwen3-8b/imported-megatron/iter_0000000
        --max_steps 100 --seq_length 8192
        --lr 1e-4 --min_lr 0 --warmup_iters 10
        'dataset.hf_dataset.split="train[:10000]"'
        'dataset.hf_dataset.load_kwargs={revision:"b14afda60f1bbebe55d5d2fa1e4df5042f97f8be"}'
        '++tokenizer.hf_tokenizer_kwargs.revision="b968826d9c46dd6066d109eabc6255188de91218"'
        dataset.hf_output_root=work/data/tulu3/qwen3-8b-peft-v2-8k-b14afda60f1b
        dataset.hf_rewrite=true dataset.seed=1234 rng.seed=5678
        dataset.do_validation=false dataset.hf_validation_proportion=null
        dataset.enable_offline_packing=true
        +dataset.offline_packing_specs.pad_seq_to_mult=1 scheduler.lr_decay_iters=100
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        --save_dir work/model-verification/qwen3-8b/peft-convergence-v2-checkpoints
        --save_interval 100
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null
      last_verified: 2026-07-25
      metrics:
        initial_loss: 1.529487
        final_loss: 0.975589
        last_10_steps_step_time_ms_avg: 4326.870
        last_10_steps_model_tflops_per_gpu_avg: 697.720
      expected_result: >
        The pinned Tulu3 pad-1 offline-packed run completes exactly 100 LoRA
        steps at sequence length 8192 with TP1/PP1/CP1, DP1, GBS/MBS 8/1, and
        eight-way gradient accumulation. LM loss is finite from 1.529487 to
        0.975589 with no skipped or NaN iterations. Packing is 99.87% efficient
        and the 6553600 token slots contain 4342763 actual supervised tokens.
        Exactly 5308416 rank-8, alpha-16, dropout-0 linear_qkv and linear_proj
        adapter parameters train while base weights remain frozen. All four
        metrics and the post-setup configuration persist, and the complete
        single-shard iter_0000100 adapter checkpoint contains all 144 expected
        BF16 adapter tensors.

  checkpoint_resume:
    H100:
      status: verified
      precision: bf16
      depends_on: pretrain
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 8
        --recipe qwen3_8b_pretrain_16gpu_h100_bf16_config --mode pretrain
        --dataset megatron-indexed --seq_length 4096
        --max_steps 100
        --lr 3e-4 --min_lr 3e-5 --warmup_iters 40
        'dataset.blend=[["work/data/rp2/head_01"],null]'
        dataset.path_to_cache=work/cache/qwen3-8b/rp2
        tokenizer.tokenizer_type=SentencePieceTokenizer
        tokenizer.tokenizer_model=work/data/rp2/tokenizer.model
        rng.seed=1234 dataset.random_seed=1234
        scheduler.lr_decay_iters=100 validation.eval_iters=0 validation.eval_interval=0
        dist.distributed_timeout_minutes=30
        ddp.check_for_nan_in_grad=true ddp.check_for_large_grads=true
        rerun_state_machine.check_for_nan_in_loss=true
        --load_dir work/model-verification/qwen3-8b/pretrain-reference-checkpoints
        --save_dir work/model-verification/qwen3-8b/pretrain-resumed-from-reference-checkpoints
        --save_interval 50 checkpoint.ckpt_step=50
        logger.log_interval=1 logger.log_throughput=true logger.tensorboard_dir=null
      last_verified: 2026-07-25
      metrics:
        initial_loss: 6.889990
        final_loss: 6.137956
        last_10_steps_step_time_ms_avg: 24260.990
        last_10_steps_model_tflops_per_gpu_avg: 529.800
      resume_comparison:
        reference_item: pretrain
        sentinel_steps: [51, 100]
        loss_relative_tolerance: 1.0e-2
        loss_absolute_tolerance: 1.0e-6
        sentinels_match: true
      expected_result: >
        The direct 16-GPU continuation restores model, optimizer, scheduler,
        data-order, and RNG state from iter_0000050, executes only steps 51
        through 100, and saves a complete 16-shard iter_0000100 checkpoint to a
        distinct output root. All 50 losses are finite with no skipped or NaN
        iterations, all four metrics and the post-setup configuration persist,
        and the declared loss sentinels pass: resumed/reference loss is
        6.889990/6.889990 at step 51 and 6.137956/6.140030 at step 100, whose
        absolute difference of 0.002074 is within the standard
        absolute-plus-1%-relative tolerance.
