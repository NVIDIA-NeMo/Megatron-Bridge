# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: muse_spark_open_816b_a42b
summary: >
  Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing and throughput metrics are functional verification observations, not standalone optimized performance results.
  This card covers the complete Muse-Spark-Open-816B-A42B vision-and-audio-language checkpoint through the
  builder-backed Muse Spark Open model-config, model-builder, and model-bridge path: Hugging Face vision and audio
  encoders invoked directly, plus a native Megatron-Core HybridModel decoder with 62 alternating attention and
  latent-MoE blocks (124 Hybrid positions, 256 experts, top-8 routing). Results below were observed on a local
  copy of the checkpoint whose public Hugging Face repository revision is not yet pinned. The items exercised on it
  are marked verified with that caveat: model.hf_revision stays unpinned, which the card validator rejects for
  verified items, so rerun them against the pinned revision once it is published. Observed so far: GPU import at
  TP4/EP16, distributed GPU export at a different layout (TP2/EP32) with an exhaustive tensor audit, Hugging Face
  and Megatron forward correlation at TP4/EP16, and bounded LoRA training at TP4/EP16, TP4/EP32, and
  TP4/CP2/EP16 with A2A context-parallel communication. Full-prefill logits for text, image, audio, and combined
  audio-image inputs at TP4/EP16 and at TP4/EP16 with CP2 (A2A and all-gather) and CP4 (A2A) agree with the
  Hugging Face reference as closely as a TP1/EP16 run (mean cosine 0.9971 to 0.9995 per case for every layout),
  with no layout-specific degradation. Context parallelism requires A2A or all-gather
  communication because Transformer Engine rejects P2P for the sliding-window attention layers. Also observed:
  bounded warm-started text pretraining on 192 GPUs (TP1/PP6/EP32) and 256 GPUs (TP1/PP8/EP32), one-epoch
  full SFT (192 GPUs, TP4/PP6/EP32) and LoRA on attention, experts, and latent projections (64 GPUs,
  TP4/PP4/EP16) on 100K Tulu 3 conversations packed to 4K at GBS 128, which deviates from the cross-model
  8K/GBS-8 contract, full SFT with the contract settings on 192 GPUs (with export and Hugging Face reload)
  and 256 GPUs, image-text CORD-v2 SFT with export, and
  packed long-context SFT at 32K with CP2 and at 64K with CP4. The 192-GPU pretraining and SFT recipes and the
  64-GPU LoRA recipe dispatch MoE tokens with HybridEP inside one NVL72 NVLink domain per expert-parallel group;
  the other recipes use the all-to-all dispatcher. A direct checkpoint resume from step 50 of the 192-GPU
  pretraining reference, with full model, optimizer, and RNG state, matches the uninterrupted run on the branch's
  Megatron-Core pin, which includes the distributed-optimizer fix NVIDIA/Megatron-LM#7336. CPU conversion and
  cached generation are not yet exercised, and the SFT export has no maintained reload command.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
    unverified:
      - hf_to_megatron_cpu
      - megatron_to_hf_cpu
  training:
    GB200:
      verified: [pretrain, sft, sft_long_context, peft, checkpoint_resume]
      unverified: [sft_export_inference]
model:
  hf_id: meta-models/Muse-Spark-Open-816B-A42B
  hf_revision: unpinned
  architecture: MuseSparkForConditionalGeneration
  min_transformers_version: "5.20.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.10.rc0
  bridge_commit: 95b283c0817018dcdba34fbc4a083d860cf3c7cd  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      CPU import of the complete 816B checkpoint has not been attempted. GPU import is recorded separately.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 4 --gpus-per-node 4 --hf-model meta-models/Muse-Spark-Open-816B-A42B
      --hf-revision unpinned
      --megatron-path work/model-verification/muse-spark-open-816b-a42b/gpu-megatron
      --torch-dtype bfloat16 --tp 4 --pp 1 --ep 16 --etp 1 --low-memory-save
      --distributed-timeout-minutes 110
    last_verified: 2026-10-06
    bridge_commit: d941560506d6ac643b1998e7a16c0725fe1de593  # pragma: allowlist secret
    expected_result: >
      Observed on the unpinned local checkpoint with 16 GB200 GPUs: the command builds the complete native
      HybridModel with both Hugging Face perception encoders, loads all 2,000 source tensors at TP4/PP1/EP16/ETP1,
      and persists a 1.5 TB iter_0000000 distributed checkpoint from all 16 ranks. The exported audit under
      megatron_to_hf_gpu establishes its tensor content. Verified on a local copy of the checkpoint whose public
      Hugging Face revision is not yet pinned: model.hf_revision stays unpinned, which the card validator rejects for
      verified items. Rerun against the pinned revision once it is published.

  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      CPU export of the complete 816B checkpoint has not been attempted. GPU export is recorded separately.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 8 --gpus-per-node 4 --hf-model meta-models/Muse-Spark-Open-816B-A42B
      --hf-revision unpinned
      --megatron-path work/model-verification/muse-spark-open-816b-a42b/gpu-megatron/iter_0000000
      --hf-path work/model-verification/muse-spark-open-816b-a42b/gpu-hf-export
      --torch-dtype bfloat16 --tp 2 --pp 1 --ep 32 --etp 1 --distributed-save
      --distributed-timeout-minutes 110
    last_verified: 2026-10-06
    bridge_commit: d941560506d6ac643b1998e7a16c0725fe1de593  # pragma: allowlist secret
    expected_result: >
      Observed on the unpinned local checkpoint with 32 GB200 GPUs: the TP4/EP16 import reloads at
      TP2/PP1/EP32/ETP1, exercising tensor- and expert-parallel resharding, and strict distributed export writes all
      65 safetensors shards plus configuration and tokenizer files from all 32 ranks. An exhaustive comparison of
      the export against the source covers all 2,000 tensors and 822,036,529,664 elements with no missing, extra, or
      reshaped keys. All values match exactly except 1,204 of 8,192 entries of model.language_model.norm.weight
      (maximum absolute difference 0.015625), the known BF16 rounding of the zero-centered final-norm conversion. The
      124 residual-gate tensors are promoted from BF16 to FP32 with unchanged values, and the FP32 router tensors
      keep FP32. Do not pass --export-weight-dtype bfloat16: it would round the FP32 router tensors. Export at
      TP1/EP16 exhausts GPU memory during checkpoint resharding. Verified on a local copy of the checkpoint whose
      public Hugging Face revision is not yet pinned: model.hf_revision stays unpinned, which the card validator
      rejects for verified items. Rerun against the pinned revision once it is published.

  manual_forward_pass:
    status: verified
    precision: bf16
    command: >
      ./scripts/inference/infer.sh --nodes 4 --gpus-per-node 4
      --task model-comparison
      --hf_model_path meta-models/Muse-Spark-Open-816B-A42B
      --hf-revision unpinned
      --model_class MuseSparkForConditionalGeneration
      --megatron_model_path
      work/model-verification/muse-spark-open-816b-a42b/gpu-megatron/iter_0000000
      --hf-logits-path work/model-verification/muse-spark-open-816b-a42b/hf-reference.pt
      --image_path docs/images/tp1.png
      --prompt "What type of neural network block is shown in this image?"
      --tp 4 --pp 1 --ep 16 --etp 1
    last_verified: 2026-10-06
    bridge_commit: d941560506d6ac643b1998e7a16c0725fe1de593  # pragma: allowlist secret
    expected_result: >
      Observed on the unpinned local checkpoint with 16 GB200 GPUs. The HF reference logits come from a separate
      tensor-parallel Hugging Face forward over 16 GPUs on the identical processed inputs, because the complete
      model cannot be co-resident with the Megatron model. Both implementations consume 668 input positions (no
      TP padding) and a 2040-by-1176 processed pixel tensor. The next-token predictions match at token 328 (' to').
      Logit cosine similarity is 0.999975, above the 0.99 gate; maximum and mean absolute logit differences are
      0.5625 and 0.073236. Verified on a local copy of the checkpoint whose public Hugging Face revision is not yet
      pinned: model.hf_revision stays unpinned, which the card validator rejects for verified items. Rerun against the
      pinned revision once it is published, replacing the unpinned revision token in the command.

  inference:
    status: verified
    precision: bf16
    command: >
      ./scripts/inference/infer.sh --nodes 8 --gpus-per-node 4
      --task vlm-generation
      --hf_model_path meta-models/Muse-Spark-Open-816B-A42B
      --hf-revision unpinned
      --megatron_model_path work/model-verification/muse-spark-open-816b-a42b/gpu-megatron/iter_0000000
      --image_path docs/images/tp1.png --prompt "Describe this image."
      --max_new_tokens 64 --tp 4 --pp 1 --ep 32 --etp 1 --deterministic
    last_verified: 2026-10-06
    bridge_commit: d941560506d6ac643b1998e7a16c0725fe1de593  # pragma: allowlist secret
    expected_result: |-
      Observed on the unpinned local checkpoint with 32 GB200 GPUs: the imported checkpoint loads at
      TP4/PP1/EP32/ETP1 with deterministic kernels, and greedy generation for the image runs all 64 steps
      on 32 ranks without reaching end of sequence. The first token matches the next-token prediction of
      the Hugging Face model in manual_forward_pass (id 328). The completion opens the model's private
      reasoning channel and identifies the diagram correctly. The literal completion, with the channel token written as [MESSAGE], was:
      " to=self[MESSAGE]We need to describe the image. It's a diagram of Transformers, "Pre-Layernorm" Transformer Block. Show architecture. Need to describe components, flow, Nx, etc. Provide detailed description.

      Probably mention title Transformers, subtitle "Pre-Layernorm" Transformer Block, diagram shows a block"
      It produced exactly 64 new tokens. At TP4/EP16 on 16 GPUs the expert weights leave no room for the
      NCCL all-to-all buffers, and the first step fails to allocate memory. Verified on a local copy of the checkpoint
      whose public Hugging Face revision is not yet pinned: model.hf_revision stays unpinned, which the card validator
      rejects for verified items. Rerun against the pinned revision once it is published.

  pretrain:
    GB200:
      status: verified
      precision: bf16
      enabled_features:
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 48 --gpus-per-node 4
        --recipe muse_spark_open_pretrain_192gpu_gb200_bf16_config --mode pretrain
        --dataset megatron-indexed
        --pretrained_checkpoint work/model-verification/muse-spark-open-816b-a42b/gpu-megatron
        --max_steps 100
        'dataset.blend=[["work/data/rp2/head_01_musespark_text_document"],null]'
        dataset.path_to_cache=work/cache/muse-spark-open-816b-a42b/rp2-head-01-gb200
        dataset.random_seed=1234 dataset.num_workers=8 rng.seed=1234
        scheduler.lr_decay_iters=100 checkpoint.load=null
        --save_dir work/model-verification/muse-spark-open-816b-a42b/pretrain-checkpoints --save_interval 50
        checkpoint.async_save=false ddp.check_for_nan_in_grad=true
        ddp.check_for_large_grads=true rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true logger.log_device_memory_used=true
        logger.tensorboard_dir=null
        logger.save_config_filepath=work/model-verification/muse-spark-open-816b-a42b/pretrain-resolved.yaml
      last_verified: 2026-10-14
      bridge_commit: 1c1f525af2816cad38e1d55d5ac825312b53256f  # pragma: allowlist secret
      metrics:
        initial_loss: 1.841344
        final_loss: 1.720235
        last_10_steps_step_time_ms_avg: 22561.47
        last_10_steps_model_tflops_per_gpu_avg: 267.29
        last_10_steps_tokens_per_second_per_gpu_avg: 968.258
      expected_result: >
        Observed on the unpinned local checkpoint with 192 GB200 GPUs at TP1/PP6/EP32/ETP1 (pipeline stages
        of 9, 11, 11, 11, 11, and 9 decoder blocks): the command warm-starts every language-model parameter
        from the imported checkpoint with natural expert routing, full activation recompute, BF16 gradient
        reduction, and the distributed optimizer; the perception towers stay frozen because
        the data is text only. MoE tokens are dispatched with HybridEP (flex dispatcher, 32 SMs): each EP32 group is one pipeline stage's 32
        contiguous ranks on 8 nodes, which must share one NVL72 NVLink domain, and the recipe sets
        NUM_OF_HYBRID_EP_RANKS_PER_NVLINK_DOMAIN=32, NVLINK_DOMAIN_SIZE=72, and USE_MNNVL=1. Data is the first 604,180 documents of RedPajama2 head_01 (750,001,072 tokens
        in the shared LLaMA SentencePiece tokenization), decoded and re-tokenized with the model tokenizer and
        an appended end-of-document token: 677,845,358 tokens, enough for 100 steps at GBS 1024 and sequence
        length 4096 without repetition. Deviation from the bounded pretraining contract: the peak learning rate
        is 3e-5 (40 warmup steps, cosine decay to 3e-6 at step 100) instead of 3e-4 to 3e-5. In an earlier run
        with the contract's from-scratch 3e-4 peak, all-to-all dispatch, and the precision-aware optimizer enabled
        (every other setting unchanged), the warm-started model's loss rose from 1.841362 to 3.26 at the learning-rate
        peak (step 40) and to a maximum of 5.34 at step 44, stayed above 3.5 through step 62, and ended at 2.264579.
        All 100 optimizer-step rows
        are present exactly once with finite loss and gradient norm and zero skipped or NaN iterations. Loss
        decreases from 1.841344 to 1.720235 (minimum 1.7057 at step 99) with no rise at the learning-rate
        peak (1.7721 at step 40); steps 11-100 stay between 1.7057 and 1.7937, and gradient-norm spikes (59.7 at
        step 6, 13.3 at step 16) are clipped at 1.0. Steps 91-100 average 22,561.47 ms, 267.29 model TFLOP/s/GPU,
        and 968.258 token slots/s/GPU. Peak allocated memory per pipeline stage is 97.2, 104.8, 104.8, 104.8,
        104.8, and 93.3 GiB. Full model, optimizer, and RNG state, about 11.4 TB per checkpoint, is saved at steps 50
        and 100; the step-50 checkpoint is checkpoint_resume's starting point. This run used the recipe as is (HybridEP
        and its environment variables come from the recipe) on the branch's Megatron-Core pin, which includes the
        distributed-optimizer fix NVIDIA/Megatron-LM#7336; without it, saving optimizer state fails because the FP32
        router weights and residual gates share optimizer groups with BF16 parameters. With the precision-aware
        optimizer enabled and everything else unchanged, the same command ended at 1.728448 (steps 91-100 average
        1.7304 against 1.7221 here) at the same step time and peak memory. An earlier run without saves and with
        the precision-aware optimizer enabled, on an earlier Megatron-Core with HybridEP selected by command-line
        overrides, ended at 1.726057 with 22,483.32 ms per step over steps 91-100 (its model TFLOP/s/GPU, 243.93,
        used that version's FLOP count). The same command on 64 nodes with
        muse_spark_open_pretrain_256gpu_gb200_bf16_config, which keeps the all-to-all dispatcher (PP8, stages of 7, 8, 8,
        8, 8, 8, 8, and 7 blocks; the same data-parallel size and batches), run without saves, ends at 1.724089,
        averages 19,776.13 ms, 228.69 model TFLOP/s/GPU, and 828.474 token slots/s/GPU over steps 91-100, and peaks
        at 80.1 GiB per stage. The post-setup config persists. Verified on a local copy of the checkpoint whose public
        Hugging Face revision is not yet pinned: model.hf_revision stays unpinned, which the card validator rejects
        for verified items. Rerun against the pinned revision once it is published.

  sft:
    GB200:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 48 --gpus-per-node 4
        --recipe muse_spark_open_sft_192gpu_gb200_bf16_config --mode sft
        --pretrained_checkpoint work/model-verification/muse-spark-open-816b-a42b/gpu-megatron
        --max_steps 85
        tokenizer.chat_template_path=work/templates/muse_spark_open_chat_template_pinned_date.jinja
        dataset.hf_output_root=work/data/tulu3/muse-spark-open-100k-4k
        checkpoint.save=null checkpoint.load=null checkpoint.async_save=false
        ddp.check_for_large_grads=true rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true logger.log_device_memory_used=true
        logger.tensorboard_dir=null
        logger.save_config_filepath=work/model-verification/muse-spark-open-816b-a42b/sft-resolved.yaml
      last_verified: 2026-10-12
      bridge_commit: 559077db37a29522f8a4d8c2649b30adffa303af  # pragma: allowlist secret
      metrics:
        initial_loss: 1.41593
        final_loss: 0.7347853
        last_10_steps_step_time_ms_avg: 6688.57
        last_10_steps_model_tflops_per_gpu_avg: 101.55
        last_10_steps_tokens_per_second_per_gpu_avg: 408.259
      expected_result: >
        Observed on the unpinned local checkpoint with 192 GB200 GPUs: all 85 optimizer-step rows are present
        exactly once with finite loss and gradient norm and zero skipped or NaN iterations. Loss moves from
        1.41593 to 0.7347853 (minimum 0.6878 at step 42) and averages 0.7875 over steps 51-85; gradient norms of
        91.4 at step 1 and up to 178.8 at step 4 are clipped at 1.0. Steps 76-85 average 6,688.57 ms, 101.55 model
        TFLOP/s/GPU, and 408.259 token slots/s/GPU; each data-parallel replica runs 16
        microbatches per step. Peak allocated memory per pipeline stage is 87.7, 95.6, 95.6, 94.4, 94.4, and
        80.9 GiB. The post-setup config persists; no checkpoint is saved, so sft_export_inference still refers to
        an earlier checkpoint. The command warm-starts every language-model parameter from the imported checkpoint
        at TP4/PP6/EP32/ETP1 with sequence parallelism (pipeline stages of 9, 11, 11, 11, 11, and 9 decoder blocks,
        eight data-parallel replicas), full activation recompute, and the distributed optimizer with FP32 gradient
        reduction at peak LR 5e-6; the perception towers stay frozen because the data is text only. MoE tokens are dispatched with HybridEP (flex dispatcher, 32 SMs): each EP32 group is one pipeline
        stage's 32 contiguous ranks on 8 nodes, which must share one NVL72 NVLink domain, and the recipe sets
        NUM_OF_HYBRID_EP_RANKS_PER_NVLINK_DOMAIN=32, NVLINK_DOMAIN_SIZE=72, and USE_MNNVL=1. Packed sequences give
        the EP ranks different token counts, which the recipe pads to the group maximum
        (moe_hybridep_pad_uneven_dispatch_inputs); the data and loss mask are unchanged.
        Data is the first 100,000 conversations
        of the revision-pinned Tulu 3 SFT mixture, rendered with the model chat template whose current-date default
        is fixed to 2026-10-04 and offline-packed to 4,096 tokens with pad_seq_to_mult 4: 10,951 packs of 9.1
        conversations on average, 89 conversations (0.09%) truncated at 4,092 tokens. GBS 128 for 85 steps is one
        epoch over 10,880 distinct packs (max_train_samples leaves the other 71 packs unused), with 10 warmup steps and cosine decay
        to 0 at step 85, model seed 5678, and data seed 1234.
        Not comparable with other cards: this deviates from the
        qwen3_30b_a3b_convergence_v2 SFT/PEFT contract (Tulu 3 train[:10000], 8,192-token packs, GBS 8, 100
        steps), so it is support verification rather than cross-model convergence evidence. The mixture is stored
        grouped by source, so train[:100000] is 90.0% FLAN v2, 7.1% OASST1, 2.6% No Robots, and 0.2% hard-coded
        prompts. muse_spark_open_sft_256gpu_gb200_bf16_config keeps the contract shape. With those contract settings and all-to-all dispatch on the same
        192 GPUs the recipe moved the loss from 1.155696 to 0.5453231, and the 256-GPU recipe (TP4/PP8/EP32, which
        keeps the all-to-all dispatcher) from 1.155695 to 0.5597777. The run used the earlier recipe module with
        command-line overrides for the data, batch, schedule, and dispatcher and exported the HybridEP environment
        variables; the current recipe resolves to the same data, batch,
        schedule, optimizer, parallelism, recompute, and dispatcher settings as the run's saved post-setup configuration,
        apart from the unused checkpoint save interval. The image-text recipe
        muse_spark_open_sft_192gpu_gb200_bf16_multimodal_config (CORD-v2, TP1/PP6/EP32) completes 100 steps on the
        same 192 GPUs (loss 0.8243734 to 0.02772351) with zero skipped or NaN iterations. Verified on a local copy of
        the checkpoint whose public Hugging Face revision is not yet pinned: model.hf_revision stays unpinned, which
        the card validator rejects for verified items. Rerun against the pinned revision once it is published.

  sft_export_inference:
    GB200:
      status: unverified
      precision: bf16
      depends_on: sft
      commands: null
      last_verified: null
      expected_result: >
        Observed on the unpinned local checkpoint, from an earlier run of the sft recipe with the
        qwen3_30b_a3b_convergence_v2 settings (Tulu 3 train[:10000], 8,192-token packs, GBS 8, 100 steps); the
        current 100K recipe's run saves no checkpoint, so this export has not been repeated for it. convert.sh
        export of that step-100 Tulu 3 full-SFT checkpoint at TP2/PP1/EP32/ETP1 with --distributed-save completes on 32 GB200 GPUs and writes all 2,000 source
        tensor names with their source dtypes in 65 safetensors shards. Against the original checkpoint, the
        frozen vision tower, vision adapter, vision projection, and audio tower and the 62 router correction
        biases are bit-identical, and router weights, experts, and the remaining decoder change; norm weights
        whose values are all far from zero stay bit-identical in BF16 because 100 steps at a peak LR of 5e-6
        move them by less than half a BF16 unit. The export reloads with from_pretrained under Transformers
        tensor parallelism across 16 GPUs with no missing or unexpected keys. Greedy generation with a 256-token
        bound stops at end of sequence for all four validation prompts: the text prompt answers "The capital of
        France is Paris.", the image prompt answers "Red.", the audio prompt transcribes the clip exactly, and
        the audio-image prompt names the color and then transcribes the clip. The native Megatron forward of the
        same checkpoint at TP4/EP16, resharded from the PP6 training layout, produces identical greedy tokens
        for all four prompts (8, 3, 40, and 53 tokens), and the decoder inputs with the inserted media features
        match (audio bit-exact, image mean cosine 0.9999978), so the export is faithful. The image-text CORD-v2
        SFT checkpoint also exports and reloads with no missing or unexpected keys, and all four prompts stop at
        end of sequence; its native forward gives identical greedy tokens for the image and audio prompts and
        diverges from the reload on the other two only at near-tied candidates. The
        maintained single-process HF inference verifier cannot hold the 1.64 TB BF16 export on one GB200 node,
        so no maintained command is recorded. Rerun against a pinned public revision on a host that can hold
        the export to verify.

  sft_long_context:
    GB200:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        context_parallel_size: 2
      command: >
        ./scripts/training/train.sh --nodes 48 --gpus-per-node 4
        --recipe muse_spark_open_sft_192gpu_gb200_bf16_long_context_config --mode sft
        --pretrained_checkpoint work/model-verification/muse-spark-open-816b-a42b/gpu-megatron
        --max_steps 20
        tokenizer.chat_template_path=work/templates/muse_spark_open_chat_template_pinned_date.jinja
        dataset.hf_output_root=work/data/tulu3/muse-spark-open-full-sft-gb200-32k
        checkpoint.save=null checkpoint.load=null checkpoint.async_save=false
        ddp.check_for_large_grads=true rerun_state_machine.check_for_nan_in_loss=true
        logger.log_interval=1 logger.log_throughput=true logger.log_device_memory_used=true
        logger.tensorboard_dir=null
        logger.save_config_filepath=work/model-verification/muse-spark-open-816b-a42b/sft-long-context-resolved.yaml
      last_verified: 2026-10-14
      bridge_commit: 61bbcd54358b14f164f3b085eda1a4a93b9e2809  # pragma: allowlist secret
      metrics:
        initial_loss: 1.07948
        final_loss: 0.8569268
        last_10_steps_step_time_ms_avg: 5527.29
        last_10_steps_model_tflops_per_gpu_avg: 70.03
        last_10_steps_tokens_per_second_per_gpu_avg: 247.017
      expected_result: >
        Observed on the unpinned local checkpoint with 192 GB200 GPUs at TP4/PP6/CP2/EP32/ETP1 with sequence
        parallelism and all-to-all context parallelism (pipeline stages of 9, 11, 11, 11, 11, and 9 decoder
        blocks, four data-parallel replicas): all 20 optimizer-step rows are present exactly once with finite
        loss and gradient norm and zero skipped or NaN iterations. Loss moves from 1.07948 to 0.8569268
        (minimum 0.822026 at step 13); gradient norm falls from 19.3 at step 1 to between 1.3 and 5.6 from step 7
        on and is clipped at 1.0. Steps 11-20 average 5,527.29 ms, 70.03 model TFLOP/s/GPU, and 247.017 token
        slots/s/GPU. Peak allocated memory per pipeline stage is 98.5,
        105.8, 107.8, 104.4, 107.5, and 89.5 GiB. The post-setup config persists; no checkpoint is saved. The command warm-starts every
