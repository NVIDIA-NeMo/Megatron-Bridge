# Agent-readable model verification card for Nemotron 3.5 Nano.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_5_nano
summary: >
  Performance scope: pretrain_performance.H100 and pretrain_performance.GB200
  use tuned canonical performance recipes; timing and throughput metrics from
  functional training items remain sanity checks rather than optimized
  performance results. The convergence pretraining recipes retain real
  tokenization, real data, natural routing, safety checks, and checkpointing
  while adopting the corresponding hardware performance recipe's execution
  stack. The H100 performance leaf uses BF16 Adam moments in a benchmark-only
  workload and is not convergence-comparable with FP32 optimizer-state runs.
  Nemotron 3.5 Nano support verification covers conversion, inference, and
  training on H100 and GB200. The
  model.hf_id/--hf-model and model.hf_revision/--hf-revision values are
  non-functional placeholders pending publication.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
    GB200:
      verified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
  performance:
    H100: verified
    GB200: verified
  fsdp:
    GB200: verified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
  hf_revision: PUBLIC_HF_REVISION_PENDING
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.1"
verification_environment:
  base_container: nvcr.io/nvidian/nemo:26.08.rc2
  bridge_commit: 619a2df1da9517b4408ea475b428bf2aba618c8f  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    bridge_commit: 7edd7c7f68bcdd2b30cbaff426ece2ee0da9deb5  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron-path work/model-verification/nemotron-3.5-nano/cpu-megatron
      --torch-dtype bfloat16
    last_verified: 2026-07-23
    expected_result: >
      The pinned checkpoint imports on CPU, creates a reloadable iter_0000000,
      and preserves every MTP tensor for the paired CPU export. After export,
      all 6,513 tensors and 32,913,266,240 parameters match the pinned source
      exactly in name, shape, dtype, and value.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8 --tp 1 --pp 1 --ep 8 --etp 1
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron-path work/model-verification/nemotron-3.5-nano/imported-megatron
      --torch-dtype bfloat16
    last_verified: 2026-07-23
    expected_result: >
      The command exits successfully and creates a reloadable iter_0000000.
      After the paired GPU export, all 6,513 tensors and 32,913,266,240
      parameters match the pinned source exactly in name, shape, dtype, and
      value, including the MTP layers.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    bridge_commit: 7edd7c7f68bcdd2b30cbaff426ece2ee0da9deb5  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron-path work/model-verification/nemotron-3.5-nano/cpu-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3.5-nano/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: 2026-07-23
    expected_result: >
      Strict CPU export writes a native NemotronHForCausalLM checkpoint that
      reloads with Transformers. All 6,513 tensors and 32,913,266,240
      parameters match the pinned source bitwise with maximum difference zero.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8 --tp 1 --pp 1 --ep 8 --etp 1
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron-path work/model-verification/nemotron-3.5-nano/imported-megatron/iter_0000000
      --hf-path work/model-verification/nemotron-3.5-nano/hf-export
      --torch-dtype bfloat16 --distributed-save
    last_verified: 2026-07-23
    expected_result: >
      Strict export exits successfully; all 6,513 tensors match the pinned
      source bitwise with original dtypes preserved, maximum difference zero,
      and Transformers reloads the output natively as NemotronHForCausalLM.

  manual_forward_pass:
    status: verified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=8
      examples/conversion/compare_hf_and_megatron/compare.py
      --hf_model_path nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron_model_path work/model-verification/nemotron-3.5-nano/imported-megatron/iter_0000000
      --tp 1 --pp 1 --ep 8 --etp 1
      --prompt "The capital of France is the city of"
    last_verified: 2026-07-23
    expected_result: >
      The pinned-revision one-step comparison exits successfully. Hugging Face
      and Megatron next-token predictions match at token ID 6993 (" Paris");
      cosine similarity is 0.998581, above the 0.99 gate. Maximum and mean
      absolute logit differences are 0.796875 and 0.116128, respectively.

  inference:
    status: verified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=8
      examples/conversion/hf_to_megatron_generate_text.py
      --hf_model_path nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
      --hf-revision PUBLIC_HF_REVISION_PENDING
      --megatron_model_path work/model-verification/nemotron-3.5-nano/imported-megatron/iter_0000000
      --tp 1 --pp 1 --ep 8 --etp 1
      --prompt "The capital of France is" --max_new_tokens 2
    last_verified: 2026-07-23
    expected_result: >
      Two independent runs produce byte-identical output with this exact
      2-token completion, including its leading space: " Paris.".

  pretrain:
    H100:
      status: verified
      precision: bf16
      bridge_commit: 33ede31740aa44183a253a62a4bcf968f176e161  # pragma: allowlist secret
      enabled_features:
        moe_dispatcher: hybridep
        context_parallel_size: 2
        cuda_graph:
          implementation: transformer_engine
          scopes: [mamba]
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 8
        --recipe nemotron_3_5_nano_pretrain_config
        --mode pretrain --dataset megatron-indexed --seq_length 8192 --max_steps 20
        --lr 3e-4 --min_lr 3e-5 --warmup_iters 8
        'dataset.blend=[["work/data/rp2/perp_middle/middle_01_text_document"],null]'
        dataset.path_to_cache=work/cache/nemotron-3.5-nano-h100/rp2
        rng.seed=1234 dataset.random_seed=1234 scheduler.lr_decay_iters=20
        validation.eval_iters=0 validation.eval_interval=0
        model.moe_router_force_load_balancing=false
        checkpoint.load=null
        --save_dir work/model-verification/nemotron-3.5-nano-h100/pretrain-reference
        --save_interval 10 checkpoint.async_save=false
        logger.log_interval=1 logger.log_throughput=true
        logger.tensorboard_dir=null dist.distributed_timeout_minutes=120
      last_verified: 2026-07-28
      metrics:
        initial_loss: 12.18927
        final_loss: 7.239111
        last_10_steps_step_time_ms_avg: 36869.270
        # Real RP2 convergence-verification run, not a mock-data benchmark.
        last_10_steps_model_tflops_per_gpu_avg: 200.180
        peak_allocated_memory_gib: 68.547
        peak_reserved_memory_gib: 73.893
      expected_result: >
        On two complete eight-H100 nodes, the real-data RP2 CP2/p2p run
        completes exactly 20 sequence-length-8,192, GBS/MBS 512/1 optimizer
        steps with natural routing and finite LM/MTP-1/MTP-2 losses. LM loss is
        12.18927 -> 7.239111, steps 11-20 average 36,869.270 ms / 200.180
        TFLOP/s/GPU, no iteration is skipped or NaN, and complete 20-file,
        430-GiB checkpoints are written at steps 10 and 20.

    GB200:
      status: verified
      precision: bf16
      bridge_commit: edca4a7d868cd1214bf5292f28a515139470dd99  # pragma: allowlist secret
      enabled_features:
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 4
        --additional-slurm-params segment=2
        --recipe nemotron_3_5_nano_pretrain_8k_config
        --mode pretrain --dataset megatron-indexed --seq_length 8192 --max_steps 100
        --lr 3e-4 --min_lr 3e-5 --warmup_iters 8
        'dataset.blend=[["work/data/rp2/perp_middle/middle_01_text_document"],null]'
        dataset.path_to_cache=work/cache/nemotron-3.5-nano-gb200/rp2
        rng.seed=1234 dataset.random_seed=1234 scheduler.lr_decay_iters=100
        validation.eval_iters=0 validation.eval_interval=0
        model.moe_router_force_load_balancing=false
        checkpoint.load=null checkpoint.async_save=false
        --save_dir work/model-verification/nemotron-3.5-nano-gb200/pretrain-reference
        logger.log_interval=1 logger.log_throughput=true
        logger.tensorboard_dir=null dist.distributed_timeout_minutes=120
      last_verified: 2026-07-28
      metrics:
        initial_loss: 12.171970
        final_loss: 5.798433
        last_10_steps_step_time_ms_avg: 21483.630
        # Real RP2 convergence-verification run, not a mock-data benchmark.
        last_10_steps_model_tflops_per_gpu_avg: 686.920
        peak_allocated_memory_gib: 158.220
        peak_reserved_memory_gib: 162.290
      expected_result: >
        On two complete four-GPU GB200 nodes in one segment-2 NVLink domain,
        the sequence-length-8,192, GBS/MBS 512/2 real-data RP2
        convergence-verification run completes exactly 100 finite-loss
        optimizer steps with natural routing, Transformer Engine fused cross
        entropy, CUDA graphs disabled, finite LM/MTP-1/MTP-2 losses, and no
        skipped or NaN iterations. LM loss is 12.171970 -> 5.798433;
        real-data steps 91-100 average 21,483.630 ms / 686.920 TFLOP/s/GPU
        with 158.220 GiB peak allocated and 162.290 GiB peak reserved memory.
        Complete 15-file, 430-GiB checkpoints with distributed metadata are
        written at steps 50 and 100.

  pretrain_fsdp:
    GB200:
      status: verified
      variants:
        bf16:
          status: verified
          precision: bf16
          bridge_commit: edca4a7d868cd1214bf5292f28a515139470dd99  # pragma: allowlist secret
          enabled_features:
