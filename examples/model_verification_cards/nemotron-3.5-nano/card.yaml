            'dataset.blend=[["work/data/rp2/perp_middle/middle_01_text_document"],null]'
            dataset.path_to_cache=work/cache/nemotron-3.5-nano-gb200/rp2
            rng.seed=1234 dataset.random_seed=1234 scheduler.lr_decay_iters=100
            validation.eval_iters=0 validation.eval_interval=0
            model.moe_router_force_load_balancing=false
            checkpoint.load=null checkpoint.async_save=false
            --save_dir work/model-verification/nemotron-3.5-nano-gb200/pretrain-fsdp
            logger.log_interval=1 logger.log_throughput=true
            logger.tensorboard_dir=null dist.distributed_timeout_minutes=120
          last_verified: 2026-07-28
          metrics:
            initial_loss: 12.171970
            final_loss: 5.797082
            last_10_steps_step_time_ms_avg: 26665.830
            # Real RP2 convergence-verification run, not a mock-data benchmark.
            last_10_steps_model_tflops_per_gpu_avg: 553.430
            peak_allocated_memory_gib: 160.760
            peak_reserved_memory_gib: 166.230
          expected_result: >
            On two complete four-GPU GB200 nodes in one segment-2 NVLink
            domain, the sequence-length-8,192, GBS/MBS 512/2 BF16 real-data
            RP2 FSDP convergence-verification run completes exactly 100
            finite-loss optimizer steps with natural routing, Transformer
            Engine fused cross entropy, active MTP-1/MTP-2 losses, and no
            skipped or NaN iterations. LM loss is 12.171970 -> 5.797082;
            real-data steps 91-100 average 26,665.830 ms / 553.430
            TFLOP/s/GPU with 160.760 GiB peak allocated and 166.230 GiB peak
            reserved memory. Complete 14-file, 369-GiB FSDP checkpoints with
            distributed metadata are written at steps 50 and 100. Do not use
            this run to claim convergence neutrality against ordinary BF16
            pretraining: 188 of 300 shared LM/MTP loss values exceed the 1%
            loss gate, with a maximum relative difference of 12.95%, despite
            the similar final loss.

        fp8_mx:
          status: verified
          precision: fp8_mx
          bridge_commit: 968ab25dd0e8b76801e757ee9976d9806af9c11a  # pragma: allowlist secret
          enabled_features:
            moe_dispatcher: hybridep
            megatron_fsdp: optim_grads_params
          command: >
            ./scripts/training/train.sh --wait --nodes 2 --gpus-per-node 4
            --additional-slurm-params segment=2
            --recipe nemotron_3_5_nano_pretrain_8gpu_gb200_fp8mx_fsdp_config
            --mode pretrain --max_steps 20
          last_verified: 2026-07-24
          metrics:
            initial_loss: 12.19034
            final_loss: 3.913218
            last_10_steps_step_time_ms_avg: 13917.000
            # Mock-data performance run; not a convergence measurement.
            last_10_steps_model_tflops_per_gpu_avg: 795.390
            peak_allocated_memory_gib: 169.54
            peak_reserved_memory_gib: 173.86
          expected_result: >
            On two complete four-GPU GB200 nodes in one segment-2 NVLink
            domain, the sequence-length-8,192 MXFP8 FSDP recipe completes
            exactly 20 finite-loss optimizer steps with GBS/MBS 384/3, active
            MTP-1 and MTP-2 losses, and no skipped or NaN iterations. LM loss
            is 12.19034 -> 3.913218, and steps 11-20 average 13,917.000 ms /
            795.390 TFLOP/s/GPU with 169.54 GiB peak allocated and 173.86 GiB
            peak reserved memory. This run must not be compared with the BF16
            real-data pretrain or BF16 FSDP runs: it uses MXFP8, mock data,
            forced routing, GBS/MBS 384/3, and no CUDA graphs.

  sft:
    H100:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        moe_dispatcher: deepep
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 8
        --recipe nemotron_3_5_nano_sft_openmathinstruct2_packed_config
        --mode sft --max_steps 100
        --pretrained_checkpoint work/model-verification/nemotron-3.5-nano-h100/imported-megatron/iter_0000000
        --save_dir work/model-verification/nemotron-3.5-nano-h100/sft-checkpoints
      last_verified: 2026-07-30
      metrics:
        initial_loss: 0.4407026
        final_loss: 0.2756689
        last_10_steps_step_time_ms_avg: 9856.900
        last_10_steps_model_tflops_per_gpu_avg: 79.470
      expected_result: >
        Packed OpenMathInstruct-2 full SFT completes 100 finite-loss steps with
        active MTP gradients, LM loss 0.4407026 -> 0.2756689, finite MTP-1
        loss 0.7634735 -> 0.4076096, and no skipped or NaN iterations. Steps
        91-100 average 9,856.900 ms / 79.470 TFLOP/s/GPU, and the complete
        reloadable full-model checkpoint is written at step 100.

    GB200:
      status: verified
      precision: bf16
      bridge_commit: edca4a7d868cd1214bf5292f28a515139470dd99  # pragma: allowlist secret
      enabled_features:
        sequence_packing: offline
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 4
        --additional-slurm-params segment=2
        --recipe nemotron_3_5_nano_sft_openmathinstruct2_packed_tp1_config
        --mode sft --max_steps 100
        --pretrained_checkpoint work/model-verification/nemotron-3.5-nano-gb200/imported-megatron/iter_0000000
        --save_dir work/model-verification/nemotron-3.5-nano-gb200/sft-checkpoints
      last_verified: 2026-07-30
      metrics:
        initial_loss: 0.4407797
        final_loss: 0.2760494
        last_10_steps_step_time_ms_avg: 6697.760
        last_10_steps_model_tflops_per_gpu_avg: 260.770
        peak_allocated_memory_gib: 101.640
        peak_reserved_memory_gib: 104.100
      expected_result: >
        On two complete four-GPU GB200 nodes in one segment-2 NVLink domain,
        packed OpenMathInstruct-2 full SFT completes exactly 100 finite-loss
        optimizer steps with active MTP gradients. LM loss is 0.4407797 ->
        0.2760494, MTP-1 loss is 0.7641921 -> 0.4087451, and MTP-2 loss is
        0.8651200 -> 0.4649736. Steps 91-100 average 6,697.760 ms / 260.770
        TFLOP/s/GPU with 101.640 GiB peak allocated and 104.100 GiB peak
        reserved memory. No iteration is skipped or NaN, and the complete
        12-file reloadable full-model checkpoint is written at step 100.

  sft_export_inference:
    H100:
      status: verified
      precision: bf16
      depends_on: sft
      commands:
        - >
          ./scripts/conversion/convert.sh export --executor slurm --device gpu
          --nodes 2 --gpus-per-node 8 --tp 2 --pp 1 --ep 8 --etp 1
          --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
          --hf-revision PUBLIC_HF_REVISION_PENDING
          --megatron-path work/model-verification/nemotron-3.5-nano-h100/sft-checkpoints/iter_0000100
          --hf-path work/model-verification/nemotron-3.5-nano-h100/sft-hf-export
          --torch-dtype bfloat16 --export-weight-dtype bfloat16
        - >
          uv run python
          skills/create-model-verification-card/scripts/verify_hf_inference.py
          --hf-model work/model-verification/nemotron-3.5-nano-h100/sft-hf-export
          --prompt "Solve briefly: If 3x + 5 = 20, what is x?"
          --max-new-tokens 45 --chat-template --disable-thinking
      last_verified: 2026-07-30
      expected_result: "The step-100 SFT checkpoint exports 6,513 tensors, including all 270 MTP tensors, to native Hugging Face format and reloads as NemotronHForCausalLM. The deterministic verifier performs one greedy generation and produces exactly 45 new tokens. The literal completion is: \"To solve for \u0024x\u0024, follow these steps:\n\n1. Subtract 5 from both sides of the equation:\n\\[ 3x + 5 - 5 = 20 - 5 \\Rightarrow 3x\"."

    GB200:
      status: verified
      precision: bf16
      bridge_commit: edca4a7d868cd1214bf5292f28a515139470dd99  # pragma: allowlist secret
      depends_on: sft
      commands:
        - >
          ./scripts/conversion/convert.sh export --executor slurm --device gpu
          --nodes 2 --gpus-per-node 4 --tp 1 --pp 1 --ep 8 --etp 1
          --hf-model nvidia/NVIDIA-Nemotron-3.5-Nano-30B-A3B-BF16
          --hf-revision PUBLIC_HF_REVISION_PENDING
          --megatron-path work/model-verification/nemotron-3.5-nano-gb200/sft-checkpoints/iter_0000100
          --hf-path work/model-verification/nemotron-3.5-nano-gb200/sft-hf-export
          --torch-dtype bfloat16 --export-weight-dtype bfloat16
        - >
          uv run python
          skills/create-model-verification-card/scripts/verify_hf_inference.py
          --hf-model work/model-verification/nemotron-3.5-nano-gb200/sft-hf-export
          --prompt "Solve briefly: If 3x + 5 = 20, what is x?"
          --max-new-tokens 45 --chat-template --disable-thinking
      last_verified: 2026-07-30
      expected_result: "The step-100 SFT checkpoint exports 6,513 tensors, including all 270 MTP tensors, to native Hugging Face format and reloads as NemotronHForCausalLM. The deterministic verifier performs one greedy generation and produces exactly 45 new tokens. The literal completion is: \"To solve for \u0024x\u0024, follow these steps:\n\n1. Subtract 5 from both sides of the equation:\n\\[ 3x + 5 - 5 = 20 - 5 \\Rightarrow 3x\"."

  sft_long_context:
    H100:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        context_parallel_size: 2
        moe_dispatcher: deepep
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 8
        --recipe nemotron_3_5_nano_sft_config
        --mode sft --dataset openmathinstruct2 --max_steps 100 --seq_length 32768
        --lr 5e-6 --min_lr 0 --warmup_iters 10
        --tensor_model_parallel_size 2 --context_parallel_size 2
        --expert_tensor_parallel_size 1 --expert_model_parallel_size 8
        --pretrained_checkpoint work/model-verification/nemotron-3.5-nano-h100/imported-megatron/iter_0000000
        'dataset.hf_dataset.load_kwargs={revision:"469216e3f46f4dacf476b382e192485ea51a143e"}'
        dataset.enable_offline_packing=true
        'dataset.offline_packing_specs={packed_sequence_size:32768,pad_seq_to_mult:4}'
        model.sequence_parallel=true model.cp_comm_type=p2p
        model.cross_entropy_loss_fusion=true model.calculate_per_token_loss=true
        model.recompute_granularity=full model.recompute_modules=null
        model.recompute_method=uniform model.recompute_num_layers=1
        model.moe_router_force_load_balancing=false ddp.average_in_collective=false
        ddp.overlap_param_gather=false optimizer.overlap_param_gather=false
        scheduler.lr_decay_iters=100 validation.eval_iters=0 validation.eval_interval=0
        checkpoint.load=null checkpoint.save_optim=false checkpoint.save_rng=false
        checkpoint.async_save=false
        --save_dir work/model-verification/nemotron-3.5-nano-h100/long-sft-checkpoints
        --save_interval 50 logger.log_interval=1 logger.log_throughput=true
        logger.tensorboard_dir=null
      last_verified: 2026-07-30
      metrics:
        initial_loss: 0.4268321
        final_loss: 0.2649768
        last_10_steps_step_time_ms_avg: 40995.130
        last_10_steps_model_tflops_per_gpu_avg: 188.280
      expected_result: >
        Packed OpenMathInstruct-2 CP2 SFT completes exactly 100 finite-loss 32K
        steps with LM loss 0.4268321 -> 0.2649768 and MTP-1 loss 0.7375677 ->
        0.4385137. All 100 steps have finite LM/MTP losses and no skipped or
        NaN iterations. Steps 91-100 average 40,995.130 ms / 188.280
        TFLOP/s/GPU. Complete step-50 and step-100 checkpoints each contain 20
        files, distributed metadata, saved run configuration and training
        state, with latest marker 100.

    GB200:
      status: verified
      precision: bf16
      enabled_features:
        sequence_packing: offline
        context_parallel_size: 2
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 2 --gpus-per-node 4
