  pretrain:
    GB200:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Historical language-only full-checkpoint training completed ten steps
        on 32 GB200 GPUs at TP8/SP, EP32, ETP1/PP1/CP1, sequence 512, MBS1/GBS4,
        Adam LR 1e-6 and zero weight decay. Salesforce/wikitext train,
        wikitext-2-raw-v1 revision b08601e04326c79dfdd32d625aee71d232d685c3,
        supplied 1,000,000 tokens from 9,460 documents. Loss went from
        2.246053695678711 to 2.0654714107513428, with range
        [2.0654714107513428, 2.4887423515319824]; preclip gradient norms ranged
        from 16.23810386657715 to 26.358875274658203. There were zero skipped
        steps, a clean exit, and a positive sampled master-parameter update
        minimum of 1.0132789611816406e-6. BF16 gradient reduction, unfused
        allgather dispatch, and disabled shared-expert overlap were used.
        Gradient-reduction overlap was disabled because the hard-selection
        indexer has no gradient. The RC4 variable-split all-to-all path failed
        this workload; sequence 512 does not exercise the 2,048-token selection
        budget. Public-command, checkpoint, and convergence verification remain
        pending; no trustworthy throughput metrics were captured.

  sft:
    GB200:
      status: verified
      bridge_commit: 62f79249661338ea921f00d927d704bde10833cb  # pragma: allowlist secret
      precision: bf16
      enabled_features:
        moe_dispatcher: hybridep
      command: >
        ./scripts/training/train.sh --nodes 16 --gpus-per-node 4
        --recipe qwen38_flash_next_sft_64gpu_gb200_bf16_config --mode sft
        --max_steps 100
        --pretrained_checkpoint work/cache/qwen3.8-flash-next
        dataset.path=work/data/nemotron-image-v3-ecd
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/qwen3.8-flash-next/sft/resolved-config.yaml
        logger.tensorboard_dir=work/model-verification/qwen3.8-flash-next/sft/tensorboard
      last_verified: 2026-10-14
      metrics:
        initial_loss: 0.350771963596344
        final_loss: 0.16749770939350128
        last_10_steps_step_time_ms_avg: 1525.19
        last_10_steps_model_tflops_per_gpu_avg: 14.26
        last_10_steps_tokens_per_second_per_gpu_avg: 335.6958805132475
      expected_result: >
        Completed 100 native Energon-loader optimizer steps with the full HF
        checkpoint at the pinned model revision and 8,192 complete image
        conversations prepared by scripts/data/prepare_nemotron_image_v3_subset.py
        from nvidia/Nemotron-Image-Training-v3 ECD revision
        7656391d4d4cb11ec3722b34f10d499435de0460. The measured source commit used
        explicit configuration overrides now represented by the recipe defaults.
        The command requires the updated recipe defaults and is the public
        launcher equivalent of that native training workload, not a new execution
        of those defaults. The recorded bridge_commit identifies the measured
        runtime source; at that historical commit, the settings below must be
        supplied as overrides rather than using its earlier TP8 recipe defaults.
        Settings are 64 GB200 GPUs, TP4/SP, EP64, ETP1/PP1/CP1, padded sequence
        2048, MBS1/GBS16, BF16 with FP32 gradient reduction, constant LR 1e-6,
        HybridEP dispatch, fused permutation including HybridEP integration,
        fused router, bias activation, and gradient accumulation. Recomputation,
        CUDA graphs, and shared-expert overlap are disabled. All 100 losses and
        gradient norms were finite, with zero skipped/NaN iterations and a clean
        exit. The runtime-synchronized configuration was saved at setup entry.
        These are functional observations from one native-loader run. A separate
        same-input 40-step comparison against the earlier TP8 configuration had
        maximum absolute loss difference 0.008722812 and preclip gradient-norm
        difference 28.2429, beginning at step one; numerical equivalence remains
        unresolved. No matched native-loader speedup is claimed.
        Historical public-command verification at commit
        99188699f92108885b7f8823f87029369d2eb447 used TP8/GBS8 and allgather:
        loss 0.3097828 to 0.2084261, final-ten mean 1403.24 ms,
        7.75 analytical TFLOP/s/GPU and 182.43 token slots/s/GPU.
        Historical training from the recorded Bridge base with Transformers
        5.16.1 completed 5,349 steps on this bounded subset: first loss
        0.310870707035, final loss 0.01342209149, first-ten mean 0.311553779,
        and last-ten mean 0.017778902. The historical loss curve remains valid;
        repeated-subset training is not generalization evidence. Historical
        model TFLOP/s/GPU was not reliably captured.
        Token throughput counts padded slots, not supervised tokens. Logged
        TFLOP/s uses an analytical matrix-work estimate including gated-residual
        and PLE projections. At sequence 2048 the dense QSA path bypasses the
        indexer. Norms, activations, lookups, PLE depthwise convolution,
        communication, and duplicated parallel work are outside this estimate;
        it is not hardware-counter throughput or MFU.

