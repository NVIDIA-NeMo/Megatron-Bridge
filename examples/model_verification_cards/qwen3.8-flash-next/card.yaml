title: qwen3_8_flash_next
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  EARLY, UNOPTIMIZED recipes cover full-checkpoint 4K text-only training with frozen EP-sharded PLE tables and Muon,
  and image SFT with all language, vision and projector parameters trainable. Released-container GPU conversion
  verifies all supported language and vision weights, and 30 text-pretraining updates and 100 image-SFT updates
  are verified.'
verification_index:
  model_level:
    verified:
    - hf_to_megatron_gpu
    - megatron_to_hf_gpu
    unverified:
    - hf_to_megatron_cpu
    - megatron_to_hf_cpu
    - manual_forward_pass
    - inference
  training:
    GB200:
      verified:
      - pretrain
      - sft
      unverified:
      - sft_export_inference
      - sft_long_context
      - peft
      - checkpoint_resume
model:
  hf_id: Qwen/Qwen3.8-Flash-Next
  hf_revision: de4b8e4d43b917e7706784d8bb445c9af86a3540
  architecture: Qwen4ExpForConditionalGeneration
  min_transformers_version: 5.16.1
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.10
  bridge_commit: 1359a94264fadc590826edd29638b60bda554f5d
items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: CPU import and persisted-checkpoint reload have not been verified.
  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: ./scripts/conversion/convert.sh import --executor slurm --device gpu --nodes 2 --gpus-per-node 4 --tp
      4 --pp 1 --ep 8 --etp 1 --hf-model Qwen/Qwen3.8-Flash-Next --hf-revision de4b8e4d43b917e7706784d8bb445c9af86a3540
      --torch-dtype bfloat16 --megatron-path work/checkpoints/qwen3.8-flash-next-vl
    last_verified: '2026-11-22'
    expected_result: Full language/vision import persisted a native checkpoint that reloaded in a fresh export process.
      The supported full-VL roundtrip retained exact tensor keys, shapes, dtypes and bytes. A separate text-only
      import supplies the native pretraining checkpoint. MTP is unsupported and excluded.
  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: CPU export, reload, and weight equality have not been verified.
  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    command: ./scripts/conversion/convert.sh export --executor slurm --device gpu --nodes 2 --gpus-per-node 4 --tp
      4 --pp 1 --ep 8 --etp 1 --hf-model Qwen/Qwen3.8-Flash-Next --hf-revision de4b8e4d43b917e7706784d8bb445c9af86a3540
      --torch-dtype bfloat16 --export-weight-dtype bfloat16 --distributed-save --megatron-path work/checkpoints/qwen3.8-flash-next-vl
      --hf-path work/exports/exported-hf
    last_verified: '2026-11-22'
    expected_result: 'Fresh native reload and export completed. All 1,627 supported tensors match the pinned HF
      checkpoint exactly by key, shape, dtype and bytes: 333 vision tensors, 1,624 BF16 tensors and three I64 PLE
      buffers. The 31 unsupported MTP tensors are excluded. Reloaded config fields match except provenance metadata
      and unsupported MTP configuration; tokenizer and image-processor configuration and a processed image batch
      agree. An auxiliary asset checker failed on integer-key diagnostic formatting after successful export and
      weight comparison, causing the original wrapper to exit unsuccessfully. The repaired checker passed separately
      on the same preserved export in the released container. This does not verify inference or training-trajectory
      equivalence.'
    bridge_commit: 195182b68ef07ccf4b6569da1f51e75dc8c712d8
  manual_forward_pass:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: The public model-comparison command has not been qualified on this revision. Historical component-level
      numerical investigations and metadata/kernel checks do not establish complete HF/Bridge forward or training-trajectory
      parity.
  inference:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: Standalone deterministic generation has not been verified. Cached generation is unsupported
      by the current model implementation.
  pretrain:
    GB200:
      status: verified
      precision: bf16
      enabled_features:
        moe_dispatcher: hybridep
      command: ./scripts/training/train.sh --nodes 8 --gpus-per-node 4 --recipe qwen38_flash_next_text_frozen_ngram_pretrain_32gpu_gb200_bf16_muon_config
        --mode pretrain --max_steps 30 --pretrained_checkpoint work/checkpoints/qwen3.8-flash-next-text 'dataset.data_path=[work/data/wikitext2_qwen38_train_text_document]'
        logger.save_config_filepath=work/model-verification/qwen3.8-flash-next/pretrain/resolved-config.yaml logger.tensorboard_dir=work/model-verification/qwen3.8-flash-next/pretrain/tensorboard
      last_verified: '2026-11-22'
      metrics:
        initial_loss: 1.927701711654663
        final_loss: 1.3666266202926636
        last_10_steps_step_time_ms_avg: 3636.6934776306152
        last_10_steps_model_tflops_per_gpu_avg: 47.45907783508301
        last_10_steps_tokens_per_second_per_gpu_avg: 1126.2978376359156
      expected_result: 'Completed 30 natural-routing updates from a separately imported text-only native checkpoint.
        Full 48-layer language model, sequence 4096, 32 GB200 GPUs, TP2/SP, EP32/ETP1, PP1/CP1, MBS1/GBS32, BF16
        with FP32 gradient reduction. Only EP-sharded hashed n-gram tables are frozen; PLE projections, normalization
        and convolution stay trainable. Fresh layer-wise distributed Muon optimizer, constant LR 1e-4, five-step
        warmup, zero weight decay and clip 1. The data is bounded Salesforce/wikitext train, wikitext-2-raw-v1 revision
        b08601e04326c79dfdd32d625aee71d232d685c3: one million tokens from 9,460 nonblank rows in source order, EOS
        248046 appended per document and the final document trimmed to that token bound. HybridEP and MoE fusions
        are enabled; CUDA graphs, recomputation, evaluation and checkpoint saving are disabled. Final-ten metrics
        use updates 21-30. This is short functional qualification, not full convergence or a cross-model comparison.
        TFLOPs estimate matrix work, including forward-only indexer projections. At 4K, QSA attention uses a dense
        surrogate and indexer score work is not accurately counted; optimizer work, norms, lookups, PLE depthwise
        convolution and communication are excluded. Throughput counts fixed sequence token slots. All 32 ranks completed
        30 finite, unskipped updates with zero NaN iterations. Full frozen-table hashes were unchanged; tables stayed
        outside DDP and optimizer groups. Selected language parameters and FP32 Muon/Adam samples changed. The run
        consumed 960 sequences (3,932,160 token slots); preclip gradient norms ranged from 1.039667 to 12.357839.
        Native timings include lightweight verification callbacks; no profiler was active.'
  sft:
    GB200:
      status: verified
      precision: bf16
      enabled_features:
        moe_dispatcher: hybridep
      command: ./scripts/training/train.sh --nodes 16 --gpus-per-node 4 --recipe qwen38_flash_next_sft_64gpu_gb200_bf16_config
        --mode sft --max_steps 100 --pretrained_checkpoint work/cache/qwen3.8-flash-next dataset.path=work/data/nemotron-image-v3-ecd
        logger.save_config_filepath=work/model-verification/qwen3.8-flash-next/sft/resolved-config.yaml logger.tensorboard_dir=work/model-verification/qwen3.8-flash-next/sft/tensorboard
      last_verified: '2026-11-22'
      metrics:
        initial_loss: 0.3515891432762146
        final_loss: 0.16796530783176422
        last_10_steps_step_time_ms_avg: 5457.587313652039
        last_10_steps_model_tflops_per_gpu_avg: 5.890045213699341
        last_10_steps_tokens_per_second_per_gpu_avg: 93.81434882759326
      expected_result: 'Completed 100 native Energon-loader updates with the full pinned HF checkpoint and 8,192
        complete image conversations prepared by scripts/data/prepare_nemotron_image_v3_subset.py from nvidia/Nemotron-Image-Training-v3
        ECD revision 7656391d4d4cb11ec3722b34f10d499435de0460. All language, vision and projector parameters are
        trainable. Configuration: 64 GB200 GPUs, TP4/SP, EP64/ETP1, PP1/CP1, padded unpacked sequence 2048, MBS1/GBS16,
        BF16 with FP32 gradient reduction, distributed Adam, constant LR 1e-6, zero weight decay and clip 1. Natural
        routing, HybridEP and MoE fusions are enabled; CUDA graphs, recomputation, shared-expert overlap, evaluation
        and checkpoint saving are disabled. Final-ten metrics use updates 91-100. These are short functional observations
        on a bounded subset, not held-out quality, full convergence or numerical equivalence to another parallel
        layout. Throughput counts padded slots, not supervised tokens. TFLOPs estimate model matrix work rather
        than hardware utilization. At sequence 2048 the dense QSA shortcut bypasses the indexer. All 64 ranks completed
        100 finite, unskipped updates with zero NaN iterations. Image inputs and encoder execution were observed;
        selected language/vision parameters and FP32 Adam samples changed. The run consumed 1,600 conversations
        and 1,156,890 supervised tokens, counted once across dense-DP representatives. Preclip gradient norms ranged
        from 1.694735 to 28.194944. Native timings include lightweight verification callbacks; no profiler was active.'
