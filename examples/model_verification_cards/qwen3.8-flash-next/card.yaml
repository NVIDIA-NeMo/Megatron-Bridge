    command: null
    last_verified: null
    expected_result: >
      Historical full-checkpoint BF16 text-only HF, Bridge TP4/EP4, and native
      vLLM comparisons covered all 48 layers and the full vocabulary. A 64-token
      prompt met cosine similarity 0.99 and matching final argmax for all pairs.
      A 128-token prompt with EOS failed the cosine gate despite matching final
      argmax: HF/Bridge 0.986387, HF/vLLM 0.985372, Bridge/vLLM 0.985446.
      Numerical parity remains unresolved.

