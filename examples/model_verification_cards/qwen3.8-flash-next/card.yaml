  pretrain:
    GB200:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Historical language-only full-checkpoint training completed ten steps
        on 32 GB200 GPUs at TP8/SP, EP32, ETP1/PP1/CP1, sequence 512, MBS1/GBS4,
        Adam LR 1e-6 and zero weight decay. Salesforce/wikitext train,
        wikitext-2-raw-v1 revision b08601e04326c79dfdd32d625aee71d232d685c3,
        supplied 1,000,000 tokens from 9,460 documents. Loss went from
        2.246053695678711 to 2.0654714107513428, with range
        [2.0654714107513428, 2.4887423515319824]; preclip gradient norms ranged
        from 16.23810386657715 to 26.358875274658203. There were zero skipped
        steps, a clean exit, and a positive sampled master-parameter update
        minimum of 1.0132789611816406e-6. BF16 gradient reduction, unfused
        allgather dispatch, and disabled shared-expert overlap were used.
        Gradient-reduction overlap was disabled because the hard-selection
        indexer has no gradient. The RC4 variable-split all-to-all path failed
        this workload; sequence 512 does not exercise the 2,048-token selection
        budget. Public-command, checkpoint, and convergence verification remain
        pending; no trustworthy throughput metrics were captured.

  sft:
    GB200:
      status: verified
      bridge_commit: 99188699f92108885b7f8823f87029369d2eb447  # pragma: allowlist secret
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 16 --gpus-per-node 4
        --recipe qwen38_flash_next_sft_64gpu_gb200_bf16_config --mode sft
        --max_steps 100
        --pretrained_checkpoint work/cache/qwen3.8-flash-next
        dataset.path=work/data/nemotron-image-v3-ecd
        logger.log_interval=1 logger.log_throughput=true
        logger.save_config_filepath=work/model-verification/qwen3.8-flash-next/sft/resolved-config.yaml
        logger.tensorboard_dir=work/model-verification/qwen3.8-flash-next/sft/tensorboard
      last_verified: 2026-10-14
      metrics:
        initial_loss: 0.3097828
        final_loss: 0.2084261
        last_10_steps_step_time_ms_avg: 1403.24
        last_10_steps_model_tflops_per_gpu_avg: 7.75
        last_10_steps_tokens_per_second_per_gpu_avg: 182.4349362902996
      expected_result: >
        Completed 100 optimizer steps with the full HF checkpoint at the pinned
        model revision and the 8,192 complete image conversations prepared by
        scripts/data/prepare_nemotron_image_v3_subset.py
        from nvidia/Nemotron-Image-Training-v3 ECD revision
        7656391d4d4cb11ec3722b34f10d499435de0460. Recipe defaults are 64 GB200
        GPUs, TP8/SP, EP64, ETP1/PP1/CP1, sequence 2048, MBS1/GBS8, BF16 with
        FP32 gradient reduction, and constant LR 1e-6. All 100 losses and gradient
        norms were finite, with zero skipped/NaN iterations and a clean exit.
        The runtime-synchronized configuration was saved at setup entry.
        Timing and throughput are early, unoptimized functional observations.
        Historical training from the recorded Bridge base with Transformers
        5.16.1 completed 5,349 steps on this bounded subset: first loss
        0.310870707035, final loss 0.01342209149, first-ten mean 0.311553779,
        and last-ten mean 0.017778902. These are historical loss observations,
        separate from this public-command verification and not generalization
        evidence. Historical model TFLOP/s/GPU was not reliably captured.
        Logged TFLOP/s
        uses an analytical matrix-work estimate including gated-residual and PLE
        projections and the forward-only QSA indexer projection. At sequence
        2048 QSA skips its score matmul. Norms, activations, lookups, PLE
        depthwise convolution, communication, and duplicated parallel work are
        outside this estimate; it is not hardware-counter throughput or MFU.

