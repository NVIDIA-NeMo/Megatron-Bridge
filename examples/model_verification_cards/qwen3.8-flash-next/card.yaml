title: qwen3_8_flash_next_vlm
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  This VLM card covers text_only=False: full language, vision encoder and projector import/export, plus image SFT.
  All 1,627 supported tensors passed exact GPU roundtrip comparison, and 100 image-SFT updates are verified. The
  recipe is EARLY, UNOPTIMIZED. Text-only frozen-PLE pretraining is recorded separately in the qwen3.8-flash-next-text-only
  card.'
verification_index:
  model_level:
    verified:
    - hf_to_megatron_gpu
    - megatron_to_hf_gpu
    unverified:
    - hf_to_megatron_cpu
    - megatron_to_hf_cpu
    - manual_forward_pass
    - inference
  training:
    GB200:
      verified:
      - sft
      unverified:
      - pretrain
      - sft_export_inference
      - sft_long_context
      - peft
      - checkpoint_resume
