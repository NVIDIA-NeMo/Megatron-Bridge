# Agent-readable model verification card.
title: qwen3_8_flash_next
summary: >
  Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing and throughput metrics are functional verification observations, not standalone optimized performance results.
  The public BF16 image SFT recipe completed 100 steps on 64 GB200 GPUs using
  an 8,192-sample Nemotron-Image-Training-v3 ECD subset. A separate historical
  run completed 5,349 steps; its loss curve remains valid. Historical
  language-only import and ten-step pretraining observations are retained
  separately. HF numerical parity,
  checkpoint roundtrips, resume, and optimized performance remain unverified.
verification_index:
  model_level:
    unverified: [hf_to_megatron_cpu, hf_to_megatron_gpu, megatron_to_hf_cpu, megatron_to_hf_gpu, manual_forward_pass, inference]
  training:
    GB200:
      verified: [sft]
      unverified: [pretrain, sft_export_inference, sft_long_context, peft, checkpoint_resume]
model:
  hf_id: Qwen/Qwen3.8-Flash-Next
  hf_revision: de4b8e4d43b917e7706784d8bb445c9af86a3540  # pragma: allowlist secret
  architecture: Qwen4ExpForConditionalGeneration
  min_transformers_version: "5.16.1"
verification_environment:
  base_container: NeMo 26.10 RC4 (non-public release candidate)
  bridge_commit: 228077d7b63b13d8b3b7f276c78f53c8110c57ac  # pragma: allowlist secret

