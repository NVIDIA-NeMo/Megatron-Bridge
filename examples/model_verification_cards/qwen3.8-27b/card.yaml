# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: qwen3_8_27b
summary: >
  Performance scope: pretrain_performance.GB200 uses the tuned canonical
  language-and-projector MockVLM recipe and records 819.190 corrected model
  TFLOP/s/GPU on 16 GB200 GPUs; timing from all functional items remains sanity
  evidence. All workloads in this card target GB200 hardware. Conversion,
  deterministic inference, pretraining, SFT, long-context SFT, PEFT, and
  post-SFT export are verified. Full-language checkpoint resume remains
  unverified because four intermediate losses exceeded the comparison bound.
  No dense-27B Megatron FSDP recipe is available.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    GB200:
      verified: [pretrain, sft, sft_export_inference, sft_long_context, peft]
      unverified: [checkpoint_resume]
  performance:
    GB200: verified
model:
  hf_id: Qwen/Qwen3.8-27B
  hf_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0  # pragma: allowlist secret
  architecture: Qwen3_5ForConditionalGeneration
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08.rc5
  bridge_commit: d790e32a88654968021291d68c510f41d64df461  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1 --gpus-per-node 1 --mem 512G
      --hf-model Qwen/Qwen3.8-27B
      --hf-revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
      --megatron-path work/model-verification/qwen3.8-27b/cpu-megatron
    last_verified: 2026-08-14
    expected_result: >
      The pinned-revision CPU import completed in 3m11s and created a reloadable
      iter_0000000 containing 8 nonempty files totaling 55,586,366,001 bytes.
      The converter selected Qwen35VLBridge, completed all 956 mappings, kept
      model weights on CPU, and reported 27,781,427,952 parameters. One shared
      runtime GB200 was used for Transformer Engine vision-module construction.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4
      --hf-model Qwen/Qwen3.8-27B
      --hf-revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
      --megatron-path work/model-verification/qwen3.8-27b/gpu-megatron
      --tp 4
    last_verified: 2026-08-14
    expected_result: >
      The pinned-revision four-GB200 import completed in 2m01s at TP4/PP1 and
      created an 11-file iter_0000000 totaling 55,592,033,255 bytes, including
      four distributed checkpoint shards. All 956 conversion mappings completed,
      and subsequent export and two independent inference runs reloaded it.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1 --gpus-per-node 1 --mem 512G
      --hf-model Qwen/Qwen3.8-27B
      --hf-revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
      --megatron-path
      work/model-verification/qwen3.8-27b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/qwen3.8-27b/cpu-hf-export
    last_verified: 2026-08-14
    expected_result: >
      CPU export completed in 2m16s, wrote every source tensor, and produced 26
      files totaling 55,583,128,197 bytes. The index preserves the original
      1,199-key set and exact 18-shard placement with 55,562,855,904 BF16 tensor
      bytes. Transformers strictly reloaded the export as
      Qwen3_5ForConditionalGeneration with empty missing, unexpected,
      mismatched, and error sets, then completed processor-native GB200
      inference. Export normalizes vision_config.model_type from qwen3_5 to
      qwen3_5_vision and updates producer-version metadata without changing the
      architecture.

