# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_nano_30b_a3b
summary: >
  The pinned checkpoint has verified one-node GPU import, independent CPU and
  distributed GPU BF16 export, and checkpoint-backed deterministic inference.
  Both exports strictly reload with Transformers and exhaustively match the
  source after the explicitly requested BF16 casts. Performance scope:
  pretrain_performance.GB300 uses the tuned canonical 8-GPU MXFP8 recipe.
  CPU import, manual forward, and functional training workflows remain
  unverified in this card.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - inference
    unverified:
      - hf_to_megatron_cpu
      - manual_forward_pass
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
  performance:
    GB300: verified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  hf_revision: 2d59de1cbd51c0adf384eb906b766d1aee0e0517  # pragma: allowlist secret
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.1"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08
  bridge_commit: d352aceda8ed4136f1db787bcf449c1b210a2438  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: null
    last_verified: null
    expected_result: >
      This workflow remains unverified and requires a public run against the
      pinned Hugging Face revision with all applicable verification gates.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      --hf-revision 2d59de1cbd51c0adf384eb906b766d1aee0e0517
      --megatron-path work/model-verification/nemotron-3-nano-30b-a3b/import-gpu
      --torch-dtype bfloat16 --tp 1 --pp 1 --ep 8 --etp 1
      --distributed-timeout-minutes 120 --trust-remote-code
      --low-memory-save
    last_verified: 2026-08-25
    expected_result: >
      The pinned one-node 8-H100 import exits successfully at
      TP1/PP1/EP8/ETP1, persists iter_0000000, and reloads it for inference.
      A separate public GPU round-trip at the same topology exhaustively
      compares all 6,243 exported BF16 weights against the immutable source:
      6,243 of 6,243 match with no skipped FP8 tensors or mismatches.

  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    bridge_commit: 60442bb9adb5435b47db22c6c20aacdf772fbddc  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1 --hf-model nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      --hf-revision 2d59de1cbd51c0adf384eb906b766d1aee0e0517
      --megatron-path work/model-verification/nemotron-3-nano-30b-a3b/import-gpu/iter_0000000
      --hf-path work/model-verification/nemotron-3-nano-30b-a3b/cpu-hf-export
      --torch-dtype bfloat16 --trust-remote-code
    last_verified: 2026-08-25
    expected_result: >
      The synchronous CPU export writes a complete indexed checkpoint. All
      6,243 source keys and shapes match across 31,577,940,288 values. The 46
      source FP32 tensors cast to BF16 are the 23 per-layer mixer A_log tensors
      and 23 per-layer mixer D tensors; each equals the export exactly after
      that declared cast, and every remaining tensor matches exactly at zero
      tolerance. Native loading succeeds as NemotronHForCausalLM with no
      missing, unexpected, mismatched, or errored weights, and the tokenizer
      reloads from the export.

  megatron_to_hf_gpu:
    status: verified
    precision: bf16
    bridge_commit: 60442bb9adb5435b47db22c6c20aacdf772fbddc  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 8
      --hf-model nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      --hf-revision 2d59de1cbd51c0adf384eb906b766d1aee0e0517
      --megatron-path work/model-verification/nemotron-3-nano-30b-a3b/import-gpu/iter_0000000
      --hf-path work/model-verification/nemotron-3-nano-30b-a3b/gpu-hf-export
      --torch-dtype bfloat16 --tp 1 --pp 1 --ep 8 --etp 1
      --distributed-save --save-every-n-ranks 1 --trust-remote-code
    last_verified: 2026-08-25
    expected_result: >
      The synchronous TP1/PP1/EP8/ETP1 export writes a complete indexed
      checkpoint. All 6,243 source keys and shapes match across 31,577,940,288
      values. The 69 source FP32 tensors cast to BF16 are the same 46 mixer
      A_log and D tensors plus 23 per-layer mixer gate
      e_score_correction_bias tensors. The legacy distributed GPU export model
      wrapper downcast those gate biases to BF16, while the CPU export preserved
      them in FP32; all 69 equal the export exactly after this declared cast,
      and every remaining tensor matches exactly at zero tolerance. Native
      loading succeeds as NemotronHForCausalLM with no missing, unexpected,
      mismatched, or errored weights, and the tokenizer reloads from the export.

