      command: ./scripts/training/train.sh --nodes 8 --gpus-per-node 4 --recipe qwen38_flash_next_text_frozen_ngram_pretrain_32gpu_gb200_bf16_muon_config
        --mode pretrain --max_steps 30 --pretrained_checkpoint work/checkpoints/qwen3.8-flash-next-text 'dataset.data_path=[work/data/wikitext2_qwen38_train_text_document]'
        logger.save_config_filepath=work/model-verification/qwen3.8-flash-next/pretrain/resolved-config.yaml logger.tensorboard_dir=work/model-verification/qwen3.8-flash-next/pretrain/tensorboard
      last_verified: '2026-11-22'
      metrics:
        initial_loss: 1.927701711654663
        final_loss: 1.3666266202926636
        last_10_steps_step_time_ms_avg: 3636.6934776306152
        last_10_steps_model_tflops_per_gpu_avg: 47.45907783508301
        last_10_steps_tokens_per_second_per_gpu_avg: 1126.2978376359156
      expected_result: 'EARLY, UNOPTIMIZED recipe. Completed 30 natural-routing updates from a separately imported
        text-only native checkpoint. Full 48-layer language model, sequence 4096, 32 GB200 GPUs, TP2/SP, EP32/ETP1,
        PP1/CP1, MBS1/GBS32, BF16 with FP32 gradient reduction. Only EP-sharded hashed n-gram tables are frozen;
        PLE projections, normalization and convolution stay trainable. Fresh layer-wise distributed Muon optimizer,
        constant LR 1e-4, five-step warmup, zero weight decay and clip 1. The data is bounded Salesforce/wikitext
        train, wikitext-2-raw-v1 revision b08601e04326c79dfdd32d625aee71d232d685c3: one million tokens from 9,460
        nonblank rows in source order, EOS 248046 appended per document and the final document trimmed to that token
        bound. HybridEP and MoE fusions are enabled; CUDA graphs, recomputation, evaluation and checkpoint saving
        are disabled. Final-ten metrics use updates 21-30. This is short functional qualification, not full convergence
        or a cross-model comparison. TFLOPs estimate matrix work, including forward-only indexer projections. At
        4K, QSA attention uses a dense surrogate and indexer score work is not accurately counted; optimizer work,
        norms, lookups, PLE depthwise convolution and communication are excluded. Throughput counts fixed sequence
        token slots. All 32 ranks completed 30 finite, unskipped updates with zero NaN iterations. Full frozen-table
        hashes were unchanged; tables stayed outside DDP and optimizer groups. Selected language parameters and
        FP32 Muon/Adam samples changed. The run consumed 960 sequences (3,932,160 token slots); preclip gradient
        norms ranged from 1.039667 to 12.357839. Native timings include lightweight verification callbacks; no profiler
        was active.'
