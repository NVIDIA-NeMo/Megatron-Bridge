title: qwen3_8_flash_next_text_only
summary: 'Performance disclaimer: this card does not record a canonical pretrain performance result; reported timing
  and throughput metrics are functional verification observations, not standalone optimized performance results.
  This text-only card covers text_only=True: the standalone language model extracted from the same VLM checkpoint,
  excluding vision encoder and projector weights. The EARLY, UNOPTIMIZED recipe completed 30 fixed-4096-token pretraining
  updates with frozen EP-sharded PLE tables and Muon. GPU import and native reload were exercised by that run; exact
  standalone-text conversion equality remains unverified. Full-VLM conversion and image SFT are recorded separately
  in the qwen3.8-flash-next card.'
