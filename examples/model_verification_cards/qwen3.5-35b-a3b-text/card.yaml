        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Historical observation, completed 2026-10-01: the text decoder and one
        pretrained MTP layer completed exactly 100 optimizer updates on 16 GB200
        GPUs at TP1/PP1/CP8/EP16/ETP1, GBS32/MBS1 and 16 accumulation steps.
        LM, MTP, router losses and gradient norms were finite, with zero skipped
        or NaN updates and evaluations at steps 50 and 100. Online experiment
        logging finished successfully and the post-setup config was retained.
        Initial LM loss was 0.2099137008190155; final LM loss was
        0.14850857853889465; final MTP loss was 0.19482117891311646.
        Updates 91-100 averaged 28591.89546108246 ms and
        336.1899744993698 model TFLOP/s/GPU, corresponding to
        9168.47224615851 token slots/s/GPU, not supervised-token throughput.
        These historical observations are deliberately separate from the null
        clean-recipe metrics above.
        The run used NeMo 26.10.rc3 and MCore
        b5581a9e874fc5be2b91e74cdd3ccdc64a1b5204 from NVIDIA/Megatron-LM PR 7611.
        Its Bridge source was base 00ca266c4abc5f8435821823a1dbe05d0c3d6033
        plus an uncommitted recipe precursor, frozen as source bundle SHA256
        5ea6d3c0c82a47f06f9f031040c2cc78641a4334d961542e25338f9c585ed863.
        No clean source commit or public runtime image identifies that run;
        the null provenance fields must not be replaced with the later PR head.
        The command above describes the published recipe with equivalent
        workload settings, checked by construction and full configuration
        comparison, but it has not been rerun from a clean checkout.
        Inputs were text/MTP weights extracted from the pinned HF model and
        togethercomputer/CoderForge-Preview revision
        060fca96cf723b2ebab3181e9e59fafd273df3cb, configuration trajectories,
        split SWE_Rebench. Seed 1234 produced a 99:1 split of 77169 rows;
        the first 20 percent of training rows (15279) and all 772 validation
        rows were packed with first_fit_shuffle, a 131072-token budget and
        16-token alignment. The 6491 training packs contain 205182453 supervised
        tokens in the entire prepared corpus; the 333 validation packs contain
        10479031. These counts are corpus totals, not tokens consumed by the run.
        The published builder's default five-percent validation split was not
        exercised. MXFP8 parameter gather and gradient-buffer reuse, CuTeDSL
        grouped MLP, single grouped weights, FP32 gradient reduction, learned
        routing and selective gdn_norm_out/moe recomputation were enabled.
        Warmup 200 and the 300000-step cosine-decay horizon were retained, so
        this run remained in warmup and does not establish full convergence.
        Checkpoint writes were disabled; resume and post-SFT export are untested.

