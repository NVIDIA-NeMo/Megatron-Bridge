        LM loss is 4.028752/4.028773, an absolute difference of 0.000021. Step-100
        resumed/reference LM loss is 3.261145/3.280722, an absolute difference of
        0.019577. Both sentinels pass the declared 1% relative and 1e-6 absolute gate.

