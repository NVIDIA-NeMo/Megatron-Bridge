      metrics:
        initial_loss: 7.250204
        final_loss: 3.280722
        last_10_steps_step_time_ms_avg: 7856.370
        last_10_steps_model_tflops_per_gpu_avg: 189.690
        last_10_steps_tokens_per_second_per_gpu_avg: 2085.441495
      expected_result: >
        On 64 GB200 (16 nodes x 4 GPUs), TP1/PP4/VPP4/EP16/CP1 uses dense DP16,
        expert DP1, and GBS/MBS 256/1. The command loads the imported model weights
        while starting optimizer and RNG state fresh. It uses HybridEP natural routing,
        grouped GEMM, TE fused cross entropy, selective recompute over mhc and
        mla_up_proj, and MXFP8 parameter gather and gradient-buffer reuse without
        activation offload. Expert capacity, paged stash, CUDA graphs, and forced
        load balancing remain disabled. The run completed 100 finite LM/MTP-loss
        steps with no skipped or NaN iterations and wrote complete grouped-MXFP8
        checkpoints containing model, optimizer, scheduler, data-order, and RNG
        state at steps 50 and 100. The item-specific Bridge revision pins the
        compatible Megatron-LM dev revision used by this workload without changing
        the card's default environment for other verification items.

  sft:
