        last_10_steps_model_tflops_per_gpu_avg: 52.00
        last_10_steps_tokens_per_second_per_gpu_avg: 589.833720
        peak_allocated_memory_gib: 53.712
        peak_reserved_memory_gib: 53.953
      expected_result: >
        On 32 GB200 (8 nodes x 4 GPUs), TP1/PP4/EP8/CP1 with dense DP8 and expert
        DP1, GBS/MBS 128/1. The recipe applies rank-32, alpha-32 LoRA with zero
        dropout to linear_q_down_proj, linear_q_up_proj, linear_kv_proj,
        linear_proj, linear_fc1, and linear_fc2. Routed experts use separate
        per-expert adapters; shared experts are also adapted. The run preserves
        the packed OpenMath thinking data, objective, natural routing, seed, and
        warmup/decay horizon used by the verified SFT item while freezing the base
        model and using PEFT's own 1e-4 peak learning rate.
        It disables activation recompute and offload because the reduced PEFT
        training-state footprint fits with 53.712 GiB peak allocated memory.
        Transformer Engine CUDA graphs cover moe_router and moe_preprocess, while
        HybridEP uses 32 flex-dispatcher SMs, 8 ranks per NVLink domain, 128-token
        combine chunks, a 72-GPU domain, and MNNVL. All 100 steps completed with
        finite LM/MTP losses and zero skipped or NaN iterations. LM/MTP losses
        were 0.9435847/0.2250465 at step 1 and 0.2914867/0.02638751 at step 100.
        The adapter-only checkpoint
        reloaded after the same base checkpoint in a fresh process and completed
        finite step 101 with LM loss 0.2827368 and MTP loss 0.02594211.

