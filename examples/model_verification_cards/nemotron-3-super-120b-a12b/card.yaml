        'dataset.blend=[["work/data/rp2/head_01_text_document"],null]'
        dataset.path_to_cache=work/cache/nemotron-3-super-120b-a12b/rp2
        tokenizer.tokenizer_type=SentencePieceTokenizer
        tokenizer.tokenizer_model=work/data/rp2-tokenizer/tokenizer.model
        rng.seed=1234 dataset.random_seed=1234
        validation.eval_iters=0 validation.eval_interval=0
        checkpoint.ckpt_format=torch_dist checkpoint.async_save=false
        checkpoint.load=null
        --save_dir work/model-verification/nemotron-3-super-120b-a12b/h100-pretrain-reference
        --save_interval 50 logger.log_interval=1 logger.log_throughput=true
        logger.log_device_memory_used=true
        logger.tensorboard_dir=null
        logger.save_config_filepath=work/model-verification/nemotron-3-super-120b-a12b/h100-pretrain-config/ConfigContainer.yaml
      last_verified: 2026-08-03
      metrics:
        initial_loss: 12.19922
        final_loss: 5.706429
        last_10_steps_step_time_ms_avg: 29368.690
        last_10_steps_model_tflops_per_gpu_avg: 236.330
        last_10_steps_tokens_per_second_per_gpu_avg: 2789.365
      expected_result: >
        On exactly 64 H100s, the BF16 support run completes 100 bounded RP2
        optimizer steps at TP1/PP2/CP1/EP32/ETP1, GBS/MBS 1280/1, natural
        routing, HybridEP flex dispatch with 1.10x fixed expert capacity, eager
        execution, selective recompute of layernorm, moe_act, moe, and
        core_attn, no optimizer-state CPU offload, and ordered gradient
        reduction. Loss remains finite from 12.19922 to 5.706429 with zero
        skipped or NaN iterations. The final ten steps average 29368.690 ms and
        236.330 TFLOP/s/GPU. Peak device memory is 58.079 GiB allocated and
        70.336 GiB reserved. The resolved configuration persists, and complete
        iter_0000050 and iter_0000100 checkpoints each contain 64 distributed
        rank shards plus checkpoint metadata and training state.

