      Values of 1,781 tensors match exactly, including A_log. The 30 norm
      tensors exactly match BF16(FP32_source - 1) + BF16(1), the implemented
      zero-centered norm roundtrip. Their maximum absolute source difference
      is 0.00390625, within an absolute tolerance of 1/256; no other tensor
      values differ. This verifies the BF16 conversion, not lossless retention
      of the source's mixed dtypes.
