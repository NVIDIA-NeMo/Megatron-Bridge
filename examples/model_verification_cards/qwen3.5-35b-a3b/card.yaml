title: qwen3_5_35b_a3b
summary: >
  Qwen3.5-35B-A3B HybridModel published-weight multimodal forward correlation
  and deterministic inference are verified, together with 100-step MedPix
  full-model SFT, LoRA training, SFT export and HF inference on GB300.
  CPU/GPU conversion and long-context SFT with packing and CP2 are verified.
  Real-data continuation and checkpoint resume are verified through 100 steps;
  both declared resume loss sentinels passed in native training mode.
  The canonical pretrain_performance.GB300 result also awaits revalidation.
  Synthetic inputs, random weights, and forced router
  balancing measure benchmark throughput only; they do not establish pretrained
  model quality, training convergence, or checkpoint compatibility.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    GB300:
      verified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
  performance:
    GB300: unverified
model:
  hf_id: Qwen/Qwen3.5-35B-A3B
  hf_revision: 59d61f3ce65a6d9863b86d2e96597125219dc754  # pragma: allowlist secret
  architecture: Qwen3_5MoeForConditionalGeneration
  min_transformers_version: "5.2.0"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.10
  bridge_commit: 3152313c10d1043350edb588c5c87aee9b8389de  # pragma: allowlist secret
items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu
      --nodes 1 --gpus-per-node 4 --mem 512G
      --hf-model Qwen/Qwen3.5-35B-A3B
      --hf-revision 59d61f3ce65a6d9863b86d2e96597125219dc754
      --megatron-path work/model-verification/qwen3.5-35b-a3b/cpu-megatron
    last_verified: 2026-11-03
    expected_result: >
      Imported the complete pinned checkpoint with model weights on CPU in
      one process and saved iter_0000000. Transformer Engine vision-module
      construction required one runtime GPU; four GB300 GPUs were allocated
      to satisfy the minimum allocation. The subsequent CPU export reloaded
      the checkpoint successfully. The complete BF16 roundtrip preserves all
      1,811 keys and shapes, with precision changes documented in
      megatron_to_hf_cpu; it is not a lossless mixed-dtype roundtrip.
  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4 --ep 4
      --hf-model Qwen/Qwen3.5-35B-A3B
      --hf-revision 59d61f3ce65a6d9863b86d2e96597125219dc754
      --megatron-path work/model-verification/qwen3.5-35b-a3b/gpu-megatron
    last_verified: 2026-11-03
    expected_result: >
      Imported the complete pinned checkpoint on four GB300 GPUs at
      TP1/PP1/EP4/ETP1 and saved iter_0000000 with four distributed shards.
      Subsequent GPU export, forward comparison, inference, SFT, and PEFT
      successfully reloaded the checkpoint. The BF16 roundtrip preserves all
      1,811 tensor keys and shapes, with the precision changes documented in
      megatron_to_hf_gpu; it is not a lossless mixed-dtype roundtrip.
  megatron_to_hf_cpu:
    status: verified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu
      --nodes 1 --gpus-per-node 4 --mem 512G
      --hf-model Qwen/Qwen3.5-35B-A3B
      --hf-revision 59d61f3ce65a6d9863b86d2e96597125219dc754
      --megatron-path work/model-verification/qwen3.5-35b-a3b/cpu-megatron/iter_0000000
      --hf-path work/model-verification/qwen3.5-35b-a3b/cpu-hf-export
    last_verified: 2026-11-03
    expected_result: >
      Export completed with weights on CPU in one process and one runtime
      GPU from a four-GB300 allocation. Transformers independently reloaded
      the complete export with no missing, unexpected, mismatched, or error
      entries. All 1,811 keys and shapes match the pinned source. The source's
      30 GDN A_log tensors and 30 GDN output norm tensors change from FP32 to
      BF16; all other dtypes are preserved. Values of 1,781 tensors match
      exactly, including A_log. The 30 norm tensors exactly match
      BF16(FP32_source - 1) + BF16(1). Their maximum absolute source difference
      is 0.00390625, within an absolute tolerance of 1/256; no other tensor
      values differ. This verifies BF16 conversion, not lossless retention
      of the source's mixed dtypes.
