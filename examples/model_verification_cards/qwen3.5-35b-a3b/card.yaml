        steps_5_8_model_tflops_per_gpu_avg: 253.271
        skipped_iterations: 0
        nan_iterations: 0
      latest_attempt:
        date: 2026-07-27
        job_id: 5716977
        bridge_commit: ff24fbbbd3bbb93dea7b45a648977131c44c599e  # pragma: allowlist secret
        steps_completed: 50
        terminal_state: completed
        exit_code: "0:0"
        skipped_iterations: 0
        nan_iterations: 0
        acceptance_gate_met: false
      metrics:
        initial_loss: 12.82963
        final_loss: 0.008182429
        last_10_steps_step_time_ms_avg: 31751.010
        last_10_steps_model_tflops_per_gpu_avg: 185.560
      expected_result: >
        On two nodes with 16x H100, the exact mock-data performance recipe must
        complete exactly 50 steps with finite losses, no skipped or NaN
        iterations, and all four metrics recorded. Over steps 41-50, the run
        must average at least 287.305 model TFLOP/s/GPU. On 2026-07-27, clean
        PR-head job 5716977 completed all 50 steps with finite losses and
        gradients, zero skipped iterations, and zero NaN iterations. Steps
        41-50 averaged 31.751010 seconds and 185.560 model TFLOP/s/GPU, which
        is 35.41% below the gate. The completion and stability requirements
        passed, but the throughput requirement did not, so this item remains
        unverified. The current PR includes the formerly external H100 runtime:
        FlashQLA 0.1.2, HybridEP fused permutation, device-resident static
        dispatcher metadata, a fail-closed route-capacity assertion, Hopper
        grouped expert matrix multiplication, one-connection launch ordering,
        and normal-priority shared-expert overlap. Exact-two-node PR runtime
        probe 5717967 completed all eight training steps and exited 0:0 with
        finite losses and gradients and zero skipped or NaN iterations. Steps
        5-8 averaged 23.254625 seconds, or about 253.271 model TFLOP/s/GPU, a
        6.22%
        throughput improvement over the 238.43 model TFLOP/s/GPU pinned-stack
        control. It remains 11.85% below the gate and would need another 13.44%
        throughput increase, to at most 20.4999 seconds per step. The best
        development-stack short run remains 22.340925 seconds / about 263.67
        model TFLOP/s/GPU, 8.22% below the gate. A current-pinned
        full-field 128-token HybridEP template regressed by about 5.6% versus
        the accepted 64/64/64 template and was reverted. A capacity-factor
        1.02 screen required a fresh static-shape compilation; rank-divergent
        compilation against the shared cache ended in an NCCL watchdog before
        iteration 1, so it produced no capacity or performance evidence.
        FlashQLA cold compilation also consumed the first bounded allocation
        without an iteration; verification must use the shared persistent
        caches declared above. The exact 50-step gate has not been rerun on
        the current PR runtime, and no result at or above 287.305 exists.
