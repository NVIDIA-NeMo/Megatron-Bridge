      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        On two nodes with 16x H100, the exact mock-data performance recipe must
        complete exactly 50 steps with finite losses, no skipped or NaN
        iterations, and all four metrics recorded. Over steps 41-50, the run
        must average at least 287.305 model TFLOP/s/GPU. On 2026-07-27, an
        experimental development stack using FlashQLA, HybridEP, fused
        permutation, device-resident static dispatcher metadata, Hopper
        grouped expert matrix multiplication, one-connection launch ordering,
        and normal-priority shared-expert overlap averaged 22.340925 seconds
        per step over steps 5-8, or about 263.67 model TFLOP/s/GPU. Losses and
        gradients were finite with zero skipped or NaN iterations. This is
        8.22% below the gate, and no qualifying 50-step run has completed.
        The accepted short-run fused HybridEP template used effective
        preprocessing, dispatch, and combine chunks of 64 tokens. A matched
        full-field 128-token template averaged 23.5981 seconds per step over
        its two steady samples, or about 249.62 model TFLOP/s/GPU, and was
        rejected. Optimizer-step parameter-gather overlap was also rejected
        before iteration 1: both matching fields resolved to true, but one
        PP1 model chunk left an empty remaining-chunk optimizer group during
        DistributedOptimizer construction, so it produced no performance
        sample. A later exact-16-H100 PP2/EP8 topology experiment placed one
        pipeline stage and one EP8 group on each node. Its balanced
        Et*20|t*20mL layout averaged 27.436850 seconds / 214.697813 model
        TFLOP/s/GPU; an Et*21|t*19mL split improved to 26.593400 seconds /
        221.507280 model TFLOP/s/GPU but remained 19.03% slower than the
        TP1/PP1/EP16 short-run control. Node-local EP did not offset the
        pipeline and 128-microstep schedule cost. A torch 2.13 / CUDA 13.3 /
        TE 2.17 migration then passed a fresh-cache FlashQLA forward/backward
        smoke and completed a matched HybridEP control at 24.236950 seconds /
        243.043440 model TFLOP/s/GPU, 8.49% slower than the accepted torch 2.12
        short-run control. Its NCCL-EP candidate completed bootstrap and
        entered iteration 0, but all 16 ranks timed out in the first real
        dispatch with NCCL error 2 at nccl_ep.cc:886, so it produced no
        performance sample. A later exact-two-node fused gated-RMSNorm A/B
        measured 22.549100 seconds / 261.235779 model TFLOP/s/GPU for its
        control and 22.207450 seconds / 265.254754 model TFLOP/s/GPU for its
        candidate, a 1.54% same-allocation throughput signal. The required
        direct fused-kernel marker was absent, so this candidate was not
        promoted over the accepted 263.67 model TFLOP/s/GPU short-run result.
        An official DeepEP V2 extension subsequently built successfully, but
        its required 16-rank BF16 dispatch/combine gate stopped before training
        because the allocated nodes exposed CUDA driver API 12.2, which was
        incompatible with the candidate PyTorch/CUDA runtime. That run is an
        environment limitation, not dispatcher performance data. Further
        optimization is deferred at this delivery point. If resumed, first
        preflight node-driver compatibility, then rerun the real 16-rank
        DeepEP V2 gate and same-allocation dispatcher A/B, directly verify the
        fused gated-RMSNorm kernel path, and only promote a candidate after the
        exact 50-step acceptance protocol passes. These experimental runtime
        changes are not public recipe defaults, so the item remains unverified.
