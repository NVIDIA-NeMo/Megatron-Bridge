title: qwen3_5_35b_a3b
summary: >
  Qwen3.5-35B-A3B HybridModel migration is under validation. Canonical GB300
  performance recipes exist for BF16 and MXFP8, but no HybridModel performance
  result is verified yet; pretrain_performance.GB300 remains unverified.
  Synthetic inputs, random weights, and forced router
  balancing measure benchmark throughput only; they do not establish pretrained
  model quality, training convergence, or checkpoint compatibility.
