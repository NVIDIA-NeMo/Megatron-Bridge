# Agent-readable model verification card for Nemotron 3.5 Lightning.
# status: unverified | verified | unsupported | not_applicable

title: nemotron_3_5_lightning
summary: >
  Performance scope: pretrain_performance.H100 and pretrain_performance.GB200
  use tuned canonical performance recipes; timing and throughput metrics from
  functional training items remain sanity checks rather than optimized
  performance results. The convergence pretraining recipes retain real
  tokenization, real data, natural routing, safety checks, and checkpointing
  while adopting the corresponding hardware performance recipe's execution
  stack. The H100 performance leaf uses BF16 Adam moments in a benchmark-only
  workload and is not convergence-comparable with FP32 optimizer-state runs.
  Nemotron 3.5 Lightning support verification covers conversion and
  inference. Training, FSDP, and performance verification on H100 and GB200
  is pending on the card default revision; the revisions originally recorded
  for those items did not contain the Lightning recipe names their commands
  use, so their dates and metrics are not attributed to these commands.
  Recipe names, work paths, and this verification-card path use the public
  Lightning name. The evidence used the 26.08
  release-candidate software stack; the environment records its corresponding
  public 26.08 base container.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
  performance:
    H100: unverified
    GB200: unverified
  fsdp:
    GB200: unverified
model:
  hf_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  hf_revision: b3caaabed0263651a17dc1f2d4ce97e794f76c44  # pragma: allowlist secret
  architecture: NemotronHForCausalLM
  min_transformers_version: "5.8.1"
verification_environment:
  base_container: nvcr.io/nvidia/nemo:26.08
  bridge_commit: bcd2d134c59d096f9f9231fd03d7d5ddede3665e  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    precision: bf16
    bridge_commit: 7edd7c7f68bcdd2b30cbaff426ece2ee0da9deb5  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1
      --hf-model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
      --hf-revision b3caaabed0263651a17dc1f2d4ce97e794f76c44
      --megatron-path work/model-verification/nemotron-3.5-lightning/cpu-megatron
      --torch-dtype bfloat16
    last_verified: 2026-07-23
    expected_result: >
      The pinned checkpoint imports on CPU, creates a reloadable iter_0000000,
      and preserves every MTP tensor for the paired CPU export. After export,
      all 6,513 tensors and 32,913,266,240 parameters match the pinned source
      exactly in name, shape, dtype, and value.

  hf_to_megatron_gpu:
    status: verified
    precision: bf16
    bridge_commit: 619a2df1da9517b4408ea475b428bf2aba618c8f  # pragma: allowlist secret
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
