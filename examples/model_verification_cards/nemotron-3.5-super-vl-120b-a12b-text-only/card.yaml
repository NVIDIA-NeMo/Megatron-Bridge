# Agent-readable companion card for the language-only workflow.
# Results are populated independently of the full-VL card.
title: nemotron_3_5_super_vl_120b_a12b_text_only
summary: >
  Performance disclaimer: this card does not record a canonical pretrain
  performance result; reported timing and throughput metrics are functional
  verification observations, not standalone optimized performance results.
  This companion card covers importing only language and MTP weights from
  the VL checkpoint, reusing Nemotron 3 Super text recipes, and exporting a
  standalone NemotronHForCausalLM checkpoint. It excludes all media encoders,
  projectors, and video embedding weights. The full-VL card is separate.
  Model-level conversion and inference, and H100 PEFT, are verified at the
  public revision below. At that revision the published GB200 SFT and PEFT
  commands stop while HybridEP initializes, so they and GB200 post-SFT export
  remain unverified. H100 SFT and its export remain unverified because earlier
  runs used a pre-release checkpoint that is not bound to that revision.
verification_index:
  model_level:
    verified: [hf_to_megatron_gpu, megatron_to_hf_gpu, inference]
    unverified: [hf_to_megatron_cpu, megatron_to_hf_cpu, manual_forward_pass]
  training:
    H100:
      verified: [peft]
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, checkpoint_resume]
    GB200:
      unverified: [pretrain, sft, sft_export_inference, sft_long_context, peft, checkpoint_resume]
