# Agent-readable companion card for the language-only workflow.
# Results are populated independently of the full-VL card.
title: nemotron_3_5_super_vl_120b_a12b_text_only
summary: >
  Performance disclaimer: this card does not record a canonical pretrain
  performance result; reported timing and throughput metrics are functional
  verification observations, not standalone optimized performance results.
  This companion card covers importing only language and MTP weights from
  the VL checkpoint, reusing Nemotron 3 Super text recipes, and exporting a
  standalone NemotronHForCausalLM checkpoint. It excludes all media encoders,
  projectors, and video embedding weights. The full-VL card is separate.
  SFT and PEFT use the prepared full Tulu 3 training split: 892,375 examples
  after the native 95/5 split, data and packing seed 5678, model seed 1234,
  2048-token offline packs aligned to eight tokens, and assistant-only loss.
  H100 and GB200 use byte-identical packed training and validation files;
  their training metrics count padded token slots, not supervised tokens.
  The public revision is intentionally blank; results must not be interpreted
  as bound to an immutable public release revision. Refreshed SFT and PEFT,
  dependent export, merge, and reload checks are recorded for H100 and GB200.
verification_index:
  model_level:
    verified: [hf_to_megatron_gpu, megatron_to_hf_gpu, manual_forward_pass, inference]
    unverified: [hf_to_megatron_cpu, megatron_to_hf_cpu]
  training:
    H100:
      verified: [sft, sft_export_inference, peft]
      unverified: [pretrain, sft_long_context, checkpoint_resume]
    GB200:
      verified: [sft, sft_export_inference, peft]
      unverified: [pretrain, sft_long_context, checkpoint_resume]
