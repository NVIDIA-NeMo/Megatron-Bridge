# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: gemma_3_4b_it
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. Gemma 3 4B Instruct exact-checkpoint CPU and TP2/PP2 GPU import,
  CPU and TP2/PP2 GPU export, manual multimodal forward parity, and
  deterministic TP2/PP2 inference are verified. SFT, post-SFT
  export/inference, and PEFT remain pending. Pretraining and checkpoint resume are unsupported
  because there is no public exact-model pretraining recipe. Long-context SFT
  is unsupported because the required dense local/global attention biases
  currently exclude context parallelism and in-batch THD packing. Existing
  toy-model tests are not used as exact-model evidence.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      unverified: [sft, sft_export_inference, peft]
      unsupported: [pretrain, checkpoint_resume, sft_long_context]
model:
  hf_id: google/gemma-3-4b-it
  hf_revision: 093f9f388b31de276ce2de164bdc2081324b9767  # pragma: allowlist secret
  architecture: Gemma3ForConditionalGeneration
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/pytorch:26.04-py3
  bridge_commit: 330f87c0a391eb2770cbf2306352cc807211d7ba  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: verified
    bridge_commit: 2d0175b116af6cb785bb8efab7ee053435496266  # pragma: allowlist secret
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1
      --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron-path work/model-verification/gemma-3-4b-it/cpu-megatron
      --torch-dtype bfloat16
    last_verified: 2026-07-24
    expected_result: >
      Exact-revision BF16 CPU import loaded all 781 Bridge tensors and saved
      one reloadable DCP shard. An independent Gloo reload mapped all 883
      source tensors with exact keys, shapes, dtypes, and torch.equal values,
      including all 437 legacy vision-tower keys.

  hf_to_megatron_gpu:
    status: verified
    bridge_commit: 2d185b9619c302281eb1a3219b3c7afaee940afc  # pragma: allowlist secret
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4 --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron-path work/model-verification/gemma-3-4b-it/imported-megatron
      --torch-dtype bfloat16 --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: 2026-07-30
    expected_result: >
      Exact-revision distributed BF16 import completed with TP2/PP2/EP1/ETP1.
      All 781 Bridge tensors loaded and all four ranks saved a reloadable
      checkpoint with the vision tower and multimodal projector on the owning
      pipeline stage. Independent TP2/PP2 and Gloo reloads retained
      FusedAttention and matched all 883 mapped tensors exactly.

  megatron_to_hf_cpu:
    status: verified
    bridge_commit: 60442bb9adb5435b47db22c6c20aacdf772fbddc  # pragma: allowlist secret
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 1
      --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron-path work/model-verification/gemma-3-4b-it/cpu-megatron/iter_0000000
      --hf-path work/model-verification/gemma-3-4b-it/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: 2026-08-26
    expected_result: >
      The exact-revision CPU export exits successfully and writes all 883
      tensors, 4,300,079,472 values, and 8,600,158,944 tensor-payload bytes.
      Keys, shapes, dtypes, and values are bitwise identical to the pinned BF16
      source with no dtype conversions, including all 437 legacy
      vision_tower.vision_model.* tensors. Transformers strictly reloads the
      output natively as Gemma3ForConditionalGeneration with all 884 state
      entries and no loading discrepancies.

  megatron_to_hf_gpu:
    status: verified
    bridge_commit: 2d185b9619c302281eb1a3219b3c7afaee940afc  # pragma: allowlist secret
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4 --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron-path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --hf-path work/model-verification/gemma-3-4b-it/hf-export
      --torch-dtype bfloat16 --export-weight-dtype bfloat16
      --distributed-save --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: 2026-07-30
    expected_result: >
      TP2/PP2 distributed export completed without a missing PP owner. Source
      and export contained the same 883 keys with exact shapes, dtypes, and
      torch.equal values, including all 437 legacy
      vision_tower.vision_model.* tensors. Transformers exposes 884 logical
      state entries after reload because tied lm_head.weight aliases the single
      stored language_model.model.embed_tokens.weight tensor; no extra tensor
      is serialized. Native Gemma3ForConditionalGeneration strict reload
      reported no missing, unexpected, mismatched, or errored tensors.

  manual_forward_pass:
    status: verified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=1
      examples/conversion/compare_hf_and_megatron/compare.py
      --hf_model_path google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron_model_path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --model_class Gemma3ForConditionalGeneration
      --image_path work/model-verification/gemma-3-4b-it/candy.JPG
      --prompt "What animal is on the candy?"
      --tp 1 --pp 1 --ep 1 --etp 1
    last_verified: 2026-07-30
    expected_result: >
      The exact-revision TP1 image-and-text comparison selected Transformer
      Engine FusedAttention. Token match: true; Hugging Face and Megatron both
      produced next token ID 22515 ("Based"). Cosine similarity: 0.990387,
      passing the required 0.99 threshold; maximum and mean absolute logit
      differences were 6.234131 and 1.007509 and are report-only diagnostics.

  inference:
    status: verified
    bridge_commit: 2d185b9619c302281eb1a3219b3c7afaee940afc  # pragma: allowlist secret
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=4
      examples/conversion/hf_to_megatron_generate_vlm.py
      --hf_model_path google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767
      --megatron_model_path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --image_path work/model-verification/gemma-3-4b-it/candy.JPG
      --prompt "What animal is on the candy?"
      --max_new_tokens 32
      --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: 2026-07-30
    expected_result: |-
      One exact-revision TP2/PP2 BF16 greedy multimodal run selected
      FusedAttention and generated exactly 32 tokens without reaching EOS. The
      public input was p-blog/candy.JPG at documentation-images revision
      44c3249461c5a5336585d1e31e0a4ce7fce06a5a with SHA-256
      fc417c899e94f8df465b7541c5a70f0eebb85c414d06345f0b290c061eccc84c.
      The JSON-escaped literal completion was: "Based on the image, the animal
      on the candy is a **turtle**. \n\nYou can see a clear depiction of a
      turtle shell on each of the candies"

  pretrain:
    all:
      status: unsupported
      precision: null
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Megatron Bridge does not provide a public Gemma 3 VL 4B pretraining
        recipe. The available exact-model recipes cover SFT and PEFT, so a
        supported pretraining command and checkpoint contract cannot be stated.

  sft:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 1
        --recipe gemma3_vl_4b_sft_config --mode sft --dataset cord-v2
        --pretrained_checkpoint work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
        --max_steps 10 --seq_length 4096
        'dataset.source.load_kwargs={revision:"7f0115a4b758a71d6473b8d085751692da2fef98"}'
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        --save_dir work/model-verification/gemma-3-4b-it/sft-checkpoints
        --save_interval 10 logger.log_interval=1 logger.log_throughput=true
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Pending exact-revision CORD-v2 full-SFT verification with the public
        Gemma 3 VL 4B H100 recipe. The run must complete at least ten optimizer
        steps with finite loss, no skipped or NaN iterations, all five metrics,
        and a reloadable final full-model checkpoint.

  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      commands: null
      last_verified: null
      expected_result: >
        Pending the full-SFT checkpoint. Export must reload natively with exact
        keys, shapes, and dtypes, then one deterministic greedy multimodal
        Hugging Face generation must record its exact generated-token count and
        literal completion.

  sft_long_context:
    H100:
      status: unsupported
      precision: null
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Gemma 3 VL image-bidirectional attention uses dense local/global
        additive biases with FusedAttention. The provider rejects context
        parallelism greater than one, and the public recipes disable in-batch
        THD packing, so there is no supported exact-model long-context SFT
        contract.

  peft:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 1
        --recipe gemma3_vl_4b_peft_config --mode lora --dataset cord-v2
        --pretrained_checkpoint work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
        --max_steps 10 --seq_length 4096
        'dataset.source.load_kwargs={revision:"7f0115a4b758a71d6473b8d085751692da2fef98"}'
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        --save_dir work/model-verification/gemma-3-4b-it/peft-checkpoints
        --save_interval 10 logger.log_interval=1 logger.log_throughput=true
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      expected_result: >
        Pending exact-revision CORD-v2 LoRA verification with the public Gemma 3
        VL 4B H100 recipe. The run must complete at least ten optimizer steps
        with finite loss, no skipped or NaN iterations, all five metrics, and a
        reloadable adapter checkpoint.

  checkpoint_resume:
    all:
      status: unsupported
      precision: null
      depends_on: pretrain
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
        last_10_steps_tokens_per_second_per_gpu_avg: null
      resume_comparison: null
      expected_result: >
        Checkpoint-resume verification depends on a supported pretraining
        baseline. Because Megatron Bridge has no public Gemma 3 VL 4B
        pretraining recipe, there is no supported reference run or resume
        checkpoint contract for this model.
