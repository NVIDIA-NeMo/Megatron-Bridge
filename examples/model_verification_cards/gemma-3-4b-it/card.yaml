# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: gemma_3_4b_it
summary: >
  Performance disclaimer: this model has not been performance-tuned; reported
  timing and throughput metrics are sanity checks, not optimized performance
  results. Gemma 3 4B Instruct exact-checkpoint verification is pending for
  conversion, manual forward comparison, inference, SFT, post-SFT
  export/inference, long-context SFT, and PEFT; pretraining and checkpoint
  resume are unsupported because there is no public exact-model pretraining
  recipe. Existing toy-model tests are not used as exact-model evidence.
verification_index:
  model_level:
    unverified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      unverified: [sft, sft_export_inference, sft_long_context, peft]
      unsupported: [pretrain, checkpoint_resume]
model:
  hf_id: google/gemma-3-4b-it
  hf_revision: 093f9f388b31de276ce2de164bdc2081324b9767f  # pragma: allowlist secret
  architecture: Gemma3ForConditionalGeneration
  min_transformers_version: "5.8.0"
verification_environment:
  base_container: nvcr.io/nvidia/pytorch:26.04-py3
  bridge_commit: 0eb2580d7e2e701332227cd352214619514db78f  # pragma: allowlist secret

items:
  hf_to_megatron_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device cpu --nodes 1
      --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron-path work/model-verification/gemma-3-4b-it/cpu-megatron
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      Pending exact-revision verification. The CPU import must create a
      reloadable iter_0000000 checkpoint without missing, unexpected, or
      namespace-mismatched vision-tower weights.

  hf_to_megatron_gpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh import --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4 --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron-path work/model-verification/gemma-3-4b-it/imported-megatron
      --torch-dtype bfloat16 --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: null
    expected_result: >
      Pending exact-revision verification. The distributed BF16 import must
      complete with TP2/PP2 and produce a reloadable checkpoint with the vision
      tower and multimodal projector on the owning pipeline stage.

  megatron_to_hf_cpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device cpu --nodes 1
      --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron-path work/model-verification/gemma-3-4b-it/cpu-megatron/iter_0000000
      --hf-path work/model-verification/gemma-3-4b-it/cpu-hf-export
      --torch-dtype bfloat16
    last_verified: null
    expected_result: >
      Pending exact-revision verification. CPU export must preserve every
      source key, shape, dtype, and value and reload natively as
      Gemma3ForConditionalGeneration.

  megatron_to_hf_gpu:
    status: unverified
    precision: bf16
    command: >
      ./scripts/conversion/convert.sh export --executor slurm --device gpu
      --nodes 1 --gpus-per-node 4 --hf-model google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron-path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --hf-path work/model-verification/gemma-3-4b-it/hf-export
      --torch-dtype bfloat16 --export-weight-dtype bfloat16
      --distributed-save --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: null
    expected_result: >
      Pending exact-revision verification. TP2/PP2 distributed export must
      finish without a missing PP owner for vision_tower parameters, preserve
      the source namespace, and reload natively with no missing or unexpected
      keys.

  manual_forward_pass:
    status: unverified
    precision: bf16
    command: >
      uv run python examples/conversion/compare_hf_and_megatron/compare.py
      --hf_model_path google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron_model_path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --model_class Gemma3ForConditionalGeneration
      --image_path work/model-verification/gemma-3-4b-it/candy.JPG
      --prompt "What animal is on the candy?"
      --tp 1 --pp 1 --ep 1 --etp 1
    last_verified: null
    expected_result: >
      Pending exact-revision image-and-text comparison. Hugging Face and
      Megatron must predict the same next token with cosine similarity at least
      0.99. The prompt must not require TP padding; maximum and mean absolute
      logit differences are recorded for diagnosis only and are not pass/fail
      gates.

  inference:
    status: unverified
    precision: bf16
    command: >
      uv run python -m torch.distributed.run --standalone --nproc_per_node=4
      examples/conversion/hf_to_megatron_generate_vlm.py
      --hf_model_path google/gemma-3-4b-it
      --hf-revision 093f9f388b31de276ce2de164bdc2081324b9767f
      --megatron_model_path work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
      --image_path work/model-verification/gemma-3-4b-it/candy.JPG
      --prompt "What animal is on the candy?"
      --max_new_tokens 32
      --tp 2 --pp 2 --ep 1 --etp 1
    last_verified: null
    expected_result: >
      Pending one exact-revision deterministic BF16 greedy multimodal run. The
      evidence must record the exact positive generated-token count, literal
      completion text, and public input revision and content hash.

  pretrain:
    all:
      status: unsupported
      precision: null
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Megatron Bridge does not provide a public Gemma 3 VL 4B pretraining
        recipe. The available exact-model recipes cover SFT and PEFT, so a
        supported pretraining command and checkpoint contract cannot be stated.

  sft:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 1
        --recipe gemma3_vl_4b_sft_config --mode sft --dataset cord-v2
        --pretrained_checkpoint work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
        --max_steps 10 --seq_length 4096
        'dataset.source.load_kwargs={revision:"7f0115a4b758a71d6473b8d085751692da2fef98"}'
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        --save_dir work/model-verification/gemma-3-4b-it/sft-checkpoints
        --save_interval 10 logger.log_interval=1 logger.log_throughput=true
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Pending exact-revision CORD-v2 full-SFT verification with the public
        Gemma 3 VL 4B H100 recipe. The run must complete at least ten optimizer
        steps with finite loss, no skipped or NaN iterations, all four metrics,
        and a reloadable final full-model checkpoint.

  sft_export_inference:
    H100:
      status: unverified
      precision: bf16
      depends_on: sft
      commands: null
      last_verified: null
      expected_result: >
        Pending the full-SFT checkpoint. Export must reload natively with exact
        keys, shapes, and dtypes, then one deterministic greedy multimodal
        Hugging Face generation must record its exact generated-token count and
        literal completion.

  sft_long_context:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Pending an exact-revision long-context SFT run that enables both sequence
        packing and context parallelism greater than one. No short-sequence or
        toy-model result is accepted as long-context evidence.

  peft:
    H100:
      status: unverified
      precision: bf16
      enabled_features: {}
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 1
        --recipe gemma3_vl_4b_peft_config --mode lora --dataset cord-v2
        --pretrained_checkpoint work/model-verification/gemma-3-4b-it/imported-megatron/iter_0000000
        --max_steps 10 --seq_length 4096
        'dataset.source.load_kwargs={revision:"7f0115a4b758a71d6473b8d085751692da2fef98"}'
        validation.eval_iters=0 validation.eval_interval=0 checkpoint.load=null
        --save_dir work/model-verification/gemma-3-4b-it/peft-checkpoints
        --save_interval 10 logger.log_interval=1 logger.log_throughput=true
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      expected_result: >
        Pending exact-revision CORD-v2 LoRA verification with the public Gemma 3
        VL 4B H100 recipe. The run must complete at least ten optimizer steps
        with finite loss, no skipped or NaN iterations, all four metrics, and a
        reloadable adapter checkpoint.

  checkpoint_resume:
    all:
      status: unsupported
      precision: null
      depends_on: pretrain
      command: null
      last_verified: null
      metrics:
        initial_loss: null
        final_loss: null
        last_10_steps_step_time_ms_avg: null
        last_10_steps_model_tflops_per_gpu_avg: null
      resume_comparison: null
      expected_result: >
        Checkpoint-resume verification depends on a supported pretraining
        baseline. Because Megatron Bridge has no public Gemma 3 VL 4B
        pretraining recipe, there is no supported reference run or resume
        checkpoint contract for this model.
