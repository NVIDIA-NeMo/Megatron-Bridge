        iteration 100 without an extra optimizer step, and exited successfully.

  checkpoint_resume:
    H100:
      status: verified
      precision: bf16
      bridge_commit: 52601b0382f869c9ca14109acdcdef77cc4fa61a  # pragma: allowlist secret
      depends_on: pretrain
      command: >
        ./scripts/training/train.sh --nodes 1 --gpus-per-node 8
