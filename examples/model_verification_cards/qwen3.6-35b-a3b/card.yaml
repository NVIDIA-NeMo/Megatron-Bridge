        sequence length 4096, with HybridEP, Transformer Engine CUDA graphs
        over attention and the MoE router and preprocess, and no activation
        recompute. The recipe builds its model from the Qwen3.5-35B-A3B-Base
        text config at revision 0f0813072d23, which matches this card's
        language model: 40 layers (30 Gated DeltaNet, 10 gated attention),
        256 experts with natural top-8 routing, and one MTP layer. The command
