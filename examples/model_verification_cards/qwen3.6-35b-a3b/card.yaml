        'dataset.source.adapter_kwargs={resized_height:448,resized_width:448}'
        dataset.hf_processor_path=Qwen/Qwen3.6-35B-A3B
        'dataset.hf_processor_kwargs={revision:995ad96eacd98c81ed38be0c5b274b04031597b0}'
        dataset.do_validation=false scheduler.lr_decay_iters=20
        dist.distributed_timeout_minutes=30
        model.hf_model_id=Qwen/Qwen3.6-35B-A3B
        model.bos_token_id=248044 model.eos_token_id=248044
        checkpoint.hf_source_path=Qwen/Qwen3.6-35B-A3B
        checkpoint.load=null checkpoint.save=null
        validation.eval_iters=0 validation.eval_interval=0
        ddp.check_for_large_grads=true
        logger.log_interval=1 logger.log_throughput=true
        logger.tensorboard_dir=null
        logger.save_config_filepath=work/model-verification/qwen3.6-35b-a3b/medpix-long-context/resolved-config.yaml
      last_verified: 2026-07-28
      metrics:
        initial_loss: 1.997653
        final_loss: 0.997894
        last_10_steps_step_time_ms_avg: 36847.110
        last_10_steps_model_tflops_per_gpu_avg: 84.830
      expected_result: >
        The pinned 32-H100 run completed exactly 20 full-SFT steps at
        TP1/PP4/CP2/EP8/ETP1, dense DP4 and expert DP1, MBS2/GBS512, and 64-way
        gradient accumulation. It used 8192-token processor-native deferred
        in-batch packing with pad-to-multiple-of-4, fixed 448-by-448 MedPix
        images, per-token loss, and one-layer full-uniform activation
        recompute. The persisted post-setup config confirms every setting. Loss
        was finite from 1.997653 to 0.997894 with zero skipped or NaN
        iterations. After the compile-heavy first step, steps 11-20 averaged
        36,847.110 ms and 84.830 TFLOP/s/GPU; the process exited successfully.

