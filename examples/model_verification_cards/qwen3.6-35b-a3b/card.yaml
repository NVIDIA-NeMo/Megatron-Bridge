# Agent-readable model verification card.
# status: unverified | verified | unsupported | not_applicable

title: qwen3_6_35b_a3b
summary: >
  Performance disclaimer: this card does not record a canonical pretrain
  performance result; reported timing and throughput metrics are functional
  verification observations, not standalone optimized performance results.
  Full-model H100 DataComp pretraining reaches 132.830 model TFLOP/s/GPU,
  approximately 133, with natural routing. On GB200, language-only
  RedPajama2 pretraining through the early, unoptimized Qwen3.5 text
  35B-A3B library recipe, warm-started from this model's language weights,
  reaches 240.070 model TFLOP/s/GPU against a roughly 400 TFLOP/s/GPU BF16
  readiness target. Checkpoint resume is explicitly
  unverified pending a full-model rerun. This card otherwise verifies conversion,
  inference, SFT, long-context SFT, and PEFT.

  Supplementary Qwen3.5-35B-A3B validation of the shared Hybrid implementation is retained below: conversion, forward correlation, inference, 100-step training and checkpoint resume on GB300 with NeMo 26.10. Qwen3.6 statuses and its NeMo 26.06 verification provenance are unchanged; GB300 verification of Qwen3.6 remains pending. Canonical performance after the rotary graph fix remains unverified.
verification_index:
  model_level:
    verified:
      - hf_to_megatron_cpu
      - hf_to_megatron_gpu
      - megatron_to_hf_cpu
      - megatron_to_hf_gpu
      - manual_forward_pass
      - inference
  training:
    H100:
      verified:
        - pretrain
        - sft
        - sft_export_inference
        - peft
        - sft_long_context
      unverified:
        - checkpoint_resume
    GB200:
      verified:
        - pretrain
        - sft
        - peft
      unverified:
        - sft_export_inference
        - sft_long_context
        - checkpoint_resume
    GB300:
      unverified:
        - pretrain
        - sft
        - sft_export_inference
        - sft_long_context
        - peft
        - checkpoint_resume
