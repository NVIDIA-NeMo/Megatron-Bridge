  pretrain_fsdp:
    H100:
      status: verified
      precision: bf16
      enabled_features:
        megatron_fsdp: optim_grads_params
      command: >
        ./scripts/training/train.sh --nodes 4 --gpus-per-node 8
        --recipe bagel_7b_pretrain_32gpu_h100_bf16_config --mode pretrain
        --max_steps 30
        model.bagel_repo=work/dependencies/Bagel
        model.model_path=work/model-verification/bagel/native
        model.vae_path=work/model-verification/bagel/native/ae.safetensors
        model.reference_training_seed=1344
        model.reference_training_world_size=32
        model.reset_reference_training_rng=true
        dataset.dataset_root=work/data/bagel-wds
        dataset.bagel_repo=work/dependencies/Bagel
        dataset.tokenizer_model=work/model-verification/bagel/native
        dataset.seed=42 dataset.data_seed=42 rng.seed=42
        checkpoint.load=work/model-verification/bagel/seed42-mcore-init
        checkpoint.load_optim=true checkpoint.load_rng=true
        dataset.dataloader_load=work/model-verification/bagel/seed42-mcore-init
        ddp.overlap_grad_reduce=false ddp.overlap_param_gather=true
        ddp.fsdp_double_buffer=false
        checkpoint.save=null checkpoint.save_interval=0
        validation.eval_iters=0 validation.eval_interval=0
        logger.log_interval=1 logger.log_throughput=true
      last_verified: 2026-08-31
      metrics:
        initial_loss: 14.683310
        final_loss: 10.809916
        last_10_steps_step_time_ms_avg: 7697.160
        last_10_steps_model_tflops_per_gpu_avg: 234.268
        last_10_steps_tokens_per_second_per_gpu_avg: 4428.810
        peak_allocated_memory_gib: 58.594
        peak_reserved_memory_gib: 62.919
      expected_result: >
        The 32-GPU TP1/PP1/CP1/DP32 real-data run completes exactly 30 BF16
        steps at GBS/MBS 32/1 with one microbatch, block-23 language-model
        recompute, full vision recompute, Megatron FSDP, finite CE/MSE/total
        losses, and no skipped or NaN iterations. Steps 21-30 average
        7,697.160 ms, 234.268 model TFLOP/s/GPU, 23.687% MFU, and 4,428.810
        logical tokens/GPU/s from 1,090,856.3 logical tokens per step. Logical
        tokens include text, ViT, VAE-latent, and special tokens and exclude
        physical padding. The variable packed sequence length averages
        34,070.15 tokens/GPU over steps 6-30. Peak allocated/reserved memory is
        58.594/62.919 GiB. The same steps 6-30 workload reports standalone raw
        metrics of 10,167.941 ms, 176.936 model TFLOP/s/GPU, and 17.890% MFU
        under official BAGEL. Do not compute a relative speedup: that run uses
        full language-model recompute and performs an EMA update, while the
        Bridge run uses block-23 recompute without EMA.
