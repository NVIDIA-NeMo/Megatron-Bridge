    needs: [pre-flight, configure, generate-gb200-test-matrix, cicd-unit-tests-core, cicd-unit-tests-diffusion]
    runs-on: ${{ matrix.runner }}
    if: |
      (
        success()
        || needs.pre-flight.outputs.is_ci_workload == 'true'
        || (needs.configure.outputs.skip_queue == 'true' && !failure())
        || needs.pre-flight.outputs.force_run_all == 'true'
        || github.event_name == 'merge_group'
      )
      && !cancelled()
      && needs.pre-flight.outputs.is_member == 'true'
      && vars.DISABLE_GB200_TESTS != 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.configure.outputs.full_test_suite == 'true')
      && (github.event.inputs.test_suite == '' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'functional-only' || contains('L2', github.event.inputs.test_suite))
    name: gb200_${{ matrix.script }}
    environment: ${{ contains(needs.pre-flight.outputs.registry, 'azure') && 'nemo-ci' || '' }}
    env:
      HF_HOME: /home/TestData/HF_HOME
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          ref: ${{ needs.configure.outputs.merge_sha }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}

      - name: main
        uses: ./.github/actions/test-template
        with:
          script_dir: gb200/active
          script: ${{ matrix.script }}
          timeout: ${{ fromJSON(matrix.timeout || '30') }}
          is_unit_test: "false"
          has-azure-credentials: ${{ contains(needs.pre-flight.outputs.registry, 'azure') }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          github-token: ${{ steps.app-token.outputs.token }}
          container-image: ${{ env.container-registry-gb200 }}/megatron-bridge:${{ needs.configure.outputs.merge_sha }}
          test-data-path: ${{ needs.pre-flight.outputs.test_data_path }}
          runner: ${{ matrix.runner }}

  cicd-functional-tests-gb200-flaky:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite == 'all' && needs.pre-flight.outputs.is_member == 'true' && vars.DISABLE_GB200_TESTS != 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.generate-gb200-test-matrix.outputs.matrix_gb200_flaky) }}
    needs: [pre-flight, configure, generate-gb200-test-matrix, cicd-unit-tests-core, cicd-unit-tests-diffusion]
    runs-on: ${{ matrix.runner }}
    name: gb200_${{ matrix.script }}
    environment: ${{ contains(needs.pre-flight.outputs.registry, 'azure') && 'nemo-ci' || '' }}
    env:
      HF_HOME: /home/TestData/HF_HOME
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          ref: ${{ needs.configure.outputs.merge_sha }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}

      - name: main
        uses: ./.github/actions/test-template
        with:
          script_dir: gb200/flaky
          script: ${{ matrix.script }}
          timeout: ${{ fromJSON(matrix.timeout || '30') }}
          is_unit_test: "false"
          has-azure-credentials: ${{ contains(needs.pre-flight.outputs.registry, 'azure') }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          github-token: ${{ steps.app-token.outputs.token }}
          container-image: ${{ env.container-registry-gb200 }}/megatron-bridge:${{ needs.configure.outputs.merge_sha }}
          test-data-path: ${{ needs.pre-flight.outputs.test_data_path }}
          runner: ${{ matrix.runner }}

  Nemo_CICD_Test:
    needs:
      - pre-flight
      - configure
      - cicd-import-check
      - cicd-unit-tests-core
      - cicd-unit-tests-diffusion
      - cicd-functional-tests-l0
      - cicd-functional-tests-l1
      - cicd-functional-tests-l2
      - cicd-functional-tests-gb200-l0
      - cicd-functional-tests-gb200-l1
      - cicd-functional-tests-gb200-l2
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.configure.outputs.merge_sha }}

      - name: Get workflow result
        id: result
        shell: bash -e -u -o pipefail {0}
        env:
          GH_TOKEN:  ${{ github.token }}
          GH_REPO:   ${{ github.repository }}
          EXPECT_L0: ${{ needs.configure.outputs.expect_l0 }}
          EXPECT_L1: ${{ needs.configure.outputs.expect_l1 }}
          EXPECT_L2: ${{ needs.configure.outputs.expect_l2 }}
          IS_MEMBER: ${{ needs.pre-flight.outputs.is_member }}
          DISABLE_GB200_TESTS: ${{ vars.DISABLE_GB200_TESTS }}
        run: |
          # NOTE: `gh run view` must NOT be wrapped in `|| echo 0`. Doing so swallows
          # any failure (e.g. "failed to determine base repo" when git context is
          # missing) and silently sets FAILED_JOBS=0, turning the summary green even
          # when earlier jobs failed. GH_REPO makes `gh` independent of the local git
          # repository, and `set -e -o pipefail` makes any failure here abort the job.
          FAILED_JOBS=$(gh run view $GITHUB_RUN_ID --json jobs --jq '[.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")] | length')

          UNEXPECTED_SKIPS=0
          check_tier_skips() {
            local tier="$1" expect="$2"
            [ "$expect" != "true" ] && return
            local n
            n=$(gh run view $GITHUB_RUN_ID --json jobs \
              | jq --arg p "${tier}_" '[.jobs[] | select(.name | startswith($p)) | select(.conclusion == "skipped")] | length')
            if [ "${n:-0}" -gt 0 ]; then
              echo "❌ Found $n unexpectedly skipped ${tier} job(s):"
              gh run view $GITHUB_RUN_ID --json jobs \
                | jq -r --arg p "${tier}_" '.jobs[] | select(.name | startswith($p)) | select(.conclusion == "skipped") | .name'
              UNEXPECTED_SKIPS=$((UNEXPECTED_SKIPS + n))
            fi
          }

          check_tier_skips "L0" "$EXPECT_L0"
          check_tier_skips "L1" "$EXPECT_L1"
          check_tier_skips "L2" "$EXPECT_L2"
          if [[ "$IS_MEMBER" == "true" && "$DISABLE_GB200_TESTS" != "true" ]]; then
            check_tier_skips "gb200_L0" "$EXPECT_L0"
            check_tier_skips "gb200_L1" "$EXPECT_L1"
            check_tier_skips "gb200_L2" "$EXPECT_L2"
          fi

          if [ "${FAILED_JOBS:-0}" -gt 0 ]; then
            echo "❌ Found $FAILED_JOBS failed job(s):"
            gh run view $GITHUB_RUN_ID --json jobs --jq '.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped") | .name'
          fi

          if [ "${FAILED_JOBS:-0}" -gt 0 ] || [ "${UNEXPECTED_SKIPS:-0}" -gt 0 ]; then
            exit 1
          fi

          echo "✅ All previous jobs completed successfully"
          exit 0

  Coverage_Fake:
    runs-on: ubuntu-latest
    needs: [Nemo_CICD_Test, pre-flight, configure]
    if: |
      always()
      && !cancelled()
      && needs.pre-flight.outputs.is_ci_workload == 'false'
      && (
        needs.configure.outputs.docs_only == 'true'
        || needs.pre-flight.outputs.is_deployment_workflow == 'true'
        || needs.configure.outputs.perf_scripts_only == 'true'
      )
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}

      - name: Generate fake coverage report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'No code changes - coverage check skipped',
              context: 'codecov/patch'
            });

  Coverage:
    runs-on: ubuntu-latest
    needs: [Nemo_CICD_Test, pre-flight, configure]
    if: |
      needs.Nemo_CICD_Test.result == 'success'
      && needs.configure.outputs.docs_only == 'false'
      && needs.pre-flight.outputs.is_deployment_workflow == 'false'
      && needs.configure.outputs.perf_scripts_only == 'false'
      && github.event.inputs.mcore_ref == ''
      && !cancelled()
    strategy:
      matrix:
        flag:
          - unit-test
          - e2e
    steps:
      - name: Get PR info
        id: get-pr-info
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.configure.outputs.merge_sha }}

      - name: Download coverage reports of current branch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-${{ matrix.flag }}-*

      - name: Get total coverage of current branch
        shell: bash -x -e -u -o pipefail {0}
        if: always()
        run: |
          pip install coverage[toml]

          ls -al .
          ls -al coverage-*/
          coverage combine --keep $(ls coverage-*/.coverage)
          coverage report -i
          rm -rf coverage-*
          ls -al

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.flag }}
          base_sha: ${{ fromJSON(steps.get-pr-info.outputs.pr-info || '{}').base.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.flag }}-aggregated
          path: |
            .coverage
          include-hidden-files: true
