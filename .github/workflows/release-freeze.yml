name: "Code freeze"

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        options:
          - major
          - minor
      freeze-commit:
        type: string
        description: Commit SHA to use for cut-off
        required: false
        default: main
      dry-run:
        type: boolean
        description: Dry-run of code-freeze
        required: false
        default: true
permissions:
  contents: read

jobs:
  code-freeze:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_code_freeze.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-environment: megatron-bridge-release
      freeze-source-branch: main
      library-name: Megatron-Bridge
      python-package: megatron.bridge
      has-src-dir: true
      release-type: ${{ inputs.release-type }}
      freeze-commit: ${{ inputs.freeze-commit }}
      dry-run: ${{ inputs.dry-run }}
      next-pre-release: ""
      next-dev: ""
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_MAIN_CHANNEL_WEBHOOK }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_TEAM_GROUP_ID }}

  bump-docs-versions:
    needs: code-freeze
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.dry-run && 'public' || 'megatron-bridge-release' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        target: [main, release]
    env:
      RELEASE_BRANCH: ${{ needs.code-freeze.outputs.release-branch }}
      FREEZE_CUTOFF: ${{ inputs.freeze-commit && inputs.freeze-commit != 'main' && inputs.freeze-commit || github.sha }}
    steps:
      - name: Generate release App token
        if: ${{ !inputs.dry-run }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the docs target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.target == 'main' && 'main' || (inputs.dry-run && env.FREEZE_CUTOFF) || env.RELEASE_BRANCH }}
          persist-credentials: false

      - name: Update the version picker
        run: |
          version=${RELEASE_BRANCH#r}
          jq --arg ver "$version" \
            'map(select(.version != $ver)) + [{"version": $ver, "url": "https://docs.nvidia.com/nemo/megatron-bridge/\($ver)/"}]
            | sort_by(.version) | reverse' docs/versions1.json > tmp.json
          mv tmp.json docs/versions1.json

      - name: Set the release branch documentation version
        if: matrix.target == 'release'
        run: |
          version=${RELEASE_BRANCH#r}
          jq --arg ver "$version" '{version: $ver, name: "megatron-bridge"}' docs/project.json > tmp.json
          mv tmp.json docs/project.json
          sed -i "s/^release = .*/release = \"$version\"/" docs/conf.py

      - name: Check documentation changes
        run: git diff --check

      - name: Open docs version pull request
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ matrix.target == 'main' && 'main' || env.RELEASE_BRANCH }}
          branch: ci/docs-versions-${{ env.RELEASE_BRANCH }}-${{ matrix.target }}
          add-paths: |
            docs/versions1.json
            docs/project.json
            docs/conf.py
          title: Update docs versions after the ${{ env.RELEASE_BRANCH }} freeze
          body: Update the documentation version for the ${{ env.RELEASE_BRANCH }} code freeze.
          commit-message: Update docs versions for ${{ env.RELEASE_BRANCH }}
          signoff: true
