name: "Code freeze"

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        options:
          - major
          - minor
      freeze-commit:
        type: string
        description: Commit SHA to use for cut-off
        required: false
        default: main
      dry-run:
        type: boolean
        description: Dry-run of code-freeze
        required: false
        default: true
permissions:
  contents: read

jobs:
  code-freeze:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_code_freeze.yml@9804c761eea4e3afad5e98cca0234d9e46c78adf # github app authentication
    with:
      app-id: ${{ vars.BOT_ID }}
      environment-name: main
      library-name: Megatron-Bridge
      python-package: megatron.bridge
      has-src-dir: true
      release-type: ${{ inputs.release-type }}
      freeze-commit: ${{ inputs.freeze-commit }}
      dry-run: ${{ inputs.dry-run }}
      update-release-docs: true
      next-pre-release: ""
      next-dev: ""
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_MAIN_CHANNEL_WEBHOOK }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_TEAM_GROUP_ID }}
      BOT_KEY: ${{ secrets.BOT_KEY }}

  bump-docs-versions:
    needs: [code-freeze]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.code-freeze.outputs.release-branch }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}
          permission-contents: write
          permission-administration: write

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions1.json
        run: |
          version_number="${VERSION#r}"

          jq --arg ver "$version_number" \
            'if any(.[]; .version == $ver) then . else .[0:1] + [{"version": $ver, "url": "https://docs.nvidia.com/nemo/megatron-bridge/\($ver)/"}] + .[1:] end' \
            docs/versions1.json > tmp.json && mv tmp.json docs/versions1.json

      - name: Commit changes
        run: |
          git add docs/versions1.json
          if ! git diff --cached --quiet; then
            git commit -s -m "[🤖]: Update docs-versions after code-freeze for ${VERSION}"
            git push
          fi
