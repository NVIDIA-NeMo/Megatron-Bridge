name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pre-flight:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@c1a0837f362a1a696e647238ab1cf916b2a7cf4a # v1.8.6
    with:
      default_runner_prefix: ubuntu-latest
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}

  auto-review:
    name: Claude Review (auto)
    needs: [pre-flight]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.pre-flight.outputs.is_member == 'true' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'bump-ci-container-') &&
      !startsWith(github.event.pull_request.head.ref, 'cherry-pick-')
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@eac517b17ad42ccf05533a95609471d041bc658d # AUT-2166 isolated review components
    with:
      review_mode: automatic
      model: ${{ vars.CLAUDE_MODEL }}
      prompt: |
        Perform a light Megatron-Bridge code review. Keep feedback concise and actionable.
        Focus only on critical bugs or logic errors, typos, missing or insufficient tests,
        and outdated or inaccurate documentation affected by the change. Do not comment on
        formatting, minor naming, architecture or refactoring preferences, or performance
        without a clear measurable issue.

        Use inline findings for specific issues and general findings for broad observations.
        End the summary with a "Suggested test cases" bullet list derived from the diff.
        For performance configuration changes, use trusted-base source searches to enumerate
        every exact impacted test case name; do not use globs or brace expansion. If no
        performance or recipe configuration is touched, state "No perf tests impacted."
    secrets:
      NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
      NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}

  manual-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@eac517b17ad42ccf05533a95609471d041bc658d # AUT-2166 isolated review components
    with:
      review_mode: manual
      model: ${{ vars.CLAUDE_MODEL }}
      prompt: |
        Perform a light Megatron-Bridge code review. Keep feedback concise and actionable.
        Focus only on critical bugs or logic errors, typos, missing or insufficient tests,
        and outdated or inaccurate documentation affected by the change. Do not comment on
        formatting, minor naming, architecture or refactoring preferences, or performance
        without a clear measurable issue.

        Use inline findings for specific issues and general findings for broad observations.
        End the summary with a "Suggested test cases" bullet list derived from the diff.
        For performance configuration changes, use trusted-base source searches to enumerate
        every exact impacted test case name; do not use globs or brace expansion. If no
        performance or recipe configuration is touched, state "No perf tests impacted."
    secrets:
      NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
      NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
