name: Dependabot
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  bump-tags:
    permissions:
      contents: write
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-branch: latest-release
            mcore-branch: latest-release
          - target-branch: main
            mcore-branch: main
          - target-branch: main
            mcore-branch: dev
    uses: ./.github/workflows/_update_dependencies.yml
    with:
      target-branch: ${{ matrix.target-branch }}
      mcore-branch: ${{ matrix.mcore-branch }}
    secrets:
      PR_APP_PRIVATE_KEY: ${{ secrets.PR_APP_PRIVATE_KEY }}

  notify:
    if: failure()
    runs-on: ubuntu-latest
    needs: [bump-tags]
    steps:
      - name: Notify
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_CHANNEL_WEBHOOK }}
          SLACK_WEBHOOK_ADMIN: <!subteam^${{ secrets.SLACK_TEAM_GROUP_ID }}>
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":robot_joy: <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Mcore-bump-bot workflow> failed. Please fix manually.\n\ncc ${SLACK_WEBHOOK_ADMIN}\"}" \
            "$SLACK_WEBHOOK"
