name: Dependabot
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  get-release-branch-names:
    runs-on: ubuntu-latest
    outputs:
      megatron-bridge: ${{ steps.get-branch.outputs.megatron_bridge_release_branch }}
      mcore: ${{ steps.get-branch.outputs.mcore_latest_branch }}
    steps:
      - name: Get release branch names
        id: get-branch
        shell: bash
        run: |
          latest_branch=$(git ls-remote --heads https://github.com/NVIDIA-NeMo/Megatron-Bridge.git 'refs/heads/r*' |
            sed -nE 's|^.*refs/heads/(r[0-9]+\.[0-9]+\.[0-9]+)$|\1|p' |
            sort -V |
            tail -n1)
          test -n "$latest_branch"
          echo "megatron_bridge_release_branch=$latest_branch" | tee -a "$GITHUB_OUTPUT"

          mcore_latest_branch=$(git ls-remote --heads https://github.com/NVIDIA/Megatron-LM.git 'refs/heads/core_r*' |
            sed -nE 's|^.*refs/heads/(core_r[0-9]+\.[0-9]+\.[0-9]+)$|\1|p' |
            sort -V |
            tail -n1)
          test -n "$mcore_latest_branch"
          echo "mcore_latest_branch=$mcore_latest_branch" | tee -a "$GITHUB_OUTPUT"

  bump-tags:
    needs: [get-release-branch-names]
    permissions:
      contents: write
      checks: read
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-branch: ${{ needs.get-release-branch-names.outputs.megatron-bridge }}
            mcore-branch: ${{ needs.get-release-branch-names.outputs.mcore }}
          - target-branch: main
            mcore-branch: main
          - target-branch: main
            mcore-branch: dev
    uses: ./.github/workflows/_update_dependencies.yml
    with:
      target-branch: ${{ matrix.target-branch }}
      mcore-branch: ${{ matrix.mcore-branch }}
    secrets:
      PR_APP_PRIVATE_KEY: ${{ secrets.PR_APP_PRIVATE_KEY }}

  notify:
    if: failure()
    runs-on: ubuntu-latest
    needs: [bump-tags]
    steps:
      - name: Notify
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_CHANNEL_WEBHOOK }}
          SLACK_WEBHOOK_ADMIN: <!subteam^${{ secrets.SLACK_TEAM_GROUP_ID }}>
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\":robot_joy: <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Mcore-bump-bot workflow> failed. Please fix manually.\n\ncc ${SLACK_WEBHOOK_ADMIN}\"}" \
            "$SLACK_WEBHOOK"
